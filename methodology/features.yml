# Every feature the site shows or hides, and the verdict on it (#947, #936 rule 1).
#
# The Methodology page leads with this list as its verdict table. Each feature says:
#   verdict     validated   passed an out-of-sample check (its ADR names the bar)
#               failed      failed its check: hidden or badged until a rework passes
#               open        not yet judged: hidden or badged until it is
#               data        facts, or arithmetic on facts and on validated numbers: no check needed
#   switch      its key in web/src/lib/visibility.ts, which decides whether the pages show it;
#               a test holds the two to each other (web/src/lib/features.test.ts)
#   shown       for a feature with no switch: shown, badged (shown with "not yet validated") or hidden
#   adr, issue  where its verdict is recorded and where its next judgement is tracked
#   parameters  the registry entries (methodology/parameters.yml) it is built on
#   next        when it is next judged; dates (YYYY-MM-DD) and bar (the pass bar's comment) when set
#
# The web reads it through web/src/generated/features.ts (uv run python -m ops.parameters).

pages:
  rankings: {label: Rankings, path: /}
  player: {label: Player page}
  team: {label: My Team, path: /team/}
  pickups: {label: Pickups, path: /streamers/}
  trade: {label: Trade, path: /trade/}
  league: {label: League, path: /league/}
  draft: {label: Draft, path: /draft/}
  site: {label: Every page}

