# Every number the site's models and decisions use (#765, epic #751).
#
# Each entry says what the number does, how it was set and what will test it:
#   status   measured    fitted or backtested on data (evidence names where)
#            assumed     chosen without a measurement: a candidate for the walk-forward harness
#            convention  a fantasy-platform default (an auction budget), not a model choice
#            arithmetic  derived from the schedule or the definitions, not chosen
#   kind     model       shapes a projection or a probability
#            threshold   turns a number into a call (even, bad, worth a move)
#            search      how far a search looks (candidates tried); changes results, not values
#   validation  the issue that will backtest it out of sample (#754-#763)
#
# The web reads these through web/src/generated/parameters.ts (uv run python -m ops.parameters);
# the dbt entries name the var they mirror (dbt:<path>) and a test holds the two equal. CI fails
# on a numeric literal in a decision module that is neither here nor marked as a definition.

parameters:
  # ---- the value scale (dbt vars; ADR 0019): the league every value is measured above
  - id: scale.teams
    value: {nba: 12, wnba: 10}
    dbt: fantasy.*.teams
    kind: model
    status: convention
    what: "Teams in the default league: replacement level is this many players after the pool. A league's own setup replaces it in the browser."
    evidence: "the common platform default"
    validation: 754
  - id: scale.roster_spots
    value: {nba: 13, wnba: 10}
    dbt: fantasy.*.roster_spots
    kind: model
    status: convention
    what: "Roster spots per team in the default league: the pool is teams x roster spots."
    evidence: "the common platform default"
    validation: 754

  # ---- the projection (dbt vars; ADR 0009 holds the backtests)
  - id: projection.fantasy_recency
    value: [1.0, 0.25, 0.08]
    dbt: fantasy_recency
    kind: model
    status: measured
    what: "Weights of the current season and the two before it in per-minute production."
    evidence: "ADR 0009: in-sample grid; out of sample [1, 0.5, 0.25] made no difference"
    validation: 754
  - id: projection.prior_games
    value: {nba: 3, wnba: 5}
    dbt: fantasy.*.prior_games
    kind: model
    status: measured
    what: "Games of a replacement-level player every projection starts from; a past season's line is shrunk by the same before it sets that season's value scale (ADR 0019)."
    evidence: "ADR 0009"
    validation: 754
  - id: projection.minutes_recency
    value: {nba: [1.0, 0.25, 0.08], wnba: [1.0, 0.06, 0.02]}
    dbt: fantasy.*.minutes_recency
    kind: model
    status: measured
    what: "Weights of the current season and the two before it in minutes per game."
    evidence: "ADR 0009"
    validation: 754
  - id: projection.durability_games
    value: {nba: 10, wnba: 60}
    dbt: fantasy.*.durability_games
    kind: model
    status: measured
    what: "Games that regress the share of team games played toward typical_share."
    evidence: "ADR 0009 (WNBA: every value from 5 to 120 scored within a tenth)"
    validation: 754
  - id: projection.typical_share
    value: 0.8
    dbt: fantasy_durability.typical_share
    kind: model
    status: assumed
    what: "The share of team games a player is regressed toward."
    evidence: "none: no fit shown"
    validation: 754
  - id: projection.team_change
    value: 0.25
    dbt: fantasy_team_change
    kind: model
    status: measured
    what: "The share of its minutes weight a past season spent mostly on another team keeps."
    evidence: "ADR 0009"
    validation: 754
  - id: projection.recent_minutes
    value: 0.5
    dbt: fantasy_recent_minutes
    kind: model
    status: measured
    what: "Weight of the last five games in projected minutes, in season."
    evidence: "ADR 0009 (next-ten-game minutes error 3.98 to 3.44 NBA)"
    validation: 754
  - id: projection.return_ramp
    value: {min_games_missed: 3, per_game_missed: 0.01, max_cut: 0.5, games_back: 2}
    dbt: fantasy_return_ramp
    kind: model
    status: measured
    what: "Minutes cut for a player back from three or more straight games missed."
    evidence: "ADR 0009 (grid, out of sample)"
    validation: 754
  - id: projection.rest_risk
    value: {nba: {extra_sit_out: 0.29, min_minutes: 28}, wnba: {extra_sit_out: 0.0, min_minutes: 28}}
    dbt: fantasy_rest_risk
    kind: model
    status: measured
    what: "Extra share of games a regular sits on a team with nothing to play for."
    evidence: "ADR 0010, notebook 03 (NBA +29 points, 22 to 36). The 28-minute cut was not optimised"
    validation: 754
  - id: projection.market_prior
    value: {leagues: [nba], weight: 0.45, fade_games: 20}
    dbt: market_prior
    kind: model
    status: measured
    what: "In the leagues listed: the weight a player's value per game gives the board's value of his rank in ESPN's draft order, falling linearly to nothing by fade_games games of the season being played."
    evidence: "ADR 0020: fitted on NBA 2020-21 to 2022-23 (runs 42456036003, 42456038211, 42456040262); judged out of sample on 2023-24 and 2024-25 (runs 42458451893, 42458454350): preseason RMSE -0.165 and -0.218, Spearman +0.029 and +0.028, top pool +4.5 and +3.8 points, nothing measurable at half way. The WNBA has no past market to test on, so it is off there"
    validation: 832
  - id: projection.features.pace
    value: {nba: 0.0, wnba: 1.5}
    dbt: projection_features.*.pace
    kind: model
    status: measured
    what: "The pace feature: each per-minute counting rate is multiplied by (the current team's expected pace / the pace of the games the rates were made in) to this power. 0 is off."
    evidence: "ADR 0029: fitted on WNBA 2021 to 2023 and NBA 2020-21 to 2022-23, judged on WNBA 2024 and 2025 and NBA 2023-24 and 2024-25 (runs 42518229324 to 42518238385 WNBA, 42518215822 to 42518225161 NBA). Pooled RMSE of value per game, on minus off, 95% paired bootstrap: WNBA 1.5 enters, -0.0097 (-0.0152 to -0.0046), no checkpoint worse past 0.010; NBA 1.0 fails, +0.0034 (+0.0005 to +0.0065), so it is off there. 1.5 is the grid's edge"
    validation: 771
  - id: projection.features.usage_weight
    value: {nba: 8.0, wnba: 1.0}
    dbt: projection_features.*.usage_weight
    kind: model
    status: measured
    what: "The usage feature: the current season's usage rate counts this many times its production weight, and the volume categories (points, threes, turnovers, shots, free throws) move with the ratio of that usage to the production-weighted one. 1 is off."
    evidence: "ADR 0029 (seasons and runs as projection.features.pace): NBA 8 enters, pooled RMSE -0.0042 (-0.0074 to -0.0005), Spearman +0.0006 (-0.0002 to +0.0013); WNBA 8 fails, +0.0004 (-0.0095 to +0.0107), and +0.018 at 2024's tenth, so it is off there. 8 is the grid's edge"
    validation: 771
  - id: projection.features.fg_shrink
    value: {nba: 50, wnba: 50}
    dbt: projection_features.*.fg_shrink
    kind: model
    status: measured
    what: "The efficiency feature, field goals: attempts at the league's percentage added to a player's weighted makes and attempts. 0 is off."
    evidence: "ADR 0029 (seasons and runs as projection.features.pace), fitted and judged with ft_shrink: NBA 50 and 25 enter, pooled RMSE -0.0161 (-0.0218 to -0.0103), Spearman +0.0030 (+0.0017 to +0.0044); WNBA 50 and 10 enter, -0.0204 (-0.0413 to -0.0019)"
    validation: 771
  - id: projection.features.ft_shrink
    value: {nba: 25, wnba: 10}
    dbt: projection_features.*.ft_shrink
    kind: model
    status: measured
    what: "The efficiency feature, free throws: attempts at the league's percentage added to a player's weighted makes and attempts. 0 is off."
    evidence: "ADR 0029: fitted and judged with fg_shrink (see projection.features.fg_shrink)"
    validation: 771
  - id: projection.features.other_team_production
    value: {nba: 1.0, wnba: 1.0}
    dbt: projection_features.*.other_team_production
    kind: model
    status: measured
    what: "The role-change feature: the share of its production weight a past season spent mostly on another team keeps. 1 is off."
    evidence: "ADR 0029 (seasons and runs as projection.features.pace): no grid point lowered the tuning RMSE in either league, so it was not judged and stays off"
    validation: 771
  - id: projection.calibration_min_listings
    value: 300
    dbt: calibration_min_listings
    kind: model
    status: assumed
    what: "Listings a league needs before its own injury history replaces the NBA's."
    evidence: "none"
    validation: 763
  - id: projection.regular_season_games
    value: {nba: 82}
    dbt: regular_season_games
    kind: model
    status: arithmetic
    what: "Regular-season games per NBA team while the schedule lists Cup placeholders."
    evidence: "the league's format"
    validation: 754

  # ---- matchups (dbt vars)
  - id: matchup.weights
    value: {nba: {defense: 0.21, pace: 0.08}, wnba: {defense: 0.14, pace: 0.06}, prior_games: 10}
    dbt: fantasy_matchup
    kind: model
    status: measured
    what: "Value per game per standard deviation of the opponent's defence and the pace."
    evidence: "ADR 0009 (replay); notebook 03 re-checks against the betting line"
    validation: 762

  # ---- the standings model (web/src/lib/standings.ts; ADR 0015)
  - id: standings.game_spread
    value:
      nba: {z_points: 1.14, z_rebounds_total: 1.1, z_assists: 1.03, z_steals: 3.12, z_blocks: 1.77, z_three_pointers_made: 1.61, z_turnovers: 1.63, z_field_goal_pct: 2.85, z_free_throw_pct: 2.67}
      wnba: {z_points: 1.13, z_rebounds_total: 1.05, z_assists: 1.07, z_steals: 2.47, z_blocks: 1.62, z_three_pointers_made: 1.43, z_turnovers: 1.82, z_field_goal_pct: 2.69, z_free_throw_pct: 2.83}
    kind: model
    status: measured
    what: "One game's standard deviation of a player's output per category, in board z units."
    evidence: "ADR 0015 (an ad hoc lakehouse query). With standings.spread_scale, the head-to-head chances it sets passed out of sample in #755 (ADR 0021)"
    validation: 755
  - id: standings.games_per_week
    value: {nba: 3.3, wnba: 2.6}
    kind: model
    status: arithmetic
    what: "Games a team plays in a fantasy week: a season's games over its weeks."
    evidence: "the schedules"
    validation: 755
  - id: standings.rival_min_share
    value: 0.5
    kind: threshold
    status: assumed
    what: "Share of a roster a team needs entered before it counts as a rival in the standings."
    evidence: "none: a rule for a league still being entered, which #755's full simulated leagues cannot test"
    validation: 755
  - id: standings.spread_scale
    value: {nba: 2.0, wnba: 2.0}
    kind: model
    status: measured
    what: "Multiplies the games' spread of the gap between two teams, in both formats: what the measured per-game spreads miss (a projection's own error over a week, games that are not independent)."
    evidence: "ops.standings_backtest fit on the tuning seasons, the lowest head-to-head log loss on a grid of 0.5 to 2.0: NBA 2020-21 to 2022-23 (runs 42466140329, 42468833908, 42466144841), log loss 0.693 at 1 to 0.629; WNBA 2021 to 2023 (runs 42468836211, 42466314090, 42466316345), 0.689 to 0.640. Both sit at the grid's edge"
    validation: 755
  - id: standings.projection_spread
    value: {nba: 0.8, wnba: 0.8}
    kind: model
    status: measured
    what: "A projection's own error per category and player, added to a rotisserie season's spread."
    evidence: "ops.standings_backtest fit on the same tuning seasons with the spread scale fixed, grid 0 to 1.5: rotisserie log loss NBA 0.569 at the assumed 0.3 to 0.518, WNBA 0.587 to 0.565. Judged (ADR 0021): calibrated in season, too wide at the first game day (slope 1.8 to 2.4), so rotisserie chances failed. The rework by games left (#866, ADR 0022) found no horizon in it: refitted leaving one tuning season out, the part that falls with the games left came out 0 in all six folds, and the first game day stayed too timid (pooled slope 1.52)"
    validation: 898

  # ---- playoff odds and the playoff weeks (web/src/lib/playoff-odds.ts, playoff-weeks.ts; #821)
  - id: playoffs.teams
    value: {nba: 6, wnba: 4}
    kind: threshold
    status: convention
    what: "Teams that make the playoffs in a league entered by hand; an ESPN import reads its own."
    evidence: "the common platform default for a 12-team NBA league (half the teams); a third of the default 10-team WNBA league, its season being shorter"
    validation: 872
  - id: playoffs.weeks
    value: {nba: 3, wnba: 2}
    kind: model
    status: convention
    what: "Fantasy weeks the playoffs take, the last of the schedule, in a league entered by hand; an ESPN import reads its own."
    evidence: "the common platform default: three rounds over the regular season's last three weeks (NBA), two (WNBA)"
    validation: 872
  - id: playoffs.simulations
    value: 2000
    kind: search
    status: arithmetic
    what: "Seasons the playoff odds play out: the odds' sampling error is at most 1.1 points (the binomial standard error at 50%)."
    evidence: "sqrt(0.25 / 2000) = 0.011"
    validation: 872
  - id: playoffs.season_share
    value: {nba: 0.3, wnba: 0.2}
    kind: model
    status: measured
    what: "The playoff odds (#872): the share of a week's category spread that lasts all season (a projection's miss repeats every week). Each simulated season draws one shift per team and category from it; 0 draws every week independently."
    evidence: "ops.playoff_backtest fit on the tuning seasons (the #755 runs' inputs), grid 0 to 0.8, the lowest mean log loss of the odds over the checkpoints and both tallies: NBA 0.6057 at 0 to 0.5961, WNBA 0.5585 to 0.5552. At 0 the tuning slopes were 0.31 to 1.13, mostly under 0.8: independent weeks made the odds too sure. Judged (ADR 0025, runs 42498681135, 42498686229, 42498692099, 42498697513): the odds beat the coin and the naive manager everywhere, but the matchups tally is too timid in three of four seasons (slopes up to 1.41) and the categories tally too sure in WNBA 2025 (0.75). A share per tally (#900, ADR 0028), judged by leaving one tuning season out with the spread scale refitted in each fold (2.0 in all six): the matchups tally wants less (0 to 0.2 against 0.2 to 0.5) but 0 of 6 folds pass, single seasons' slopes swinging both ways (0.33 to 1.69 at the first game day) while the six pooled pass (0.90 to 1.02); held-out log loss per tally 0.5786 and 0.5737 against one share's 0.5784 and 0.5749, not better in both, so the one share stays"
    validation: 907
  - id: playoffs.points_spread_share
    value: {nba: 0.271, wnba: 0.35}
    kind: model
    status: measured
    what: "A points league's playoff odds (#877): the standard deviation of a week's fantasy-points margin between two teams, as a share of the league's average team."
    evidence: "ops.points_backtest fit on the tuning seasons (#891; runs 42514378363, 42514380629, 42514383087, 42514385913, 42514388109, 42514390535, the #755 leagues drafted by projected fantasy points, ESPN default scoring): the share making the weekly margin's z-scores unit-variance, sqrt(mean (r - mu)^2) over every week from each checkpoint on, league and pair, each checkpoint weighted equally. NBA 0.271 (checkpoints 0.235 to 0.304), WNBA 0.35 (0.296 to 0.409): the z-scores had a standard deviation of 1.59 (NBA) and 2.06 (WNBA) at the prior 0.17, which assumed a third of a player's mean a game over 35 games a week, doubled. Judged (ADR 0029, runs 42519149453, 42519152350, 42519156785, 42519159987): the weekly z-scores at the measured spread have a standard deviation of 0.87 to 1.08 out of sample, but the odds fail, too sure at the NBA's first game day (slopes 0.62 and 0.10, the coin not beaten) and in places in season (0.70 to 0.77)"
    validation: 913
  - id: playoffs.points_season_share
    value: {nba: 0.0, wnba: 0.0}
    kind: model
    status: measured
    what: "A points league's playoff odds (#891): the share of a week's fantasy-points margin variance that lasts all season (a projection's miss repeats every week), as playoffs.season_share is for the categories. Each simulated season draws one shift per team from it; 0 draws every week independently."
    evidence: "ops.points_backtest fit on the tuning seasons (#891, the same runs), grid 0 to 0.8, the lowest mean log loss of the odds at the measured spread: 0 in both leagues, on the grid's edge (NBA 0.5905 at 0 to 0.6161 at 0.8, WNBA 0.5690 to 0.5856). The tuning slopes at 0 were 0.23 to 1.11 at the first game day (0.23 to 0.70 in the NBA) and 0.72 to 1.57 after it"
    validation: 913

  # ---- Fit weights before the standings model applies (web/src/lib/league-value.ts, matchup.ts)
  - id: fit.thirds
    value: {weak: 1.5, middle: 1.0, strong: 0.5}
    kind: model
    status: assumed
    what: "Category weights for the weakest, middle and strongest thirds, when no rival roster is in."
    evidence: "an arm of #755's decision replay (ADR 0021): neither it nor the standings weights reliably beat equal weights"
    validation: 868
  - id: matchup.game_spread
    value:
      nba: {z_points: 17.322, z_rebounds_total: 5.563, z_assists: 4.24, z_steals: 1.787, z_blocks: 1.264, z_three_pointers_made: 2.231, z_turnovers: 2.403, z_field_goal_pct: 2.177, z_free_throw_pct: 0.964}
      wnba: {z_points: 8.676, z_rebounds_total: 3.841, z_assists: 2.231, z_steals: 1.362, z_blocks: 0.895, z_three_pointers_made: 1.145, z_turnovers: 1.7, z_field_goal_pct: 1.7, z_free_throw_pct: 0.852}
    kind: model
    status: measured
    what: "The week's matchup card (#869): one game's spread of a player's output per category, in the category's own unit (a percentage's as makes minus the pool's rate times attempts), behind each category's chance. It carries what the projection misses over a week, not only the game's own noise."
    evidence: "ops.closeness_backtest fit on the tuning seasons, each category's lowest log loss on a grid of 0.01 to 100 in 2.5% steps: NBA 2020-21 to 2022-23 (runs 42494531714, 42494538368, 42494544319, 71 weeks), log loss 0.539 to 0.654 by category against a coin's 0.693; WNBA 2021 to 2023 (runs 42494550191, 42494555493, 42494560975, 51 weeks), 0.530 to 0.669. Judged (ADR 0026), the card's chances beat a coin flip and the naive manager in NBA 2023-24, 2024-25 and WNBA 2024, 2025 (runs 42503278616, 42503283927, 42503289028, 42503294592), calibration slope 0.82 to 0.99"
    validation: 869
  - id: matchup.closeness
    value: {nba: 0.05, wnba: 0.05}
    kind: threshold
    status: assumed
    what: "The week's matchup card (#869): a category whose chance of being won lies within this of 50% is called too close."
    evidence: "none: the value the share rule used, read as a chance band. The rule declared on #869 fitted the band by a stream replay, which proved degenerate (ADR 0026): it picked 0 (NBA) and 0.40, the grid's edge (WNBA), and failed out of sample in NBA 2024-25 and WNBA 2025. The replay measures need-chip targeting, not a coin flip"
    validation: 902

  # ---- keeping an imported league current (web/src/lib/league-sync.ts, components/LeagueSync.tsx)
  - id: sync.every_minutes
    value: 15
    kind: threshold
    status: assumed
    what: "Minutes an ESPN league's copy stands before a visit, or a page left open and in view, reads the league and today's scoreboard again."
    evidence: "none; a balance of a live score against ESPN's load: ESPN caches the league for 5 minutes (Cache-Control max-age=300), so a shorter wait gains little"
    validation: 875

  # ---- the one-line player notes (web/src/lib/player-notes.ts, #879)
  - id: notes.stand_days
    value: 1
    kind: threshold
    status: assumed
    what: "Days after the day a player's note was written (Eastern) that the pages still show it, marked with when it was written: the daily run replaces it, so a day's grace covers one run the model missed."
    evidence: "none; the daily cadence of the player-notes workflow"
    validation: 879
  - id: notes.late_hours
    value: 30
    kind: threshold
    status: assumed
    what: "Hours since the last daily run drafted the player notes before Data Health says they were not drafted."
    evidence: "none; a day between daily runs, plus GitHub's schedule lag (runs observed up to about three hours late, ingest.yml) and the run itself"
    validation: 879

  # ---- trade verdicts (web/src/lib/trade-fairness.ts, trade-impact.ts, trade-suggest.ts)
  - id: trade.value_limits
    value: {bad: -0.15, terrible: -0.3}
    kind: threshold
    status: assumed
    what: "Value lens: the share given away that makes a trade bad or terrible."
    evidence: "judged on #756 (ADR 0023): the declared fit set them from the meaningful gain and collapsed to 0 in the NBA (-0.03 and -0.07 in the WNBA); they failed out of sample, so these assumed values stay. Trades they call bad or terrible lost in every judged season"
    validation: 886
  - id: trade.market_limits
    value: {bad: -0.2, terrible: -0.35}
    kind: threshold
    status: assumed
    what: "Market lens: the share given away that makes a trade bad or terrible."
    evidence: "judged on #756 (ADR 0023): the declared fit collapsed them to 0 in the NBA and they failed out of sample, so these assumed values stay"
    validation: 886
  - id: trade.category_limits
    value: {bad: 2, terrible: 5}
    kind: threshold
    status: assumed
    what: "Category lens: expected categories lost that make a trade bad or terrible."
    evidence: "the scale the lens limits were fitted on in #756 (ADR 0023); trades the lenses call bad or terrible lost in every judged season"
    validation: 886
  - id: trade.disagreement
    value: 0.35
    kind: threshold
    status: assumed
    what: "Gap between the value and market lenses that is called a disagreement."
    evidence: "reported in #756 (ADR 0023): what happened went the value lens's way in 38% to 51% of NBA disagreements"
    validation: 886
  - id: trade.even
    value: {value: 0.1, market: 0.15}
    kind: threshold
    status: assumed
    what: "The band within which each lens calls a trade even."
    evidence: "judged on #756 (ADR 0023): the declared fit called nothing even in the NBA and missed its band in the WNBA. At these assumed values, WNBA even trades were calibrated (reported, not gated)"
    validation: 886
  - id: trade.category_change
    value: 0.02
    kind: threshold
    status: assumed
    what: "A category's win chance must move this much to be listed as up or down."
    evidence: "judged on #756 (ADR 0023): a category listed up gained share against the rivals and one listed down lost it, with intervals clear of zero in every judged season"
    validation: 756
  - id: trade.chance_bands
    value: {conceding: 0.25, locked: 0.75}
    kind: threshold
    status: assumed
    what: "Win chances below or above which a category is conceded or locked."
    evidence: "judged on #756 (ADR 0023): conceded categories were won 15% to 23% of the time and locked ones 76% to 85%, close to their chances, in every judged season"
    validation: 756
  - id: trade.meaningful_gain
    value: 0.05
    kind: threshold
    status: assumed
    what: "Expected categories a trade must add to count (per rival in rotisserie)."
    evidence: "judged on #756 (ADR 0023): the declared replay fit picked 0.00 in the NBA (runs 42478335636, 42478338072, 42478340676) and 0.01 in the WNBA (runs 42478343718, 42478346505, 42478349501), the grid's edge. Judged out of sample, the verdict failed, so this assumed value stays"
    validation: 886
  - id: trade.suggest
    value: {tolerance: 0.15, min_gain: 0.05}
    kind: threshold
    status: assumed
    what: "Suggestions: how far from even a package may be, and the least it must gain."
    evidence: "judged on #756 (ADR 0023): the suggestions lost to the naive manager's package in NBA 2023-24 and both WNBA seasons"
    validation: 887
  - id: trade.search
    value: {max_add: 3, max_add_both: 2, candidates: 8, pool: 16, per_partner: 3}
    kind: search
    status: assumed
    what: "How many players a suggestion adds (fewer when both sides are already set), and how many it and the finder try."
    evidence: "judged as part of the finder and the suggestions on #756 (ADR 0023)"
    validation: 888
  # ---- the Trade page's players (web/src/lib/trade-players.ts)
  - id: trade.form_hot
    value: 1.5
    kind: threshold
    status: assumed
    what: "Last-ten form against the projection, summed over the kept categories, past which a player is hot (or, below its negative, cold) and the timing note says sell high or buy low."
    evidence: "none; a round number carried over from the Trade page (#694), never measured. Not the board's buy low, sell high swing (buysell.min_swing), which is judged in ADR 0027"
    validation: 886
  - id: trade.profile_cut
    value: 0.5
    kind: threshold
    status: assumed
    what: "A category's value above which it is one of a player's strong categories, or below whose negative it is his weak one."
    evidence: "none; a round number carried over from the Trade page (#694), never measured. It labels a player and changes no verdict"
    validation: 886

  # ---- roster review (web/src/lib/roster-upgrades.ts)
  - id: roster.starter_share
