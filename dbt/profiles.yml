# Two engines, one project. Select with DBT_TARGET (default duckdb).
#
#   duckdb      local development and CI; fantasyscout.duckdb in the project dir unless DBT_DUCKDB_PATH is set
#   databricks  the lakehouse; needs DATABRICKS_TOKEN plus the host and warehouse path
#               (DBT_DATABRICKS_HOST is the bare hostname, DBT_DATABRICKS_HTTP_PATH the
#               warehouse's /sql/1.0/warehouses/<id>)
fantasyscout:
  target: "{{ env_var('DBT_TARGET', 'duckdb') }}"
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'fantasyscout.duckdb') }}"
      threads: 4
    databricks:
      type: databricks
      host: "{{ env_var('DBT_DATABRICKS_HOST', '') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      catalog: fantasyscout
      schema: bronze
      threads: 4
