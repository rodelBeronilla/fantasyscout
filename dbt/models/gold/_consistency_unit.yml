unit_tests:
  - name: game_value_on_the_board_scale
    description: >
      Each game is valued against the season pool (#747). Three players differ only in points: their
      averages 20, 0 and 10 give a pool mean of 10 and a standard deviation of 10, so a's games of 10,
      20 and 30 points are worth 0, 1 and 2, b's -1 each and c's 0. Every other category is zero for
      everyone and adds nothing; a game not played has no value.
    model: int_player_game_value
    given:
      - input: ref('fct_player_game')
        rows:
          - {league: nba, season: '2025-26', game_id: g1, player_id: a, played: true, minutes: 30, points: 10, rebounds_total: 0, assists: 0, steals: 0, blocks: 0, three_pointers_made: 0, turnovers: 0, field_goals_made: 0, field_goals_attempted: 0, free_throws_made: 0, free_throws_attempted: 0}
          - {league: nba, season: '2025-26', game_id: g2, player_id: a, played: true, minutes: 30, points: 20, rebounds_total: 0, assists: 0, steals: 0, blocks: 0, three_pointers_made: 0, turnovers: 0, field_goals_made: 0, field_goals_attempted: 0, free_throws_made: 0, free_throws_attempted: 0}
          - {league: nba, season: '2025-26', game_id: g3, player_id: a, played: true, minutes: 30, points: 30, rebounds_total: 0, assists: 0, steals: 0, blocks: 0, three_pointers_made: 0, turnovers: 0, field_goals_made: 0, field_goals_attempted: 0, free_throws_made: 0, free_throws_attempted: 0}
          - {league: nba, season: '2025-26', game_id: g1, player_id: b, played: true, minutes: 20, points: 0, rebounds_total: 0, assists: 0, steals: 0, blocks: 0, three_pointers_made: 0, turnovers: 0, field_goals_made: 0, field_goals_attempted: 0, free_throws_made: 0, free_throws_attempted: 0}
          - {league: nba, season: '2025-26', game_id: g2, player_id: b, played: true, minutes: 20, points: 0, rebounds_total: 0, assists: 0, steals: 0, blocks: 0, three_pointers_made: 0, turnovers: 0, field_goals_made: 0, field_goals_attempted: 0, free_throws_made: 0, free_throws_attempted: 0}
          - {league: nba, season: '2025-26', game_id: g1, player_id: c, played: true, minutes: 25, points: 10, rebounds_total: 0, assists: 0, steals: 0, blocks: 0, three_pointers_made: 0, turnovers: 0, field_goals_made: 0, field_goals_attempted: 0, free_throws_made: 0, free_throws_attempted: 0}
          - {league: nba, season: '2025-26', game_id: g2, player_id: c, played: true, minutes: 25, points: 10, rebounds_total: 0, assists: 0, steals: 0, blocks: 0, three_pointers_made: 0, turnovers: 0, field_goals_made: 0, field_goals_attempted: 0, free_throws_made: 0, free_throws_attempted: 0}
          - {league: nba, season: '2025-26', game_id: g3, player_id: d, played: false, minutes: null, points: null, rebounds_total: null, assists: null, steals: null, blocks: null, three_pointers_made: null, turnovers: null, field_goals_made: null, field_goals_attempted: null, free_throws_made: null, free_throws_attempted: null}
    expect:
      rows:
        - {game_id: g1, player_id: a, game_value: 0.0}
        - {game_id: g2, player_id: a, game_value: 1.0}
        - {game_id: g3, player_id: a, game_value: 2.0}
        - {game_id: g1, player_id: b, game_value: -1.0}
        - {game_id: g2, player_id: b, game_value: -1.0}
        - {game_id: g1, player_id: c, game_value: 0.0}
        - {game_id: g2, player_id: c, game_value: 0.0}

  - name: consistency_spread_floor_and_ceiling
    description: >
      A player's games worth 0, 1 and 2 have a mean of 1, a spread of 1, and 20th and 80th
      percentile games of 0.4 and 1.6 (#747); a player with one game has no spread.
    model: mart_player_consistency
    given:
      - input: ref('int_player_game_value')
        rows:
          - {league: nba, season: '2025-26', game_id: g1, player_id: a, game_value: 0.0}
          - {league: nba, season: '2025-26', game_id: g2, player_id: a, game_value: 1.0}
          - {league: nba, season: '2025-26', game_id: g3, player_id: a, game_value: 2.0}
          - {league: nba, season: '2025-26', game_id: g1, player_id: b, game_value: -1.5}
    expect:
      rows:
        - {player_id: a, games: 3, game_value_mean: 1.0, game_value_sd: 1.0, game_floor: 0.4, game_ceiling: 1.6}
        - {player_id: b, games: 1, game_value_mean: -1.5, game_value_sd: null, game_floor: -1.5, game_ceiling: -1.5}
