version: 2

models:
  - name: int_league_season_state
    description: "Where each league stands today, one row per league: the latest season by four definitions (games in gold, season lines, standings, schedule) and two in-season switches. The gold models read the definition they mean from here instead of deriving their own; in the preseason the standings season can be the new one while the games season is last year's, which is why they are named apart."
    columns:
      - name: league
        description: "nba or wnba"
        data_tests: [unique, not_null]
      - name: games_season
        description: "The latest season with a game in fct_player_game (mart_streamers)"
      - name: zscores_season
        description: "The latest season with a season line in mart_category_zscores (mart_player_projection)"
      - name: standings_season
        description: "The latest season with published standings (fct_team_stakes)"
      - name: schedule_season
        description: "The latest season on the schedule"
      - name: in_season_window
        description: "A scheduled game within three days either side of today (ops.feed_freshness)"
      - name: regular_games_left
        description: "The zscores season still has regular-season games to play (the projection's recent-form blend)"
      - name: as_of_date
        description: "The date the row was computed for (Eastern today, or the as_of var)"
  - name: int_player_news_latest
    description: "The newest headline about each player with a flag (injury, return, role...) in the last three days, shown beside the injury tag on the Board and Streamers. One row per player."
    columns:
      - name: league
        description: "nba or wnba"
      - name: stats_player_id
        description: "League player id"
      - name: news_flag
        description: "The headline's flag: injury, return, role, trade or signing"
      - name: news_headline
        description: "The headline"
      - name: news_date
        description: "The headline's publish date (Eastern)"
  - name: int_player_projection_parts
    description: "The parts of the projection (mart_player_projection), one row per player on a current roster: projected minutes, the games share, and the weighted sums its per-minute rates are made of (wsum_<stat>, rate_weight_<season>), with the production from past seasons on another team summed apart (wsum_other_<stat>, rate_weight_other_<season>), usage and pace by the production weights, the current team's expected pace, the replacement-level prior and the league's shooting percentages. The walk-forward harness exports it so ops.projection_features can apply any setting of the advanced-stat features (#771) with the mart's arithmetic."
    columns:
      - name: league
        description: "nba or wnba"
        data_tests: [not_null]
      - name: player_id
        description: "League player id"
        data_tests: [not_null]
      - name: proj_minutes_pg
        description: "Projected minutes per game (see mart_player_projection)"
        data_tests: [not_null]
  - name: int_market_prior
    description: "The market's draft order for the season being played, the input of the board's market prior (#832): one row per league and player with an ESPN draft position that season, his rank by it, and his regular-season games so far. A season counts from the day before its first regular-season game through its last, so between seasons there are no rows."
    columns:
      - name: market_prior_key
        description: "Natural key: league and player id"
        data_tests: [unique, not_null]
      - name: league
        description: "nba or wnba"
      - name: season
        description: "The season being played"
      - name: player_id
        description: "League player id"
      - name: adp_rank
        description: "The player's rank by ESPN average draft position that season (silver.espn_preseason_adp)"
      - name: games
        description: "Regular-season games the player has played that season so far"
