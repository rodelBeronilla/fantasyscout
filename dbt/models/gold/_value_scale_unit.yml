unit_tests:
  - name: value_scale_pool_is_chosen_in_two_passes
    description: >
      Thirty projected players in a two-team, five-spot league (pool of ten, replacement level the
      next two; #767). Only points vary. Minutes equal points except for two players: p05 scores
      like a pool player but plays five minutes, p11 plays forty but scores like a replacement.
      Pass one, which pools by minutes, takes p11 and not p05 (a points mean of 19.5); pass two
      pools by pass-one value, so the pool is the ten highest scorers, p05 in and p11 out, and the
      scale's points mean is theirs, 20. A past season's line with no projection is the realized
      season's own scale; a playoff line never reaches it (int_player_window_lines).
    model: int_value_scale
    overrides:
      vars:
        fantasy:
          nba: {teams: 2, roster_spots: 5, prior_games: 3, minutes_recency: [1.0, 0.25, 0.08], durability_games: 10}
    given:
      - input: ref('mart_player_projection')
        rows:
          - {league: nba, season: '2025-26', player_id: p01, team_id: A, roster_season: '2025-26', games_share: 1.0, proj_points_pg: 23.0, proj_minutes_pg: 23.0}
          - {league: nba, season: '2025-26', player_id: p02, team_id: A, roster_season: '2025-26', games_share: 1.0, proj_points_pg: 23.0, proj_minutes_pg: 23.0}
          - {league: nba, season: '2025-26', player_id: p03, team_id: A, roster_season: '2025-26', games_share: 1.0, proj_points_pg: 20.0, proj_minutes_pg: 20.0}
          - {league: nba, season: '2025-26', player_id: p04, team_id: A, roster_season: '2025-26', games_share: 1.0, proj_points_pg: 20.0, proj_minutes_pg: 20.0}
          - {league: nba, season: '2025-26', player_id: p05, team_id: A, roster_season: '2025-26', games_share: 1.0, proj_points_pg: 20.0, proj_minutes_pg: 5.0}
          - {league: nba, season: '2025-26', player_id: p06, team_id: A, roster_season: '2025-26', games_share: 1.0, proj_points_pg: 20.0, proj_minutes_pg: 20.0}
          - {league: nba, season: '2025-26', player_id: p07, team_id: A, roster_season: '2025-26', games_share: 1.0, proj_points_pg: 20.0, proj_minutes_pg: 20.0}
          - {league: nba, season: '2025-26', player_id: p08, team_id: A, roster_season: '2025-26', games_share: 1.0, proj_points_pg: 20.0, proj_minutes_pg: 20.0}
          - {league: nba, season: '2025-26', player_id: p09, team_id: A, roster_season: '2025-26', games_share: 1.0, proj_points_pg: 17.0, proj_minutes_pg: 17.0}
          - {league: nba, season: '2025-26', player_id: p10, team_id: A, roster_season: '2025-26', games_share: 1.0, proj_points_pg: 17.0, proj_minutes_pg: 17.0}
          - {league: nba, season: '2025-26', player_id: p11, team_id: A, roster_season: '2025-26', games_share: 1.0, proj_points_pg: 15.0, proj_minutes_pg: 40.0}
          - {league: nba, season: '2025-26', player_id: p12, team_id: A, roster_season: '2025-26', games_share: 1.0, proj_points_pg: 13.0, proj_minutes_pg: 13.0}
          - {league: nba, season: '2025-26', player_id: p13, team_id: A, roster_season: '2025-26', games_share: 1.0, proj_points_pg: 12.0, proj_minutes_pg: 12.0}
