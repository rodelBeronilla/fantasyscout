unit_tests:
  - name: dvp_averages_what_each_defence_gives_up_by_position
    description: >
      Team T1 faces guards worth 2 and 4 and a center worth 1; T2 faces guards worth 0 (#749). T1
      gives up 3 a guard game against a league guard average of 2 (vs +1, rank 1), T2 gives up 0
      (vs -2, rank 2). A five-minute game does not count, and a G-F counts as a guard.
    model: mart_defense_vs_position
    given:
      - input: ref('int_player_game_value')
        rows:
          - {league: nba, season: '2025-26', game_id: g1, team_id: o1, player_sk: pg, minutes: 30, game_value: 2.0}
          - {league: nba, season: '2025-26', game_id: g1, team_id: o1, player_sk: gf, minutes: 30, game_value: 4.0}
          - {league: nba, season: '2025-26', game_id: g1, team_id: o1, player_sk: c, minutes: 30, game_value: 1.0}
          - {league: nba, season: '2025-26', game_id: g1, team_id: o1, player_sk: bench, minutes: 5, game_value: -9.0}
          - {league: nba, season: '2025-26', game_id: g2, team_id: o2, player_sk: g2, minutes: 30, game_value: 0.0}
      - input: ref('dim_player')
        rows:
          - {player_sk: pg, position: G}
          - {player_sk: gf, position: G-F}
          - {player_sk: c, position: C}
          - {player_sk: bench, position: G}
          - {player_sk: g2, position: G}
      - input: ref('fct_team_game')
        rows:
          - {league: nba, game_id: g1, team_id: o1, opponent_team_id: t1, opponent_abbreviation: T1}
          - {league: nba, game_id: g2, team_id: o2, opponent_team_id: t2, opponent_abbreviation: T2}
    expect:
      rows:
        - {team_id: t1, position: G, games: 1, player_games: 2, value_allowed: 3.0, vs_average: 1.0, rank_allowed: 1}
        - {team_id: t1, position: C, games: 1, player_games: 1, value_allowed: 1.0, vs_average: 0.0, rank_allowed: 1}
        - {team_id: t2, position: G, games: 1, player_games: 1, value_allowed: 0.0, vs_average: -2.0, rank_allowed: 2}
