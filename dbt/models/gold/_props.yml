version: 2

models:
  - name: fct_player_prop
    description: "Prop lines as a private model input (ADR 0008): the latest pre-game line per player, game, market, source and bookmaker, linked to league ids, with the consensus across bookmakers. In the owner's Parquet only; never in the public JSON or on a page."
    columns:
      - name: player_prop_sk
        description: "Surrogate key: one row per league, game, player, market, source and bookmaker"
        data_tests: [unique, not_null]
      - name: league
        description: "wnba or nba"
        data_tests: [not_null]
      - name: season
        description: "Season label of the game"
      - name: game_id
        description: "League game id"
        data_tests: [not_null]
      - name: game_date
        description: "The game's Eastern date"
      - name: commence_at
        description: "Scheduled start of the game (UTC)"
      - name: player_id
        description: "League player id"
        data_tests: [not_null]
      - name: player_link
        description: "How the player was linked: player_xwalk, name_and_team or name (silver player_props)"
      - name: market
        description: "points, rebounds, assists, threes, steals, blocks, turnovers, points_rebounds, points_assists, rebounds_assists, points_rebounds_assists or steals_blocks"
        data_tests: [not_null]
      - name: source
        description: "espn or odds_api"
        data_tests: [not_null]
      - name: bookmaker
        description: "Bookmaker key, such as draftkings"
        data_tests: [not_null]
      - name: line
        description: "The bookmaker's last line before the game"
        data_tests: [not_null]
      - name: open_line
        description: "The opening line (ESPN only)"
      - name: over_price
        description: "American price of the over"
      - name: under_price
        description: "American price of the under"
      - name: over_prob_no_vig
        description: "Probability of the over with the vig removed"
      - name: vig
        description: "The bookmaker's margin on the market: the implied probabilities' sum minus one"
      - name: snapshot_key
        description: "Eastern date and hour of the run whose lines these are, YYYY-MM-DDTHH"
      - name: snapshot_at
        description: "When that run fetched the lines (UTC), before the game's start"
      - name: line_updated_at
        description: "When the bookmaker last moved the line or a price (UTC)"
      - name: consensus_line
        description: "Mean line across the bookmakers quoting the player's market for the game, each bookmaker once"
      - name: consensus_over_prob_no_vig
        description: "Mean over probability, vig removed, across those bookmakers"
      - name: books_quoting
        description: "How many bookmakers the consensus covers"
