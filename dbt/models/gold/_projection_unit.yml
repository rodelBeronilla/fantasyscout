unit_tests:
  - name: projection_return_ramp_cuts_minutes_after_an_absence
    description: >
      Team A has played ten games. p1 missed five in a row (one listed as did not play) and has
      played one game back: the cut of 0.125 a game missed reaches the 0.5 cap and is halved,
      keeping 0.75 of the minutes. p2 has missed the last three: still out, 0.625 kept. p3 missed
      two, too few to count. p4, on team A last season, missed the first three games and has played
      seven since: the absence is reported but no longer cuts. p5 joined the team at its sixth
      game, which is no absence. p6 has missed six after four games: under five games this season,
      so no cut. Projected minutes are the blended minutes (30) times the share kept.
    model: mart_player_projection
    overrides:
      vars:
        as_of: '2026-01-15'
        fantasy:
          nba: {teams: 1, roster_spots: 1, prior_games: 3, minutes_recency: [1.0, 0.25, 0.08], durability_games: 10}
        fantasy_return_ramp: {min_games_missed: 3, per_game_missed: 0.125, max_cut: 0.5, games_back: 2}
    given:
      - input: ref('fct_player_game')
        rows:
          - {league: nba, season: '2025-26', game_id: '0022500001', game_date: 2025-10-23, player_id: p1, team_id: A, played: true, minutes: 30}
          - {league: nba, season: '2025-26', game_id: '0022500001', game_date: 2025-10-23, player_id: p2, team_id: A, played: true, minutes: 30}
