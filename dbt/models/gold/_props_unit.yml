unit_tests:
  - name: player_prop_keeps_the_latest_pre_game_line_and_a_consensus_per_bookmaker
    description: >
      Each source and bookmaker keeps its last line before the start; a snapshot after the start
      and a quote without a league player are left out. The consensus averages the bookmakers'
      lines and vig-free over probabilities, counting DraftKings once although both sources carry
      it (The Odds API's quote on a tie).
    model: fct_player_prop
    given:
      - input: ref('player_props')
        rows:
          - {player_prop_key: k1, league: nba, season: '2026-27', game_id: g1, player_id: p1, market: points, source: espn, bookmaker: draftkings, line: 20.5, over_prob_no_vig: 0.5, snapshot_key: '2026-10-29T19', snapshot_at: '2026-10-29 23:00:00+00', line_updated_at: '2026-10-29 22:00:00+00', is_pre_game: true}
          - {player_prop_key: k2, league: nba, season: '2026-27', game_id: g1, player_id: p1, market: points, source: espn, bookmaker: draftkings, line: 21.5, over_prob_no_vig: 0.5, snapshot_key: '2026-10-30T10', snapshot_at: '2026-10-30 14:00:00+00', line_updated_at: '2026-10-30 13:00:00+00', is_pre_game: true}
          - {player_prop_key: k3, league: nba, season: '2026-27', game_id: g1, player_id: p1, market: points, source: espn, bookmaker: draftkings, line: 23.5, over_prob_no_vig: 0.5, snapshot_key: '2026-10-30T19', snapshot_at: '2026-10-30 23:05:00+00', line_updated_at: '2026-10-30 23:01:00+00', is_pre_game: false}
          - {player_prop_key: k4, league: nba, season: '2026-27', game_id: g1, player_id: p1, market: points, source: odds_api, bookmaker: draftkings, line: 21.5, over_prob_no_vig: 0.5, snapshot_key: '2026-10-30T10', snapshot_at: '2026-10-30 14:00:00+00', line_updated_at: '2026-10-30 13:00:00+00', is_pre_game: true}
          - {player_prop_key: k5, league: nba, season: '2026-27', game_id: g1, player_id: p1, market: points, source: odds_api, bookmaker: fanduel, line: 22.5, over_prob_no_vig: 0.75, snapshot_key: '2026-10-30T10', snapshot_at: '2026-10-30 14:00:00+00', line_updated_at: '2026-10-30 13:30:00+00', is_pre_game: true}
          - {player_prop_key: k6, league: nba, season: '2026-27', game_id: g1, player_id: null, market: points, source: odds_api, bookmaker: fanduel, line: 9.5, over_prob_no_vig: 0.5, snapshot_key: '2026-10-30T10', snapshot_at: '2026-10-30 14:00:00+00', line_updated_at: '2026-10-30 13:30:00+00', is_pre_game: true}
    expect:
      rows:
        - {source: espn, bookmaker: draftkings, line: 21.5, snapshot_key: '2026-10-30T10', consensus_line: 22.0, consensus_over_prob_no_vig: 0.625, books_quoting: 2}
        - {source: odds_api, bookmaker: draftkings, line: 21.5, snapshot_key: '2026-10-30T10', consensus_line: 22.0, consensus_over_prob_no_vig: 0.625, books_quoting: 2}
        - {source: odds_api, bookmaker: fanduel, line: 22.5, snapshot_key: '2026-10-30T10', consensus_line: 22.0, consensus_over_prob_no_vig: 0.625, books_quoting: 2}
