version: 2

models:
  - name: fct_player_claim
    description: "What the news claims about each player: one row per claim the local model read from an ESPN headline or injury note, with its kind, direction, capped confidence, exact quote and the date the source said it. Not shown on the site and read by no number: stored so the walk-forward harness can score each source's track record before any claim may tune a projection."
    columns:
      - name: player_claim_sk
        description: "Surrogate key: one row per league, source item, league player and kind"
        data_tests: [unique, not_null]
      - name: league
        description: "wnba or nba"
      - name: season
        description: "Season label"
      - name: stats_player_id
        description: "League player id the claim is about"
        data_tests: [not_null]
      - name: source
        description: "espn_news (an ESPN headline) or espn_injury_note (an ESPN injury note)"
      - name: source_id
        description: "The ESPN article id, or the injury listing id and a hash of the note's text"
      - name: kind
        description: "role_up, role_down, minutes_up, minutes_down, injury_out, injury_return, injury_worse, injury_better, trade_rumor or other"
      - name: direction
        description: "1 good for the player's fantasy value, -1 bad, 0 neither"
      - name: confidence
        description: "The confidence kept, 0-1: the model's, capped by the extractor's rules. Not yet a probability: the backtest calibrates it"
      - name: model_confidence
        description: "The model's own confidence, 0-1"
      - name: confidence_cap
        description: "The most confidence the extractor's rules allow the claim"
      - name: cap_reasons
        description: "Why the cap is what it is, as a JSON array of text"
      - name: quote
        description: "The span of the source text the claim rests on, as the source writes it"
      - name: quote_start
        description: "Where the quote starts in the source text (0-based character offset)"
      - name: published_at
        meta: {tz: UTC}
        description: "When the source said it (UTC); an injury note is dated by its UTC day only"
      - name: published_date
        description: "The day the source said it: the date a point-in-time build cuts on"
        data_tests: [not_null]
      - name: extracted_at
        meta: {tz: UTC}
        description: "When the model read the item (UTC)"
      - name: model
        description: "The local model that read the item"
      - name: prompt_version
        description: "Hash of the prompt the model was given (ai/prompts/claims.md)"
