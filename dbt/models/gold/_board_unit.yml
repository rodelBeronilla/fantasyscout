unit_tests:
  - name: board_pool_is_chosen_in_two_passes
    description: >
      Thirty players on one team in a two-team, five-spot league (pool of ten). The board scores
      each projected line on the season's value scale (int_value_scale, whose two-pass pool is
      pinned by value_scale_pool_is_chosen_in_two_passes): only points vary, so value is the
      points z-score, and the pool is the ten the scale values most, p05 (five minutes) in and
      p11 (forty minutes, a replacement's points) out. rank_total follows value, equal points
      broken by player id.
    model: mart_board
    overrides:
      vars:
        as_of: '2026-01-10'
        fantasy:
          nba: {teams: 2, roster_spots: 5, prior_games: 3, minutes_recency: [1.0, 0.25, 0.08], durability_games: 10}
