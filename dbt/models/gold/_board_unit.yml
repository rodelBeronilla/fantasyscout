  - name: board_availability_follows_the_status
    description: >
      Team A has four regular-season games left; team B has played its last. One player per
      branch of the availability multiplier: a (team B, nothing left) 1.0 and a rest-of-season
      factor of 0, the team's season being over; b (out, back on the 13th) misses the one game
      before that date, 0.75; c (out for the season) 0; d (officially questionable with an
      injury, two past questionable listings that cost one and three games) the calibrated
      average of two games, 0.5; e (no status) 1.0; f (out, no return date, no history) 0;
      g (doubtful, no history) the old charge of 0.75 of a game, 0.8125; h (officially
      questionable for rest, a reason with no history) the old charge of half a game, 0.875.
      Every projected line is zero, so value is zero and the factors are exact.
    model: mart_board
    overrides:
      vars:
        as_of: '2026-01-10'
        fantasy:
          nba: {teams: 2, roster_spots: 5, prior_games: 3, minutes_recency: [1.0, 0.25, 0.08], durability_games: 10}
    given:
      - input: ref('mart_player_projection')
        rows:
          - {league: nba, season: '2025-26', player_id: a, team_id: B, roster_season: '2025-26', games_share: 1.0, proj_minutes_pg: 0.0, proj_points_pg: 0.0, proj_rebounds_total_pg: 0.0, proj_assists_pg: 0.0, proj_steals_pg: 0.0, proj_blocks_pg: 0.0, proj_three_pointers_made_pg: 0.0, proj_turnovers_pg: 0.0, proj_fgm_pg: 0.0, proj_fga_pg: 0.0, proj_ftm_pg: 0.0, proj_fta_pg: 0.0}
