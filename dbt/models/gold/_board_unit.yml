  - name: board_counts_a_fixed_season_length_where_the_schedule_cannot
    description: >
      The NBA lists two games per team as placeholders until the Cup's group stage ends, so its
      schedule says 80 games; with regular_season_games set (10 here, for a short schedule) the
      NBA team that has played three of its ten has seven left whatever is scheduled, and its
      rest-of-season factor is 7/10. The WNBA, not listed, counts its schedule: two played, six
      scheduled, 6/8 (#386).
    model: mart_board
    overrides:
      vars:
        as_of: '2026-01-10'
        fantasy:
          nba: {teams: 2, roster_spots: 5, prior_games: 3, minutes_recency: [1.0, 0.25, 0.08], durability_games: 10}
