unit_tests:
  - name: board_pool_is_chosen_in_two_passes
    description: >
      Thirty players on one team in a two-team, five-spot league (pool of ten, replacement level
      the next two). Only points vary, so value is the points z-score. Minutes equal points
      except for two players: p05 scores like a pool player but plays five minutes, p11 plays
      forty but scores like a replacement. Pass one, which pools by minutes, takes p11 and not
      p05; pass two pools by pass-one value, so the pool is the ten highest scorers, p05 in and
      p11 out. rank_total follows value, equal points broken by player id. The numbers
      themselves (a z-score is a square root) are pinned by board_availability_follows_the_status,
      where they are exact.
    model: mart_board
    overrides:
      vars:
        as_of: '2026-01-10'
        fantasy:
          nba: {teams: 2, roster_spots: 5, prior_games: 3, minutes_recency: [1.0, 0.25, 0.08], durability_games: 10}
    given:
      - input: ref('mart_player_projection')
        rows:
          - {league: nba, season: '2025-26', player_id: p01, team_id: A, roster_season: '2025-26', games_share: 1.0, proj_points_pg: 23.0, proj_minutes_pg: 23.0}
          - {league: nba, season: '2025-26', player_id: p02, team_id: A, roster_season: '2025-26', games_share: 1.0, proj_points_pg: 23.0, proj_minutes_pg: 23.0}
