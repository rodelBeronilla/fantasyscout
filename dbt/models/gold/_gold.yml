  - name: mart_category_zscores
    description: "Category z-scores per window, league, season and player against a pool of the top 180 NBA or 90 WNBA players by minutes in the window."
    columns:
      - name: zscore_sk
        description: "Surrogate key: one row per window, league, season and player"
