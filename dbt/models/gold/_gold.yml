        data_tests: [not_null]
      - name: expected_games_missed
        description: "Average games missed after past official injury listings with the player's status (the official report's for the next game, else ESPN's), capped at the team's games left; null without a status or a history"
      - name: games_remaining
        description: "The team's regular-season games not yet final from the run date on"
      - name: games_next_7
        description: "The team's games in the next seven days, playoffs included, unconfirmed if-necessary games left out"
      - name: games_this_week
        description: "Team games left in the fantasy week (Monday to Sunday), from today's Eastern date"
      - name: games_scheduled
        description: "The team's regular-season games scheduled this season"
      - name: season_complete
        description: "True when the league has no regular-season games left (playoffs or off-season)"
        data_tests: [not_null]
      - name: ros_factor
        description: "Remaining share of the team's regular season times availability (1.0 once the regular season is over)"
        data_tests: [not_null]
      - name: value_per_game
        description: "Sum of the nine category values per game above replacement (zero is a freely available player)"
        data_tests: [not_null]
      - name: value_total
        description: "value_per_game times games_share when above zero; a value below replacement is left unscaled"
        data_tests: [not_null]
      - name: value_rest_of_season
        description: "value_total times ros_factor when above zero; a value below replacement is left unscaled"
        data_tests: [not_null]
      - name: rank_total
        description: "Rank by value_total within the league, 1 the highest"
      - name: market_gap
        description: "market_rank minus rank_total: positive when the market drafts the player later than the board ranks the player"

  - name: mart_schedule_upcoming
    description: "Regular-season and playoff games not yet final in the next fourteen days, unconfirmed if-necessary games left out, with matchup values, betting lines, rest and travel."
    columns:
      - name: upcoming_sk
        description: "Surrogate key: one row per league and game"
        data_tests: [unique, not_null]
      - name: league
        description: "wnba or nba"
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
      - name: game_id
        description: "League stats API game id"
      - name: game_date
        description: "Game date in US Eastern time"
      - name: days_ahead
        description: "Days from the run's Eastern date to the game (0 for today); the as_of var pins the date in tests"
        data_tests: [not_null]
      - name: game_type
        description: "regular or playoffs"
      - name: home_team_id
        description: "League team id of the home team"
      - name: home_team_tricode
        description: "League tricode of the home team"
      - name: away_team_id
        description: "League team id of the away team"
      - name: away_team_tricode
        description: "League tricode of the away team"
      - name: game_datetime_utc
        description: "Tip-off as the schedule gives it, ISO 8601 text in UTC"
      - name: home_matchup
        description: "Value per game the matchup adds for a home player: the away defence and both teams' pace, weighted per league"
      - name: away_matchup
        description: "Value per game the matchup adds for an away player: the home defence and both teams' pace, weighted per league"
      - name: home_spread
        description: "The home team's point spread where a line is posted (silver game_lines); negative when the home team is favoured"
      - name: over_under
        description: "The game's total points line where one is posted"
      - name: home_implied_points
        description: "Points the home team is implied to score by the line"
      - name: away_implied_points
        description: "Points the away team is implied to score by the line"
      - name: line_provider
        description: "The sportsbook the line comes from"
      - name: line_as_of
        description: "Ingest date the line was taken from"
      - name: home_rest_days
        description: "Days off the home team has before the game (fct_team_game_context)"
      - name: home_back_to_back
        description: "True when the home team is on the second night of a back-to-back (fct_team_game_context)"
      - name: away_rest_days
        description: "Days off the away team has before the game (fct_team_game_context)"
      - name: away_back_to_back
        description: "True when the away team is on the second night of a back-to-back"
      - name: away_miles_travelled
        description: "Miles the away team travels from its previous game"
      - name: at_altitude
        description: "True when the game is played 4,000 feet up or more"
      - name: crew_chief
        description: "The crew chief the leagues' assignments page names for the game (posted about 9 am Eastern on the day); null until then"
      - name: crew_games
        description: "The regular-season games the crew chief, referee and umpire each worked this season and last, added up: the history behind the crew's tendency"
      - name: crew_fouls_delta
        description: "The crew's tendency in personal fouls per game (both teams) against the league average game: the average over its three officials of each one's figure for this season and last, shrunk toward zero as if they had also worked 20 average games (fct_referee_tendency). Context only, not in the matchup value"
      - name: crew_fta_delta
        description: "The crew's tendency in free-throw attempts per game (both teams) against the league average game, figured as crew_fouls_delta is. Context only"
      - name: crew_pace_delta
        description: "The crew's tendency in pace (possessions per regulation game) against the league average game, figured as crew_fouls_delta is. Context only"

