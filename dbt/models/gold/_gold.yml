version: 2

models:
  - name: dim_date
    description: "One row per calendar date from 2018 to 2027, with the fantasy week and game-day flags per league."
    columns:
      - name: date_day
        description: "Calendar date"
        data_tests: [unique, not_null]
      - name: date_sk
        description: "Surrogate key: one row per calendar date"
        data_tests: [unique, not_null]
      - name: year
        description: "Calendar year"
      - name: month
        description: "Calendar month, 1-12"
      - name: iso_day_of_week
        description: "ISO day of week, 1 Monday to 7 Sunday"
      - name: week_start
        description: "Monday of the week containing the date"
      - name: fantasy_week
        description: "Monday-to-Sunday week label, YYYY-Www, numbered within the calendar year of its Monday"
        data_tests: [not_null]
      - name: is_game_day_wnba
        description: "True when a WNBA game was played that day (silver.games)"
      - name: is_game_day_nba
        description: "True when an NBA game was played that day (silver.games)"

  - name: dim_team
    description: "One row per team per season seen in the league game log, with nickname, city and conference from the teams seed."
    columns:
      - name: team_sk
        description: "Surrogate key: one row per league, season and team id"
        data_tests: [unique, not_null]
      - name: league
        description: "wnba or nba"
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
      - name: team_id
        description: "League stats API team id"
        data_tests: [not_null]
      - name: abbreviation
        description: "League tricode of the team that season"
      - name: name
        description: "Team nickname from the teams seed, else the game log's full team name"
      - name: city
        description: "City or market from the teams seed"
      - name: conference
        description: "Eastern or Western, from the teams seed"
      - name: full_name
        description: "Full team name as the game log writes it"
      - name: note
        description: "Free-text note from the teams seed, such as expansion team (2026)"

  - name: dim_game
    description: "One row per played game: built from the team game log through silver.games, so games not yet played are not here, with the result and the schedule context from silver.schedule."
    columns:
      - name: game_sk
        description: "Surrogate key: one row per league and game id"
        data_tests: [unique, not_null]
      - name: league
        description: "wnba or nba"
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
      - name: game_id
        description: "League stats API game id"
        data_tests: [not_null]
      - name: season_type
        description: "Regular Season, Playoffs, Preseason or All-Star from the game id's third character; Other for play-in and cup finals"
      - name: game_date
        description: "Game date, from the team game log"
        data_tests: [not_null]
      - name: game_datetime_utc
        description: "Tip-off from the schedule, ISO 8601 text in UTC; null when the schedule lacks the game"
      - name: home_team_id
        description: "League team id of the home side (the lower team id at a neutral site)"
      - name: home_team_sk
        description: "Home team-season in dim_team (league, season and home team id)"
        data_tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: home_team_abbreviation
        description: "League tricode of the home side"
      - name: away_team_id
        description: "League team id of the away side"
      - name: away_team_sk
        description: "Away team-season in dim_team (league, season and away team id)"
        data_tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: away_team_abbreviation
        description: "League tricode of the away side"
      - name: home_points
        description: "Points the home side scored"
      - name: away_points
        description: "Points the away side scored"
      - name: winner_team_id
        description: "Team id of the side that scored more"
      - name: arena_name
        description: "Arena name, from the schedule"
      - name: arena_city
        description: "Arena city, from the schedule"
      - name: arena_state
        description: "Arena state or province, from the schedule"
      - name: is_neutral
        description: "True when the schedule marks the game as played at a neutral site"
      - name: game_status
        description: "Schedule status: 1 scheduled, 2 in progress, 3 final"
      - name: game_status_text
        description: "Status as the schedule writes it"
      - name: week_number
        description: "The league's schedule week"
      - name: game_label
        description: "The league's label for the game, such as Preseason or a playoff round"
      - name: series_text
        description: "The playoff series state as the league writes it; blank outside the playoffs"

  - name: dim_player
    description: "One row per player per team stint (SCD type 2 on team); valid_to is null for the current stint."
    columns:
      - name: player_sk
        description: "Surrogate key: one row per league, player and team stint (by the stint's first game date)"
        data_tests: [unique, not_null]
      - name: league
        description: "wnba or nba"
      - name: stats_player_id
        description: "League stats API player id"
        data_tests: [not_null]
      - name: espn_player_id
        description: "ESPN athlete id from silver.player_xwalk; null when the player is unmatched"
      - name: full_name
        description: "Name from the player directory, else the latest roster"
      - name: position
        description: "Position from the latest roster, else ESPN's roster, else the position started at most in the latest season started"
      - name: height
        description: "Height from the latest roster, feet-inches text (6-1); the same on every stint"
      - name: weight_lbs
        description: "Weight in pounds from the latest roster"
      - name: birth_date
        description: "Birth date as the league roster writes it, text such as MAR 03, 1996, not a date type"
      - name: school
        description: "College or last school before the league, from the latest roster"
      - name: team_id
        description: "League team id of the stint"
      - name: valid_from
        description: "First game date of the stint"
        data_tests: [not_null]
      - name: valid_to
        description: "The day before the next stint's first game; null for the current stint"
      - name: is_current
        description: "True for the player's latest stint"
      - name: last_game_date
        description: "Date of the player's latest game for any team"

  - name: fct_player_game
    description: "Player × game: box score, advanced line, source agreement flag."
    columns:
      - name: player_game_sk
        description: "Surrogate key: one row per league, game and player"
        data_tests: [unique, not_null]
      - name: player_sk
        description: "Stint the game falls in (dim_player)"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: game_sk
        description: "Game (dim_game)"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_game')
              field: game_sk
      - name: team_sk
        description: "Team-season (dim_team)"
        data_tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: player_game_key
        description: "Natural key from silver: league, game id and player id"
      - name: league
        description: "wnba or nba"
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
      - name: game_id
        description: "League stats API game id"
      - name: game_date
        description: "Date of the game (silver.games)"
      - name: player_id
        description: "League stats API player id"
      - name: team_id
        description: "League team id of the player's team"
      - name: team_tricode
        description: "League tricode of the player's team"
      - name: is_home
        description: "True when the player's team is the home side"
      - name: position
        description: "Starting position; null for the bench"
      - name: comment
        description: "The box score's note for a player who did not play; blank otherwise"
      - name: minutes
        description: "Minutes played, decimal: the league box score's, ESPN's where the league's is null"
      - name: played
        description: "True when minutes are above zero"
      - name: field_goals_made
        description: "Field goals made (league value, ESPN's where the league's is null)"
      - name: field_goals_attempted
        description: "Field goals attempted (league value, ESPN's where null)"
      - name: three_pointers_made
        description: "Three-pointers made (league value, ESPN's where null)"
      - name: three_pointers_attempted
        description: "Three-pointers attempted (league value, ESPN's where null)"
      - name: free_throws_made
        description: "Free throws made (league value, ESPN's where null)"
      - name: free_throws_attempted
        description: "Free throws attempted (league value, ESPN's where null)"
      - name: rebounds_offensive
        description: "Offensive rebounds (league box score only)"
      - name: rebounds_defensive
        description: "Defensive rebounds (league box score only)"
      - name: rebounds_total
        description: "Total rebounds (league value, ESPN's where null)"
      - name: assists
        description: "Assists (league value, ESPN's where null)"
      - name: steals
        description: "Steals (league value, ESPN's where null)"
      - name: blocks
        description: "Blocked shots (league value, ESPN's where null)"
      - name: turnovers
        description: "Turnovers (league value, ESPN's where null)"
      - name: fouls_personal
        description: "Personal fouls (league box score only)"
      - name: points
        description: "Points scored (league value, ESPN's where null)"
      - name: plus_minus
        description: "Point margin while the player was on the floor (league box score)"
      - name: usage_percentage
        description: "Share of team possessions the player used while on the floor, decimal 0-1 (advanced line)"
      - name: true_shooting_percentage
        description: "True shooting percentage, decimal 0-1 (advanced line)"
      - name: effective_field_goal_percentage
        description: "Effective field goal percentage, decimal 0-1 (advanced line)"
      - name: player_offensive_rating
        description: "Team points per 100 possessions with the player on the floor (advanced line)"
      - name: player_defensive_rating
        description: "Opponent points per 100 possessions with the player on the floor (advanced line)"
      - name: player_net_rating
        description: "Offensive minus defensive rating with the player on the floor (advanced line)"
      - name: player_pace
        description: "Possessions per regulation game while the player was on the floor (advanced line)"
      - name: pie
        description: "Player Impact Estimate, decimal (advanced line)"
      - name: team_share_field_goals_attempted
        description: "Share of the team's field goal attempts the player took while on the floor, decimal 0-1 (usage game log)"
      - name: team_share_three_pointers_attempted
        description: "Share of the team's three-point attempts the player took while on the floor, decimal 0-1 (usage game log)"
      - name: team_share_free_throws_attempted
        description: "Share of the team's free throw attempts the player took while on the floor, decimal 0-1 (usage game log)"
      - name: team_share_rebounds
        description: "Share of the team's rebounds the player took while on the floor, decimal 0-1 (usage game log)"
      - name: team_share_assists
        description: "Share of the team's assists the player made while on the floor, decimal 0-1 (usage game log)"
      - name: team_share_turnovers
        description: "Share of the team's turnovers the player committed while on the floor, decimal 0-1 (usage game log)"
      - name: team_share_points
        description: "Share of the team's points the player scored while on the floor, decimal 0-1 (usage game log)"
      - name: fouls_drawn
        description: "Personal fouls the player drew (misc game log)"
      - name: blocks_against
        description: "The player's shots that were blocked (misc game log)"
      - name: points_in_paint
        description: "Points the player scored in the paint (misc game log)"
      - name: fast_break_points
        description: "Points the player scored on fast breaks (misc game log)"
      - name: second_chance_points
        description: "Points the player scored after an offensive rebound (misc game log)"
      - name: points_off_turnovers
        description: "Points the player scored off opponent turnovers (misc game log)"
      - name: source_agreement
        description: "Reconciliation verdict against ESPN (ADR 0005): exact, minor (minutes only, within one), conflict, or unverified when ESPN does not report the player-game"
        data_tests:
          - accepted_values:
              values: [exact, minor, conflict, unverified]
      - name: espn_player_id
        description: "ESPN athlete id where ESPN reports the player-game; null otherwise"
      - name: _ingest_date
        description: "Ingest date of the league box score row"

  - name: fct_team_game
    description: "Team × game with possessions, pace and ratings."
    columns:
      - name: team_game_sk
        description: "Surrogate key: one row per league, game and team"
        data_tests: [unique, not_null]
      - name: game_sk
        description: "Game (dim_game)"
        data_tests:
          - relationships:
              to: ref('dim_game')
              field: game_sk
      - name: team_sk
        description: "Team-season (dim_team)"
        data_tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: opponent_team_sk
        description: "Opponent's team-season (dim_team)"
      - name: team_game_key
        description: "Natural key from silver: league, game id and team id"
      - name: league
        description: "wnba or nba"
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
      - name: game_id
        description: "League stats API game id"
      - name: game_date
        description: "Date of the game, from the game log"
      - name: team_id
        description: "League stats API team id"
      - name: team_abbreviation
        description: "League tricode of the team"
      - name: opponent_team_id
        description: "League team id of the opponent"
      - name: opponent_abbreviation
        description: "League tricode of the opponent"
      - name: is_home
        description: "True for the home side ('vs.' in the matchup); true for both at a neutral site"
      - name: win_loss
        description: "W or L"
      - name: team_minutes
        description: "Team minutes, the five-player total (200 for a regulation WNBA game, 240 in the NBA)"
      - name: field_goals_made
        description: "Field goals made by the team"
      - name: field_goals_attempted
        description: "Field goals attempted by the team"
      - name: three_pointers_made
        description: "Three-pointers made by the team"
      - name: three_pointers_attempted
        description: "Three-pointers attempted by the team"
      - name: free_throws_made
        description: "Free throws made by the team"
      - name: free_throws_attempted
        description: "Free throws attempted by the team"
      - name: rebounds_offensive
        description: "Offensive rebounds by the team"
      - name: rebounds_defensive
        description: "Defensive rebounds by the team"
      - name: rebounds_total
        description: "Total rebounds by the team"
      - name: assists
        description: "Assists by the team"
      - name: steals
        description: "Steals by the team"
      - name: blocks
        description: "Blocked shots by the team"
      - name: turnovers
        description: "Turnovers by the team"
      - name: fouls_personal
        description: "Personal fouls by the team"
      - name: points
        description: "Points scored by the team"
      - name: opponent_points
        description: "Points scored by the opponent"
      - name: plus_minus
        description: "The team's point margin"
      - name: possessions
        description: "Estimated possessions: FGA - offensive rebounds + turnovers + 0.44 x FTA"
      - name: opponent_possessions
        description: "The opponent's estimated possessions, same formula"
      - name: pace
        description: "Possessions per regulation game (40 minutes WNBA, 48 NBA), scaled by the minutes played"
      - name: offensive_rating
        description: "Points per 100 possessions"
      - name: defensive_rating
        description: "Opponent points per 100 opponent possessions"
      - name: net_rating
        description: "Offensive minus defensive rating"
      - name: _ingest_date
        description: "Ingest date of the game log row"

  - name: fct_event
    description: "One row per play-by-play action."
    columns:
      - name: event_sk
        description: "Surrogate key: one row per league, game and action number"
        data_tests: [unique, not_null]
      - name: game_sk
        description: "Game (dim_game)"
        data_tests:
          - relationships:
              to: ref('dim_game')
              field: game_sk
      - name: event_key
        description: "Natural key from silver: league, game id and action number"
      - name: league
        description: "wnba or nba"
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
      - name: game_id
        description: "League stats API game id"
      - name: game_date
        description: "Date of the game (silver.games); null when the game is not in the game log"
      - name: action_number
        description: "The feed's action number, unique within a game; not always in clock order"
      - name: action_id
        description: "The feed's running action id"
      - name: period
        description: "Period number; 5 and above are overtimes"
      - name: clock
        description: "Time left in the period as the feed writes it (PT11M23.00S)"
      - name: seconds_remaining
        description: "Seconds left in the period, from the clock"
      - name: team_id
        description: "League team id the action is credited to; 0 for game actions"
      - name: team_tricode
        description: "League tricode of that team"
      - name: player_id
        description: "League player id the action is credited to (the player leaving, on a substitution); 0 when none"
      - name: player_name
        description: "Family name of the player as the feed writes it"
      - name: action_type
        description: "The feed's action type, such as Made Shot, Rebound or Substitution"
      - name: sub_type
        description: "The feed's sub-type, such as Jump Shot or Layup"
      - name: description
        description: "The action as the feed writes it"
      - name: location
        description: "h for a home-team action, v for the visitors; blank for game actions"
      - name: is_field_goal
        description: "True for a field goal attempt"
      - name: shot_result
        description: "Made or Missed for a shot; blank otherwise"
      - name: shot_value
        description: "Point value of the shot attempted (2 or 3); 0 for other actions"
      - name: shot_distance
        description: "Shot distance in feet"
      - name: x_legacy
        description: "Shot x coordinate, tenths of a foot from the basket"
      - name: y_legacy
        description: "Shot y coordinate, tenths of a foot from the basket"
      - name: score_home
        description: "Home score after the action; null where the feed does not repeat it"
      - name: score_away
        description: "Away score after the action; null where the feed does not repeat it"
      - name: points_total
        description: "The feed's pointsTotal field: the player's points in the game after a scoring action, else 0"
      - name: lineup_home
        description: "League player ids on the floor for the home side, sorted and comma-separated (silver.event_lineups)"
      - name: lineup_away
        description: "League player ids on the floor for the away side, sorted and comma-separated"
      - name: lineup_complete
        description: "True when both sides have five players; false when a player went unseen or no lineup was built"
      - name: _ingest_date
        description: "Ingest date of the play-by-play landing; incremental builds merge from the latest one"

  - name: fct_shot
    description: "One row per field goal attempt with court coordinates."
    columns:
      - name: shot_sk
        description: "Surrogate key: one row per league, game and shot event id"
        data_tests: [unique, not_null]
      - name: game_sk
        description: "Game (dim_game)"
        data_tests:
          - relationships:
              to: ref('dim_game')
              field: game_sk
      - name: team_sk
        description: "Shooter's team-season (dim_team)"
      - name: shot_key
        description: "Natural key from silver: league, game id and event id"
      - name: league
        description: "wnba or nba"
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
      - name: game_id
        description: "League stats API game id"
      - name: game_date
        description: "Date of the game"
      - name: game_event_id
        description: "The shot's event id in the game, the play-by-play action number"
      - name: player_id
        description: "League player id of the shooter"
      - name: player_name
        description: "Shooter's full name"
      - name: team_id
        description: "League team id of the shooter's team"
      - name: period
        description: "Period number; 5 and above are overtimes"
      - name: seconds_remaining
        description: "Seconds left in the period (minutes remaining x 60 plus seconds)"
      - name: event_type
        description: "Made Shot or Missed Shot"
      - name: action_type
        description: "Shot description, such as Jump Shot or Driving Layup Shot"
      - name: shot_type
        description: "2PT Field Goal or 3PT Field Goal"
      - name: is_three
        description: "True for a three-point attempt"
      - name: shot_zone_basic
        description: "The league's court zone, such as Restricted Area, Mid-Range or Above the Break 3"
      - name: shot_zone_area
        description: "Side of the court, such as Center(C) or Left Side Center(LC)"
      - name: shot_zone_range
        description: "Distance band, such as Less Than 8 ft. or 24+ ft."
      - name: shot_distance
        description: "Shot distance in whole feet"
      - name: loc_x
        description: "Court x coordinate, tenths of a foot from the basket (negative to the left)"
      - name: loc_y
        description: "Court y coordinate, tenths of a foot from the basket toward half court"
      - name: shot_attempted
        description: "True for an attempt (always true in the shot chart)"
      - name: shot_made
        description: "True when the shot went in"
      - name: points
        description: "Points the shot scored: 3 or 2 when made, else 0"
      - name: _ingest_date
        description: "Ingest date of the shot chart landing; incremental builds merge from the latest one"

  - name: fct_team_stakes
    description: "What each team still has to play for in its current season: eliminated, clinched or racing, the games left, and a late-season rest risk for a team with nothing to play for."
    columns:
      - name: team_stakes_sk
        description: "Surrogate key: one row per league, season and team"
        data_tests: [unique, not_null]
      - name: league
        description: "wnba or nba"
      - name: season
        description: "The league's current season (the latest in the standings)"
      - name: team_id
        description: "League stats API team id"
      - name: conference
        description: "East or West"
      - name: playoff_rank
        description: "Place in the conference"
      - name: wins
        description: "Regular-season wins"
      - name: losses
        description: "Regular-season losses"
      - name: conference_games_back
        description: "Games behind the conference leader"
      - name: last_10
        description: "Record over the last ten games, W-L"
      - name: current_streak
        description: "Current streak, such as W 3"
      - name: stakes
        description: "eliminated (out of the playoff and play-in race), clinched (a playoff place secured) or racing"
        data_tests:
          - accepted_values:
              values: [eliminated, clinched, racing]
      - name: games_left
        description: "Regular-season games not yet final from today's Eastern date on"
      - name: rest_risk
        description: "True for a clinched or eliminated team with 1 to 10 games left (1 to 6 in the WNBA); false once none are left"
      - name: observed_date
        description: "Ingest date of the standings landing"

  - name: fct_market_value
    description: "The fantasy market's view of each player from ESPN fantasy: the order drafters take players in, and how widely leagues roster them. The site shows the rank and the bucket, not ESPN's numbers."
    columns:
      - name: market_value_sk
        description: "Surrogate key: one row per league and league player"
        data_tests: [unique, not_null]
      - name: league
        description: "wnba or nba"
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
      - name: stats_player_id
        description: "League player id through the player crosswalk"
      - name: espn_player_id
        description: "ESPN athlete id"
      - name: market_rank
        description: "Order by ESPN average draft position among players with a real one; null for undrafted players and for a league whose positions are a placeholder"
      - name: ownership_bucket
        description: "most (70%+ of ESPN leagues), many (40 to 70), some (10 to 40), few (1 to 10) or rare (under 1)"
        data_tests:
          - accepted_values:
              values: [most, many, some, few, rare]
      - name: ownership_trend
        description: "rising when ESPN's ownership change is +1 point or more, falling at -1 or less, else null: the waiver signal for both leagues"
        data_tests:
          - accepted_values:
              values: [rising, falling]
      - name: percent_owned
        description: "Percent of ESPN leagues rostering the player, 0-100; null when no league does"
      - name: percent_started
        description: "Percent of ESPN leagues starting the player, 0-100"
      - name: average_draft_position
        description: "ESPN's average draft position as given, placeholder values included"
      - name: auction_value_average
        description: "Average price in ESPN auction drafts"
      - name: percent_owned_change
        description: "Change in percent_owned over the last week, in percentage points"
      - name: observed_date
        description: "Ingest date of the league's latest ESPN fantasy landing"

  - name: fct_team_game_context
    description: "The circumstances of each team's games, played and scheduled: rest days, back-to-backs, three games in four nights, miles travelled, time zones crossed and altitude."
    columns:
      - name: team_game_context_sk
        description: "Surrogate key: one row per league, game and team"
        data_tests: [unique, not_null]
      - name: league
        description: "wnba or nba"
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
      - name: game_id
        description: "League stats API game id"
      - name: game_date
        description: "Game date in US Eastern time, from the schedule"
      - name: game_type
        description: "regular, play_in, playoffs or tournament_final"
