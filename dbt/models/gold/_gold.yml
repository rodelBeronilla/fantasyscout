version: 2

models:
  - name: dim_date
    description: "One row per calendar date from 2018 to 2027, with the fantasy week and game-day flags per league."
    columns:
      - name: date_sk
        description: "Surrogate key"
        data_tests: [unique, not_null]
      - name: date_day
        description: "Calendar date"
        data_tests: [unique, not_null]
      - name: fantasy_week
        description: "Monday-to-Sunday week label, YYYY-Www"
        data_tests: [not_null]

  - name: dim_team
    description: "One row per team per season."
    columns:
      - name: team_sk
        description: "Surrogate key of league, season and team id"
        data_tests: [unique, not_null]
      - name: team_id
        description: "League stats API team id"
        data_tests: [not_null]

  - name: dim_game
    description: "One row per game with result and schedule context."
    columns:
      - name: game_sk
        description: "Surrogate key of league and game id"
        data_tests: [unique, not_null]
      - name: game_id
        description: "League stats API game id"
        data_tests: [not_null]
      - name: game_date
        description: "Game date"
        data_tests: [not_null]
      - name: home_team_sk
        description: "Home team"
        data_tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: away_team_sk
        description: "Away team"
        data_tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk

  - name: dim_player
    description: "One row per player per team stint (SCD type 2 on team); valid_to is null for the current stint."
    columns:
      - name: player_sk
        description: "Surrogate key of league, player id and stint start"
        data_tests: [unique, not_null]
      - name: stats_player_id
        description: "League stats API player id"
        data_tests: [not_null]
      - name: espn_player_id
        description: "ESPN athlete id from silver.player_xwalk; null when the player is unmatched"
      - name: valid_from
        description: "First game date of the stint"
        data_tests: [not_null]

  - name: fct_player_game
    description: "Player × game: box score, advanced line, source agreement flag."
    columns:
      - name: player_game_sk
        description: "Surrogate key"
        data_tests: [unique, not_null]
      - name: player_sk
        description: "Stint the game falls in"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: game_sk
        description: "Game"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_game')
              field: game_sk
      - name: team_sk
        description: "Team-season"
        data_tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: source_agreement
        description: "Reconciliation verdict against ESPN (ADR 0005): exact, minor (minutes only, within one), conflict, or unverified when ESPN does not report the player-game"
        data_tests:
          - accepted_values:
              values: [exact, minor, conflict, unverified]

  - name: fct_team_game
    description: "Team × game with possessions, pace and ratings."
    columns:
      - name: team_game_sk
        description: "Surrogate key"
        data_tests: [unique, not_null]
      - name: game_sk
        description: "Game"
        data_tests:
          - relationships:
              to: ref('dim_game')
              field: game_sk
      - name: team_sk
        description: "Team-season"
        data_tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk

  - name: fct_event
    description: "One row per play-by-play action."
    columns:
      - name: event_sk
        description: "Surrogate key"
        data_tests: [unique, not_null]
      - name: game_sk
        description: "Game"
        data_tests:
          - relationships:
              to: ref('dim_game')
              field: game_sk

  - name: fct_shot
    description: "One row per field goal attempt with court coordinates."
    columns:
      - name: shot_sk
        description: "Surrogate key"
        data_tests: [unique, not_null]
      - name: game_sk
        description: "Game"
        data_tests:
          - relationships:
              to: ref('dim_game')
              field: game_sk

  - name: fct_availability
    description: "Player × report day from the injury report."
    columns:
      - name: availability_sk
        description: "Surrogate key"
        data_tests: [unique, not_null]
      - name: status_group
        description: "out, day_to_day, questionable, doubtful or other"
        data_tests:
          - accepted_values:
              values: [out, day_to_day, questionable, doubtful, other]
      - name: stats_player_id
        description: "League player id, linked by name within the team (ESPN roster and crosswalk, or the league roster); null when no match"
      - name: is_current
        description: "True for the rows of the latest injury report per league"
        data_tests: [not_null]

  - name: mart_player_rolling
    description: "Player × game with rolling 5, 10 and 20-game category averages; percentages volume-weighted."
    columns:
      - name: player_game_sk
        description: "Surrogate key"
        data_tests: [unique, not_null]

  - name: mart_category_zscores
    description: "Category z-scores per league, season, window and player against the top-N pool."
    columns:
      - name: zscore_sk
        description: "Surrogate key of window, league, season and player"
        data_tests: [unique, not_null]
      - name: window_name
        description: "season, last_10 or last_20"
        data_tests:
          - accepted_values:
              values: [season, last_10, last_20]

  - name: mart_player_projection
    description: "One projected per-game line per player on a current roster: the current season and the two before, weighted by games and recency, starting from a replacement-level line."
    columns:
      - name: projection_sk
        description: "Surrogate key"
        data_tests: [unique, not_null]
      - name: sample_weight
        description: "Games behind the projection, each season's games times its recency weight"
        data_tests: [not_null]
      - name: w_prior
        description: "Share of the projection that is the replacement-level line"
        data_tests: [not_null]
      - name: proj_points_pg
        description: "Projected points per game"
        data_tests: [not_null]
      - name: games_share
        description: "Projected share of team games played, regressed toward a typical share"
        data_tests: [not_null]
      - name: proj_minutes_pg
        description: "Projected minutes per game"
        data_tests: [not_null]

  - name: mart_board
    description: "The board: value above replacement per rostered player from the projected line, recent form, the per-game line, injury status and rest-of-season scaling."
    columns:
      - name: board_sk
        description: "Surrogate key"
        data_tests: [unique, not_null]
      - name: value_per_game
        description: "Sum of the nine category values per game above replacement (zero is a freely available player)"
        data_tests: [not_null]
      - name: value_total
        description: "Value per game above replacement times the projected share of team games played"
        data_tests: [not_null]
      - name: ros_factor
        description: "Remaining share of the team's regular season times availability (1.0 once the regular season is over)"
        data_tests: [not_null]
      - name: availability_multiplier
        description: "Share of the team's remaining regular-season games the player is expected to play (1.0 once the regular season is over)"
        data_tests: [not_null]
      - name: season_complete
        description: "True when the league has no regular-season games left (playoffs or off-season)"
        data_tests: [not_null]
      - name: value_rest_of_season
        description: "Value above replacement scaled by ros_factor; a value below replacement is unscaled"
        data_tests: [not_null]

  - name: mart_schedule_upcoming
    description: "Regular-season and playoff games of the next fourteen days, confirmed games only."
    columns:
      - name: upcoming_sk
        description: "Surrogate key"
        data_tests: [unique, not_null]
      - name: days_ahead
        description: "Days from the build date"
        data_tests: [not_null]

  - name: mart_streamers
    description: "Players active in the league's current season with games in the next seven days, the minutes and value trend, recent production and injury status."
    columns:
      - name: streamer_sk
        description: "Surrogate key"
        data_tests: [unique, not_null]
      - name: minutes_baseline
        description: "Minutes per game before the last five games this season, blended with last season counted as up to 10 games"
      - name: minutes_trend
        description: "Minutes per game over the last five games minus the baseline; null without one"
      - name: value_baseline
        description: "Season value z-score blended with last season's, last season counting for up to 10 games and this season for its games before the last ten"
      - name: value_trend
        description: "Value z-score over the last ten games minus the baseline; null without one"
