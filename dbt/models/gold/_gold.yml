        description: "Minutes per game in the window"
      - name: in_pool
        description: "True for the pool: the top 180 NBA or 90 WNBA players by total minutes in the window"
      - name: points_pg
        description: "Average points per game in the window"
      - name: rebounds_total_pg
        description: "Average rebounds per game in the window"
      - name: assists_pg
        description: "Average assists per game in the window"
      - name: steals_pg
        description: "Average steals per game in the window"
      - name: blocks_pg
        description: "Average blocks per game in the window"
      - name: three_pointers_made_pg
        description: "Average three-pointers made per game in the window"
      - name: turnovers_pg
        description: "Average turnovers per game in the window"
      - name: field_goal_pct
        description: "Field goals made over attempted in the window, decimal 0-1"
      - name: free_throw_pct
        description: "Free throws made over attempted in the window, decimal 0-1"
      - name: fga_pg
        description: "Field goals attempted per game in the window"
      - name: fta_pg
        description: "Free throws attempted per game in the window"
      - name: z_points
        description: "Points per game z-score against the pool's mean and standard deviation"
      - name: z_rebounds_total
        description: "Rebounds per game z-score against the pool's mean and standard deviation"
      - name: z_assists
        description: "Assists per game z-score against the pool's mean and standard deviation"
      - name: z_steals
        description: "Steals per game z-score against the pool's mean and standard deviation"
      - name: z_blocks
        description: "Blocks per game z-score against the pool's mean and standard deviation"
      - name: z_three_pointers_made
        description: "Three-pointers made per game z-score against the pool's mean and standard deviation"
      - name: z_turnovers
        description: "Turnovers per game z-score against the pool, negated so fewer turnovers score higher"
      - name: z_field_goal_pct
        description: "Field goal impact z-score: (player pct - pool pct) x field goal attempts per game, standardised over the pool"
      - name: z_free_throw_pct
        description: "Free throw impact z-score: (player pct - pool pct) x free throw attempts per game, standardised over the pool"
