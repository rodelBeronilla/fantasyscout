  - name: mart_player_projection
    description: "One projected per-game line per player on a current roster: per-minute production from the current season and the two before, weighted by minutes times recency, times projected minutes, each from a replacement-level prior; in season, projected minutes blend with the last five games (fantasy_recent_minutes)."
    columns:
      - name: projection_sk
        description: "Surrogate key: one row per league and player"
        data_tests: [unique, not_null]
      - name: league
        description: "wnba or nba"
      - name: season
        description: "The league's current season (the latest with games)"
      - name: player_id
        description: "League stats API player id"
      - name: team_id
        description: "League team id on the player's current roster"
      - name: roster_season
        description: "Season of the roster landing the player is on"
      - name: age
        description: "Age in years as the roster gives it"
      - name: is_rookie
        description: "True when the roster lists the player's experience as R"
      - name: prev_team_id
        description: "Team the player played most games for in the latest earlier season with games"
      - name: is_new_team
        description: "True when that earlier team differs from the current roster team"
      - name: games_current
        description: "Games played in the current season"
      - name: games_prev
        description: "Games played the season before"
      - name: games_prev2
        description: "Games played two seasons before"
      - name: minutes_current
        description: "Total minutes played in the current season"
      - name: minutes_prev
        description: "Total minutes played the season before"
      - name: minutes_prev2
        description: "Total minutes played two seasons before"
      - name: sample_weight
        description: "Games behind the projection, each season's games times its recency weight"
        data_tests: [not_null]
      - name: prior_games
        description: "Games of a replacement-level player every projection starts from (3 NBA, 5 WNBA)"
      - name: w_cur
        description: "Share of the per-minute production weight from the current season (its minutes times its recency weight)"
      - name: w_prev
        description: "Share of the per-minute production weight from the season before"
      - name: w_prev2
        description: "Share of the per-minute production weight from two seasons before"
      - name: w_prior
        description: "Share of the per-minute production weight that is the replacement-level prior"
        data_tests: [not_null]
      - name: games_share
        description: "Projected share of team games played, regressed toward a typical share (0.8) and capped at 1"
        data_tests: [not_null]
      - name: proj_minutes_pg
        description: "Projected minutes per game: proj_minutes_season_pg, blended half and half with minutes_last5_pg in season after 5+ games"
        data_tests: [not_null]
      - name: proj_minutes_season_pg
        description: "Minutes per game from the seasons alone (games by minutes recency, from the replacement prior)"
      - name: minutes_last5_pg
        description: "Minutes per game over the player's last five games this season for the current team; null without any"
      - name: proj_points_pg
        description: "Projected points per game: the weighted per-minute rate times proj_minutes_pg"
        data_tests: [not_null]
      - name: proj_rebounds_total_pg
        description: "Projected rebounds per game: the weighted per-minute rate times proj_minutes_pg"
      - name: proj_assists_pg
        description: "Projected assists per game: the weighted per-minute rate times proj_minutes_pg"
      - name: proj_steals_pg
        description: "Projected steals per game: the weighted per-minute rate times proj_minutes_pg"
      - name: proj_blocks_pg
        description: "Projected blocks per game: the weighted per-minute rate times proj_minutes_pg"
      - name: proj_three_pointers_made_pg
        description: "Projected three-pointers made per game: the weighted per-minute rate times proj_minutes_pg"
      - name: proj_turnovers_pg
        description: "Projected turnovers per game: the weighted per-minute rate times proj_minutes_pg"
      - name: proj_fgm_pg
        description: "Projected field goals made per game"
      - name: proj_fga_pg
        description: "Projected field goals attempted per game"
      - name: proj_ftm_pg
        description: "Projected free throws made per game"
      - name: proj_fta_pg
        description: "Projected free throws attempted per game"
      - name: proj_field_goal_pct
        description: "proj_fgm_pg over proj_fga_pg, decimal 0-1"
      - name: proj_free_throw_pct
        description: "proj_ftm_pg over proj_fta_pg, decimal 0-1"

