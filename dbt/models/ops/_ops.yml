version: 2

models:
  - name: ingest_log
    description: "One row per ingest run, parsed from the run logs the ingestors write to the landing volume."
    columns:
      - name: run_id
        description: "Run id the ingestor generates, 12 hex characters"
        data_tests: [unique, not_null]
      - name: source
        description: "stats, espn or reports (the reports run also lands lineups, transactions, ESPN fantasy, news and Sleeper)"
        data_tests: [not_null]
      - name: league
        description: "wnba or nba"
        data_tests: [not_null]
      - name: season
        description: "Season label of the run"
      - name: started_at
        meta: {tz: UTC}
        description: "When the run started (UTC)"
      - name: finished_at
        meta: {tz: UTC}
        description: "When the run finished (UTC)"
      - name: window_since
        description: "First date of the run's window"
      - name: window_until
        description: "Last date of the run's window"
      - name: full_refresh
        description: "True when the run re-lands payloads even when unchanged"
      - name: backend
        description: "local (a directory) or volume (the Unity Catalog volume)"
      - name: games
        description: "Games in the run's window (for reports, matchups on the injury report)"
      - name: landed
        description: "Payloads written this run"
      - name: unchanged
        description: "Payloads refetched with the same bytes as the last landing, so nothing new was written"
      - name: skipped
        description: "Requests not made: already landed today, or a game's payload already settled"
      - name: failures
        description: "Requests that failed this run"
      - name: endpoints
        description: "Per endpoint, the run's landed, unchanged, failed and missing counts, as JSON (absent in run logs written before 2026-11); a request skipped as already landed is counted in skipped only"
      - name: missing_at_source
        description: "Keys the source has no payload for (for example an ESPN event with no summary); not failures"
      - name: _source_file
        description: "Path of the run log the row was parsed from"

  - name: fetch_failures
    description: "Every request an ingest run could not land, one row each, from the run logs: the failures (an error of ours or the host's) and the payloads missing at the source (HTTP 404). Names the endpoint and key so a replay can target them (fs-ingest land --from-run-log or --only)."
    columns:
      - name: run_id
        description: "Run id of the ingest run (ingest_log.run_id)"
      - name: source
        description: "Source the run pulled from: stats, espn or reports"
      - name: league
        description: "League the run covered: wnba or nba"
      - name: season
        description: "Season label the run landed under"
      - name: started_at
        meta: {tz: UTC}
        description: "When the run started (UTC)"
      - name: kind
        description: "failed (an error of ours or the host's) or missing (the source has no payload for the key, HTTP 404)"
      - name: endpoint
        description: "Endpoint of the request, as the landing folders name it"
      - name: request_key
        description: "Key the payload lands under: a game id, a team id, a date or a season label"
      - name: reason
        description: "The error, as the ingestor recorded it"
      - name: _source_file
        description: "The run log the row was read from"

  - name: reconciliation
    description: "One row per value the two sources disagree on, with both values and the resolution: the league value wins, ESPN only where the league's is null (ADR 0005). A snapshot of the current comparison."
    columns:
      - name: league
        description: "wnba or nba"
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
      - name: game_id
        description: "League stats API game id"
      - name: event_id
        description: "ESPN event id of the matched game"
      - name: stats_player_id
        description: "League stats API player id"
      - name: espn_player_id
        description: "ESPN athlete id"
      - name: stat
        description: "The compared measure: minutes or one of the twelve box-score counts"
        data_tests: [not_null]
      - name: reconciliation_key
        description: "Natural key: league, game id, stats player id and stat; one row per disagreement"
        data_tests: [unique, not_null]
      - name: stats_value
        description: "The league's value; null when the league has none"
      - name: espn_value
        description: "ESPN's value; null when ESPN has none"
      - name: delta
        description: "espn_value minus stats_value; null when either is null"
      - name: resolution
        description: "stats (the league's value stands) or espn (only where the league's value is null)"
        data_tests:
          - accepted_values:
              values: [stats, espn]
      - name: resolved_value
        description: "The value that stands: the league's, else ESPN's"
      - name: reconciled_at
        meta: {tz: UTC}
        description: "Build time of the comparison"

  - name: reconciliation_summary
    description: "Match and conflict rates per league and season: how many of the league's player-games ESPN also reports and the crosswalk pairs, and how those pairs agree."
    columns:
      - name: league
        description: "wnba or nba"
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
      - name: summary_key
        description: "Natural key: league and season; one row per league-season"
        data_tests: [unique, not_null]
      - name: player_games
        description: "Lines in the league box score, inactive players included"
      - name: matched
        description: "Lines ESPN also reports and the crosswalk pairs"
      - name: unmatched
        description: "Lines with no ESPN pair"
      - name: match_rate
        description: "Matched player-games over every line of the league box score, inactive players included"
        data_tests: [not_null]
      - name: played_player_games
        description: "Lines where the player had minutes above zero"
      - name: played_matched
        description: "Played lines with an ESPN pair"
      - name: played_match_rate
        description: "Matched player-games over the lines where the player was on the floor; null when none; the coverage check judges this one"
      - name: exact
        description: "Matched lines whose verdict is exact"
      - name: minor
        description: "Matched lines whose verdict is minor"
      - name: conflict
        description: "Matched lines whose verdict is conflict"
      - name: conflict_rate
        description: "Conflicts over matched lines; null when none matched"
      - name: summarised_at
        meta: {tz: UTC}
        description: "Build time of the summary"

  - name: ingest_endpoint_log
    description: "One row per ingest run and endpoint: the landed, unchanged, failed and missing counts the run log records for each endpoint (ingest_log.endpoints, one JSON object, turned into rows). Runs logged before 2026-11 carry no per-endpoint counts and have no rows."
    columns:
      - name: run_id
        description: "Run id of the ingest run (ingest_log.run_id)"
        data_tests: [not_null]
      - name: source
        description: "Source the run pulled from: stats, espn or reports"
      - name: league
        description: "League the run covered: wnba or nba"
      - name: started_at
        meta: {tz: UTC}
        description: "When the run started (UTC)"
      - name: window_since
        description: "First date of the run's window"
      - name: window_until
        description: "Last date of the run's window"
      - name: full_refresh
        description: "True when the run re-landed payloads even when unchanged"
      - name: endpoint
        description: "Endpoint, as the landing folders name it"
        data_tests: [not_null]
      - name: landed
        description: "Payloads of the endpoint written this run"
      - name: unchanged
        description: "Payloads of the endpoint refetched with the same bytes as the last landing"
      - name: failed
        description: "Requests to the endpoint that failed this run"
      - name: missing
        description: "Keys the endpoint has no payload for at the source (HTTP 404)"

  - name: ingest_endpoint_volume
    description: "Each endpoint's latest run against its trailing runs: payloads landed or unchanged per day of the run's window, the median and median absolute deviation of the 14 runs before, and whether the latest is more than three spreads from the median (the source-level volume check's rules, applied per endpoint). Full-refresh and backfill windows are left out; warn_ingest_endpoint_volume_anomaly warns on is_anomaly."
    columns:
      - name: source
        description: "Source the endpoint belongs to: stats, espn or reports"
      - name: league
        description: "League: wnba or nba"
      - name: endpoint
        description: "Endpoint, as the landing folders name it"
      - name: run_id
        description: "The endpoint's latest run (ingest_log.run_id)"
      - name: started_at
        meta: {tz: UTC}
        description: "When that run started (UTC)"
      - name: payloads
        description: "Payloads of the endpoint the latest run landed or found unchanged, summed over its passes"
      - name: per_day
        description: "Payloads per day of the run's window"
      - name: med_per_day
        description: "Median payloads per window day over the 14 runs before the latest"
      - name: mad_per_day
        description: "Median absolute deviation of those runs from the median"
      - name: spread
        description: "The deviation floored at a tenth of the median or two payloads a day"
      - name: prior_runs
        description: "Earlier runs the median is taken over (up to 14)"
      - name: is_anomaly
        description: "True when there are at least five earlier runs and the latest is more than three spreads from the median"
