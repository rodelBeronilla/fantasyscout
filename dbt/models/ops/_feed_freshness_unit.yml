unit_tests:
  - name: feed_freshness_statuses
    description: >
      The five statuses (#397): landed within the allowance is fresh, past it stale while the
      league plays, any age off_season when it does not, never landed never, and never landed for
      an optional feed (a key not set yet) unconfigured. Today is pinned to 2026-11-02 with the NBA
      in season and the WNBA not.
    model: feed_freshness
    overrides:
      vars:
        as_of: '2026-11-02'
    given:
      - input: ref('espn_fantasy_players')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('espn_injuries')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('espn_news')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('espn_prop_bets')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('espn_roster')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('espn_scoreboard')
        rows:
          - {league: nba, _ingest_date: 2026-11-02, _source_file: espn_scoreboard.json}
          - {league: wnba, _ingest_date: 2026-10-01, _source_file: espn_scoreboard.json}
      - input: ref('espn_summary_players')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('espn_transactions')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('league_daily_lineups')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('league_injury_report')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('league_player_movement')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('league_referee_assignments')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('odds_api_player_props')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('sleeper_players')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('sleeper_trending')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('stats_boxscoretraditionalv3')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('stats_commonallplayers')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('stats_commonteamroster')
        rows:
          - {league: nba, _ingest_date: 2026-10-29, _source_file: stats_commonteamroster.json}
      - input: ref('stats_leaguedashptstats_passing')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('stats_leaguegamelog')
        rows:
          - {league: nba, _ingest_date: 2026-10-29, _source_file: stats_leaguegamelog.json}
      - input: ref('stats_leaguehustlestatsplayer')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('stats_leaguestandingsv3')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('stats_playbyplayv3')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('stats_playergamelogs')
