        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('stats_playergamelogs_misc')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('stats_playergamelogs_usage')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('stats_scheduleleaguev2')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('stats_shotchartdetail')
        format: sql
        rows: |
          select cast(null as string) as league, cast(null as date) as _ingest_date, cast(null as string) as _source_file where false
      - input: ref('int_league_season_state')
        rows:
          - {league: nba, in_season_window: true}
          - {league: wnba, in_season_window: false}
    expect:
      rows:
        - {feed_key: 'nba:stats_scheduleleaguev2', status: never}
        - {feed_key: 'wnba:stats_scheduleleaguev2', status: never}
        - {feed_key: 'nba:stats_leaguegamelog', status: stale}
        - {feed_key: 'wnba:stats_leaguegamelog', status: never}
        - {feed_key: 'nba:stats_boxscoretraditionalv3', status: never}
        - {feed_key: 'wnba:stats_boxscoretraditionalv3', status: never}
        - {feed_key: 'nba:stats_playbyplayv3', status: never}
        - {feed_key: 'wnba:stats_playbyplayv3', status: never}
        - {feed_key: 'nba:stats_shotchartdetail', status: never}
        - {feed_key: 'wnba:stats_shotchartdetail', status: never}
        - {feed_key: 'nba:stats_playergamelogs', status: never}
        - {feed_key: 'wnba:stats_playergamelogs', status: never}
        - {feed_key: 'nba:stats_playergamelogs_usage', status: never}
        - {feed_key: 'wnba:stats_playergamelogs_usage', status: never}
        - {feed_key: 'nba:stats_playergamelogs_misc', status: never}
        - {feed_key: 'wnba:stats_playergamelogs_misc', status: never}
        - {feed_key: 'nba:stats_leaguestandingsv3', status: never}
        - {feed_key: 'wnba:stats_leaguestandingsv3', status: never}
        - {feed_key: 'nba:stats_commonteamroster', status: fresh}
        - {feed_key: 'wnba:stats_commonteamroster', status: never}
        - {feed_key: 'nba:stats_commonallplayers', status: never}
        - {feed_key: 'wnba:stats_commonallplayers', status: never}
        - {feed_key: 'nba:stats_leaguedashptstats_passing', status: never}
        - {feed_key: 'nba:stats_leaguehustlestatsplayer', status: never}
        - {feed_key: 'nba:espn_scoreboard', status: fresh}
        - {feed_key: 'wnba:espn_scoreboard', status: off_season}
        - {feed_key: 'nba:espn_summary_players', status: never}
        - {feed_key: 'wnba:espn_summary_players', status: never}
        - {feed_key: 'nba:espn_roster', status: never}
        - {feed_key: 'wnba:espn_roster', status: never}
        - {feed_key: 'nba:espn_injuries', status: never}
        - {feed_key: 'wnba:espn_injuries', status: never}
        - {feed_key: 'nba:espn_transactions', status: never}
        - {feed_key: 'wnba:espn_transactions', status: never}
        - {feed_key: 'nba:espn_fantasy_players', status: never}
        - {feed_key: 'wnba:espn_fantasy_players', status: never}
        - {feed_key: 'nba:espn_news', status: never}
        - {feed_key: 'wnba:espn_news', status: never}
        - {feed_key: 'nba:espn_prop_bets', status: never}
        - {feed_key: 'wnba:espn_prop_bets', status: never}
        - {feed_key: 'nba:odds_api_player_props', status: unconfigured}
        - {feed_key: 'wnba:odds_api_player_props', status: unconfigured}
        - {feed_key: 'nba:league_injury_report', status: never}
        - {feed_key: 'wnba:league_injury_report', status: never}
        - {feed_key: 'nba:league_referee_assignments', status: never}
        - {feed_key: 'wnba:league_referee_assignments', status: never}
        - {feed_key: 'nba:league_daily_lineups', status: never}
        - {feed_key: 'nba:league_player_movement', status: never}
        - {feed_key: 'nba:sleeper_players', status: never}
