unit_tests:
  - name: event_lineups_matches_abbreviated_given_names
    description: >
      Teammates who share a surname are told apart by the start of the given name
      ("K. Mitchell", "Jal. Williams") or by a suffix ("Carter Jr." is not Carter); a
      surname that has since gained a hyphenated part ("Laney", now "Laney-Hamilton") still
      matches; the substitution belongs to the lineup before it. The row's _ingest_date is
      the newer of the play-by-play's and the box score's landing.
    model: event_lineups
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('player_game_box')
        rows:
          - {league: wnba, game_id: g1, team_id: '100', side: home, player_id: '1', starter: true, first_name: Tiffany, family_name: Mitchell, _ingest_date: 2026-10-21}
          - {league: wnba, game_id: g1, team_id: '100', side: home, player_id: '2', starter: true, first_name: Ann, family_name: Abel, _ingest_date: 2026-10-21}
          - {league: wnba, game_id: g1, team_id: '100', side: home, player_id: '3', starter: true, first_name: Bea, family_name: Bell, _ingest_date: 2026-10-21}
          - {league: wnba, game_id: g1, team_id: '100', side: home, player_id: '4', starter: true, first_name: Cat, family_name: Cole, _ingest_date: 2026-10-21}
          - {league: wnba, game_id: g1, team_id: '100', side: home, player_id: '5', starter: true, first_name: Dee, family_name: Dunn, _ingest_date: 2026-10-21}
          - {league: wnba, game_id: g1, team_id: '100', side: home, player_id: '6', starter: false, first_name: Kelsey, family_name: Mitchell, _ingest_date: 2026-10-21}
          - {league: wnba, game_id: g1, team_id: '100', side: home, player_id: '7', starter: false, first_name: Jaylin, family_name: Williams, _ingest_date: 2026-10-21}
          - {league: wnba, game_id: g1, team_id: '100', side: home, player_id: '8', starter: false, first_name: Jalen, family_name: Williams, _ingest_date: 2026-10-21}
          - {league: wnba, game_id: g1, team_id: '100', side: home, player_id: '16', starter: false, first_name: Jevon, family_name: Carter, _ingest_date: 2026-10-21}
          - {league: wnba, game_id: g1, team_id: '100', side: home, player_id: '9', starter: false, first_name: Wendell, family_name: Carter Jr., _ingest_date: 2026-10-21}
          - {league: wnba, game_id: g1, team_id: '100', side: home, player_id: '17', starter: false, first_name: Betnijah, family_name: Laney-Hamilton, _ingest_date: 2026-10-21}
          - {league: wnba, game_id: g1, team_id: '200', side: away, player_id: '11', starter: true, first_name: Eve, family_name: Eads, _ingest_date: 2026-10-21}
          - {league: wnba, game_id: g1, team_id: '200', side: away, player_id: '12', starter: true, first_name: Fay, family_name: Ford, _ingest_date: 2026-10-21}
          - {league: wnba, game_id: g1, team_id: '200', side: away, player_id: '13', starter: true, first_name: Gia, family_name: Gray, _ingest_date: 2026-10-21}
          - {league: wnba, game_id: g1, team_id: '200', side: away, player_id: '14', starter: true, first_name: Hal, family_name: Hart, _ingest_date: 2026-10-21}
          - {league: wnba, game_id: g1, team_id: '200', side: away, player_id: '15', starter: true, first_name: Ivy, family_name: Irwin, _ingest_date: 2026-10-21}
      - input: ref('events')
        rows:
          - {league: wnba, season: '2026', game_id: g1, event_key: e1, period: 1, clock: PT10M00.00S, action_number: 1, team_id: '0', player_id: '0', action_type: period, description: Start of 1st Period, _ingest_date: 2026-10-20}
          - {league: wnba, season: '2026', game_id: g1, event_key: e2, period: 1, clock: PT09M00.00S, action_number: 2, team_id: '100', player_id: '1', action_type: Substitution, description: 'SUB: K. Mitchell FOR T. Mitchell', _ingest_date: 2026-10-20}
          - {league: wnba, season: '2026', game_id: g1, event_key: e3, period: 1, clock: PT08M00.00S, action_number: 3, team_id: '100', player_id: '6', action_type: Made Shot, description: K. Mitchell Layup, _ingest_date: 2026-10-20}
          - {league: wnba, season: '2026', game_id: g1, event_key: e4, period: 1, clock: PT07M00.00S, action_number: 4, team_id: '100', player_id: '2', action_type: Substitution, description: 'SUB: Jal. Williams FOR Abel', _ingest_date: 2026-10-20}
          - {league: wnba, season: '2026', game_id: g1, event_key: e5, period: 1, clock: PT06M00.00S, action_number: 5, team_id: '100', player_id: '8', action_type: Made Shot, description: Jal. Williams Layup, _ingest_date: 2026-10-20}
          - {league: wnba, season: '2026', game_id: g1, event_key: e6, period: 1, clock: PT05M00.00S, action_number: 6, team_id: '100', player_id: '3', action_type: Substitution, description: 'SUB: Carter Jr. FOR Bell', _ingest_date: 2026-10-20}
          - {league: wnba, season: '2026', game_id: g1, event_key: e7, period: 1, clock: PT04M00.00S, action_number: 7, team_id: '100', player_id: '9', action_type: Made Shot, description: Carter Jr. Dunk, _ingest_date: 2026-10-20}
          - {league: wnba, season: '2026', game_id: g1, event_key: e8, period: 1, clock: PT03M00.00S, action_number: 8, team_id: '100', player_id: '5', action_type: Substitution, description: 'SUB: Laney FOR Dunn', _ingest_date: 2026-10-20}
          - {league: wnba, season: '2026', game_id: g1, event_key: e9, period: 1, clock: PT02M00.00S, action_number: 9, team_id: '100', player_id: '17', action_type: Made Shot, description: Laney Jumper, _ingest_date: 2026-10-20}
    expect:
      rows:
        - {event_key: e1, lineup_home: '1,2,3,4,5', lineup_away: '11,12,13,14,15', lineup_complete: true, _ingest_date: 2026-10-21}
        - {event_key: e2, lineup_home: '1,2,3,4,5', lineup_away: '11,12,13,14,15', lineup_complete: true, _ingest_date: 2026-10-21}
        - {event_key: e3, lineup_home: '2,3,4,5,6', lineup_away: '11,12,13,14,15', lineup_complete: true, _ingest_date: 2026-10-21}
        - {event_key: e4, lineup_home: '2,3,4,5,6', lineup_away: '11,12,13,14,15', lineup_complete: true, _ingest_date: 2026-10-21}
        - {event_key: e5, lineup_home: '3,4,5,6,8', lineup_away: '11,12,13,14,15', lineup_complete: true, _ingest_date: 2026-10-21}
        - {event_key: e6, lineup_home: '3,4,5,6,8', lineup_away: '11,12,13,14,15', lineup_complete: true, _ingest_date: 2026-10-21}
        - {event_key: e7, lineup_home: '4,5,6,8,9', lineup_away: '11,12,13,14,15', lineup_complete: true, _ingest_date: 2026-10-21}
        - {event_key: e8, lineup_home: '4,5,6,8,9', lineup_away: '11,12,13,14,15', lineup_complete: true, _ingest_date: 2026-10-21}
        - {event_key: e9, lineup_home: '17,4,6,8,9', lineup_away: '11,12,13,14,15', lineup_complete: true, _ingest_date: 2026-10-21}
