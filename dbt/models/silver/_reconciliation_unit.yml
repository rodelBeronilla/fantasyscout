          - {league: 'nba', event_id: 'e1', athlete_id: 'a3', minutes: 30, points: 10, rebounds_total: 0, assists: 0, steals: 0, blocks: 0, turnovers: 0, field_goals_made: 0, field_goals_attempted: 0, three_pointers_made: 0, three_pointers_attempted: 0, free_throws_made: 0, free_throws_attempted: 0}
          - {league: 'nba', event_id: 'e1', athlete_id: 'a4', minutes: 30, points: 12, rebounds_total: 0, assists: 0, steals: 0, blocks: 0, turnovers: 0, field_goals_made: 0, field_goals_attempted: 0, three_pointers_made: 0, three_pointers_attempted: 0, free_throws_made: 0, free_throws_attempted: 0}
          - {league: 'nba', event_id: 'e1', athlete_id: 'a5', minutes: null, points: null, rebounds_total: null, assists: null, steals: null, blocks: null, turnovers: null, field_goals_made: null, field_goals_attempted: null, three_pointers_made: null, three_pointers_attempted: null, free_throws_made: null, free_throws_attempted: null}
