version: 2

models:
  - name: player_claims
    description: "The local model's claims from the news, typed: one row per claim from the newest landing of each source item, cut by the day the source said it in a point-in-time build."
    columns:
      - name: player_claim_key
        description: "Natural key: league, source, source id, league player id and kind; one row per claim"
        data_tests: [unique, not_null]
      - name: league
        description: "wnba or nba"
        data_tests: [not_null]
      - name: season
        description: "Season label"
      - name: source
        description: "espn_news (an ESPN headline), espn_injury_note (an ESPN injury note), rss:<feed_id> (an outlet's feed item, by its id in ingest/rss_feeds.toml) or youtube:<channel> (a YouTube channel's video or transcript chunk, by its id in ingest/youtube_channels.toml); tests/assert_claim_sources_known.sql holds it to those"
        data_tests:
          - not_null
      - name: source_id
        description: "The ESPN article id, the injury listing id and a hash of the note's text, the feed item's id (silver.rss_feed_items), or a YouTube item's: the video id, or <video_id>-t<seconds> for a transcript chunk (gold.fct_player_youtube_item)"
        data_tests: [not_null]
      - name: stats_player_id
        description: "League player id the claim is about"
        data_tests: [not_null]
      - name: kind
        description: "What the claim says about the player's role, minutes or injury"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [role_up, role_down, minutes_up, minutes_down, injury_out, injury_return, injury_worse, injury_better, trade_rumor, other]
      - name: direction
        description: "1 good for the player's fantasy value, -1 bad, 0 neither"
        data_tests:
          - accepted_values:
              arguments:
                values: [-1, 0, 1]
                quote: false
      - name: confidence
        description: "The confidence kept, 0-1: the model's, capped by the extractor's rules"
      - name: model_confidence
        description: "The model's own confidence, 0-1"
      - name: confidence_cap
        description: "The most confidence the extractor's rules allow the claim: by source, a headline naming several players, the kind, a short quote, a hedge in the quote's sentence"
      - name: cap_reasons
        description: "Why the cap is what it is, as a JSON array of text"
      - name: quote
        description: "The span of the source text the claim rests on, as the source writes it"
      - name: quote_start
        description: "Where the quote starts in the source text (0-based character offset)"
      - name: source_text
        description: "The item's text as the model read it, so the quote can be audited"
      - name: published_at
        meta: {tz: UTC}
        description: "When the source said it (UTC); an injury note is dated by its UTC day only"
      - name: published_date
        description: "The day the source said it: the date a point-in-time build cuts on"
        data_tests: [not_null]
      - name: extracted_at
        meta: {tz: UTC}
        description: "When the model read the item (UTC)"
      - name: model
        description: "The local model that read the item"
      - name: prompt_version
        description: "Hash of the prompt the model was given (ai/prompts/claims.md)"
      - name: _ingest_date
        description: "Ingest date of the landed file the claim was read from"
      - name: _source_file
        description: "Path of the landed file the claim was read from"
