unit_tests:
  - name: player_claims_keep_the_newest_landing_of_each_item_and_one_claim_per_player_and_kind
    description: >
      An item extracted again replaces every claim of its older landing: the role claim the model
      no longer makes goes with it. The same player and kind twice in one item keeps the more
      confident one, and a row with no player is dropped. Values are typed.
    model: player_claims
    given:
      - input: ref('ai_claims')
        rows:
          - {league: nba, season: '2026-27', _ingest_date: '2026-10-28', _source_file: a1, request_key: espn_news-1, source: espn_news, source_id: '1', player_id: p1, kind: injury_out, direction: '-1', confidence: '0.6', model_confidence: '0.9', confidence_cap: '0.6', quote: 'ruled out', quote_start: '10', published_at: '2026-10-28T01:00:00Z', published_date: '2026-10-28', extracted_at: '2026-10-28T16:40:00Z'}
          - {league: nba, season: '2026-27', _ingest_date: '2026-10-28', _source_file: a1, request_key: espn_news-1, source: espn_news, source_id: '1', player_id: p1, kind: role_down, direction: '-1', confidence: '0.5', model_confidence: '0.5', confidence_cap: '0.8', quote: 'to the bench', quote_start: '30', published_at: '2026-10-28T01:00:00Z', published_date: '2026-10-28', extracted_at: '2026-10-28T16:40:00Z'}
          - {league: nba, season: '2026-27', _ingest_date: '2026-10-29', _source_file: a2, request_key: espn_news-1, source: espn_news, source_id: '1', player_id: p1, kind: injury_out, direction: '-1', confidence: '0.8', model_confidence: '0.95', confidence_cap: '0.8', quote: 'ruled out for Friday', quote_start: '10', published_at: '2026-10-28T01:00:00Z', published_date: '2026-10-28', extracted_at: '2026-10-29T16:40:00Z'}
          - {league: nba, season: '2026-27', _ingest_date: '2026-10-29', _source_file: b1, request_key: espn_injury_note-7-abc, source: espn_injury_note, source_id: 7-abc, player_id: p2, kind: injury_return, direction: '1', confidence: '0.5', model_confidence: '0.5', confidence_cap: '0.9', quote: 'cleared to play', quote_start: '0', published_at: '2026-10-29T00:00:00Z', published_date: '2026-10-29', extracted_at: '2026-10-29T16:41:00Z'}
          - {league: nba, season: '2026-27', _ingest_date: '2026-10-29', _source_file: b1, request_key: espn_injury_note-7-abc, source: espn_injury_note, source_id: 7-abc, player_id: p2, kind: injury_return, direction: '1', confidence: '0.7', model_confidence: '0.7', confidence_cap: '0.9', quote: 'will return Monday', quote_start: '40', published_at: '2026-10-29T00:00:00Z', published_date: '2026-10-29', extracted_at: '2026-10-29T16:41:00Z'}
          - {league: nba, season: '2026-27', _ingest_date: '2026-10-29', _source_file: b1, request_key: espn_injury_note-7-abc, source: espn_injury_note, source_id: 7-abc, player_id: null, kind: injury_out, direction: '-1', confidence: '0.9', model_confidence: '0.9', confidence_cap: '0.9', quote: 'out', quote_start: '0', published_at: '2026-10-29T00:00:00Z', published_date: '2026-10-29', extracted_at: '2026-10-29T16:41:00Z'}
    expect:
      rows:
        - {player_claim_key: 'nba:espn_news:1:p1:injury_out', stats_player_id: p1, direction: -1, confidence: 0.8, quote: 'ruled out for Friday', quote_start: 10, published_date: '2026-10-28', _source_file: a2}
        - {player_claim_key: 'nba:espn_injury_note:7-abc:p2:injury_return', stats_player_id: p2, direction: 1, confidence: 0.7, quote: 'will return Monday', quote_start: 40, published_date: '2026-10-29', _source_file: b1}
