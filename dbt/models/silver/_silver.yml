version: 2

models:
  - name: team_game_box
    description: "One row per team per game from the league game log, typed."
    columns:
      - name: team_game_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: season
        description: "season"
        data_tests: [not_null]
      - name: game_id
        description: "game id"
        data_tests: [not_null]
      - name: team_id
        description: "team id"
        data_tests: [not_null]
      - name: game_date
        description: "game date"
        data_tests: [not_null]

  - name: games
    description: "One row per game with home and away sides and the final score. At a neutral site both teams are listed as home by the source; the lower team id takes the home side and neutral_site is true."
    columns:
      - name: game_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: neutral_site
        description: "True when the source lists both teams as the home side (showcase games abroad, cup finals)."
        data_tests: [not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: season
        description: "season"
        data_tests: [not_null]
      - name: game_id
        description: "game id"
        data_tests: [not_null]
      - name: game_date
        description: "game date"
        data_tests: [not_null]

  - name: schedule
    description: "One row per scheduled game with status, venue and tip-off time. game_type (from the game id) separates preseason, regular season, All-Star, playoff, play-in and tournament-final games."
    columns:
      - name: game_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: game_type
        description: "preseason, regular, all_star, playoffs, play_in, tournament_final or other, from the third character of the game id."
        data_tests:
          - not_null
          - accepted_values:
              values: [preseason, regular, all_star, playoffs, play_in, tournament_final, other]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: season
        description: "season"
        data_tests: [not_null]
      - name: game_id
        description: "game id"
        data_tests: [not_null]

  - name: player_game_box
    description: "One row per player per game, traditional box score, typed."
    columns:
      - name: player_game_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: season
        description: "season"
        data_tests: [not_null]
      - name: game_id
        description: "game id"
        data_tests: [not_null]
      - name: player_id
        description: "player id"
        data_tests: [not_null]
      - name: team_id
        description: "team id"
        data_tests: [not_null]

  - name: player_game_advanced
    description: "One row per player per game, advanced box score, typed."
    columns:
      - name: player_game_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: season
        description: "season"
        data_tests: [not_null]
      - name: game_id
        description: "game id"
        data_tests: [not_null]
      - name: player_id
        description: "player id"
        data_tests: [not_null]

  - name: events
    description: "One row per play-by-play action, typed."
    columns:
      - name: event_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: season
        description: "season"
        data_tests: [not_null]
      - name: game_id
        description: "game id"
        data_tests: [not_null]
      - name: action_number
        description: "action number"
        data_tests: [not_null]

  - name: shots
    description: "One row per field goal attempt with court coordinates."
    columns:
      - name: shot_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: season
        description: "season"
        data_tests: [not_null]
      - name: game_id
        description: "game id"
        data_tests: [not_null]
      - name: game_event_id
        description: "game event id"
        data_tests: [not_null]
      - name: player_id
        description: "player id"
        data_tests: [not_null]

  - name: players
    description: "One row per player per league from the player directory."
    columns:
      - name: player_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: player_id
        description: "player id"
        data_tests: [not_null]
      - name: full_name
        description: "full name"
        data_tests: [not_null]

  - name: teams
    description: "One row per team per season, enriched from the teams seed."
    columns:
      - name: team_season_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: season
        description: "season"
        data_tests: [not_null]
      - name: team_id
        description: "team id"
        data_tests: [not_null]
      - name: abbreviation
        description: "abbreviation"
        data_tests: [not_null]

  - name: rosters
    description: "One row per rostered player per team per season."
    columns:
      - name: roster_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: season
        description: "season"
        data_tests: [not_null]
      - name: team_id
        description: "team id"
        data_tests: [not_null]
      - name: player_id
        description: "player id"
        data_tests: [not_null]

  - name: espn_events
    description: "One row per ESPN event with competitors unpacked."
    columns:
      - name: event_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: event_id
        description: "event id"
        data_tests: [not_null]
      - name: event_date
        description: "event date"
        data_tests: [not_null]
      - name: home_team_id
        description: "home team id"
        data_tests: [not_null]
      - name: away_team_id
        description: "away team id"
        data_tests: [not_null]

  - name: espn_player_game
    description: "One row per player per game from ESPN's box score."
    columns:
      - name: player_game_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: event_id
        description: "event id"
        data_tests: [not_null]
      - name: athlete_id
        description: "athlete id"
        data_tests: [not_null]
      - name: team_id
        description: "team id"
        data_tests: [not_null]

  - name: injuries
    description: "One row per injury listing from ESPN's report."
    columns:
      - name: injury_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: injury_id
        description: "injury id"
        data_tests: [not_null]
      - name: athlete_name
        description: "athlete name"
        data_tests: [not_null]
      - name: status
        description: "status"
        data_tests: [not_null]

  - name: espn_team_directory
    description: "One row per ESPN team per league from the teams endpoint."
    columns:
      - name: espn_team_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: display_name
        description: "Full team name as ESPN writes it"
        data_tests: [not_null]

  - name: espn_roster_players
    description: "One row per ESPN athlete per league from the team rosters, for names and birthdates."
    columns:
      - name: espn_player_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: full_name
        description: "Athlete display name"
        data_tests: [not_null]

  - name: team_xwalk
    description: "League stats API team id to ESPN team id, one row per stats team (ADR 0005)."
    columns:
      - name: team_xwalk_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: espn_team_id
        description: "ESPN team id (ESPN numbers each league from the same small range, so it is unique only within a league)"
        data_tests: [not_null]
      - name: espn_team_key
        description: "League and ESPN team id; each ESPN team is paired once"
        data_tests: [unique, not_null]
      - name: method
        description: "How the pair was found"
        data_tests:
          - accepted_values:
              values: [full_name, nickname, abbreviation]

  - name: game_xwalk
    description: "League stats API game id to ESPN event id, one row per matched game (ADR 0005)."
    columns:
      - name: game_xwalk_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: event_id
        description: "ESPN event id"
        data_tests: [not_null]
      - name: event_key
        description: "League and ESPN event id; each event matches one game"
        data_tests: [unique, not_null]
      - name: method
        description: "same_day or adjacent_day"
        data_tests:
          - accepted_values:
              values: [same_day, adjacent_day]

  - name: game_lines
    description: "The betting line per ESPN event: the home spread, the over/under and each side's implied points. A finished game's closing line from its summary wins over earlier scoreboards; an upcoming game takes the latest scoreboard."
    columns:
      - name: event_key
        description: "League and ESPN event id"
        data_tests: [unique, not_null]
      - name: event_date_et
        description: "The game's date in US Eastern time, to match the league schedule"
      - name: espn_home_team_id
        description: "ESPN team id of the home side"
      - name: espn_away_team_id
        description: "ESPN team id of the away side"
      - name: home_spread
        description: "The home team's point spread; negative when the home team is favoured"
      - name: over_under
        description: "The game's total points line"
      - name: home_moneyline
        description: "The home team's moneyline (American odds)"
      - name: away_moneyline
        description: "The away team's moneyline (American odds)"
      - name: line_type
        description: "closing (from the game summary) or latest (from the most recent scoreboard)"
        data_tests:
          - accepted_values:
              values: [closing, latest]
      - name: observed_date
        description: "Ingest date the line was taken from"
      - name: home_implied_points
        description: "Points the home team is implied to score: (over_under - home_spread) / 2"
      - name: away_implied_points
        description: "Points the away team is implied to score: (over_under + home_spread) / 2"

  - name: player_xwalk
    description: "League stats API player id to ESPN athlete id, one row per matched player: exact name, fuzzy name with birthdate, or an override (ADR 0005)."
    columns:
      - name: player_xwalk_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: espn_player_id
        description: "ESPN athlete id"
        data_tests: [not_null]
      - name: espn_player_key
        description: "League and ESPN athlete id; each athlete is paired once"
        data_tests: [unique, not_null]
      - name: method
        description: "override, exact or fuzzy"
        data_tests:
          - not_null
          - accepted_values:
              values: [override, exact, fuzzy]

  - name: player_xwalk_review
    description: "Players in matched games the crosswalk could not pair, from either side, with the closest candidate; the fix is a row in seeds/player_id_overrides.csv."
    columns:
      - name: review_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: side
        description: "stats or espn"
        data_tests:
          - accepted_values:
              values: [stats, espn]

  - name: player_game_reconciliation
    description: "Every player-game both sources report, side by side, with the agreement verdict (ADR 0005)."
    columns:
      - name: player_game_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: source_agreement
        description: "exact, minor or conflict"
        data_tests:
          - not_null
          - accepted_values:
              values: [exact, minor, conflict]

  - name: event_lineups
    description: "The five players on the floor for each side at every play-by-play action (substitution intervals; period starters inferred after the first period)."
    columns:
      - name: event_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: lineup_complete
        description: "Both sides have exactly five players"
        data_tests: [not_null]
