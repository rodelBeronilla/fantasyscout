version: 2

models:
  - name: team_game_box
    description: "One row per team per game from the league game log, typed."
    columns:
      - name: team_game_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: season
        description: "season"
        data_tests: [not_null]
      - name: game_id
        description: "game id"
        data_tests: [not_null]
      - name: team_id
        description: "team id"
        data_tests: [not_null]
      - name: game_date
        description: "game date"
        data_tests: [not_null]

  - name: games
    description: "One row per game with home and away sides and the final score."
    columns:
      - name: game_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: season
        description: "season"
        data_tests: [not_null]
      - name: game_id
        description: "game id"
        data_tests: [not_null]
      - name: game_date
        description: "game date"
        data_tests: [not_null]

  - name: schedule
    description: "One row per scheduled game with status, venue and tip-off time."
    columns:
      - name: game_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: season
        description: "season"
        data_tests: [not_null]
      - name: game_id
        description: "game id"
        data_tests: [not_null]

  - name: player_game_box
    description: "One row per player per game, traditional box score, typed."
    columns:
      - name: player_game_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: season
        description: "season"
        data_tests: [not_null]
      - name: game_id
        description: "game id"
        data_tests: [not_null]
      - name: player_id
        description: "player id"
        data_tests: [not_null]
      - name: team_id
        description: "team id"
        data_tests: [not_null]

  - name: player_game_advanced
    description: "One row per player per game, advanced box score, typed."
    columns:
      - name: player_game_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: season
        description: "season"
        data_tests: [not_null]
      - name: game_id
        description: "game id"
        data_tests: [not_null]
      - name: player_id
        description: "player id"
        data_tests: [not_null]

  - name: events
    description: "One row per play-by-play action, typed."
    columns:
      - name: event_key
        description: "Natural key, unique per row"
        data_tests: [unique, not_null]
      - name: league
        description: "league"
        data_tests: [not_null]
      - name: season
        description: "season"
        data_tests: [not_null]
      - name: game_id
        description: "game id"
        data_tests: [not_null]
      - name: action_number
        description: "action number"
        data_tests: [not_null]

  - name: shots
    description: "One row per field goal attempt with court coordinates."
    columns:
      - name: shot_key
        description: "Natural key, unique per row"
