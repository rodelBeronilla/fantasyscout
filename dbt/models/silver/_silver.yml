version: 2

models:
  - name: team_game_box
    description: "One row per team per game from the league game log, typed."
    columns:
      - name: league
        description: "wnba or nba"
        data_tests: [not_null]
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
        data_tests: [not_null]
      - name: game_id
        description: "League stats API game id"
        data_tests: [not_null]
      - name: team_id
        description: "League stats API team id"
        data_tests: [not_null]
      - name: team_game_key
        description: "Natural key: league, game id and team id; one row per team per game"
        data_tests: [unique, not_null]
      - name: season_id
        description: "The game log's season id: a season-type digit then the start year (22026 is the 2026 regular season)"
      - name: team_abbreviation
        description: "League tricode of the team"
      - name: team_name
        description: "Full team name as the game log writes it"
      - name: game_date
        description: "Date of the game, from the game log"
        data_tests: [not_null]
      - name: matchup
        description: "The game log's matchup text: 'LVA vs. SEA' for the home side, 'SEA @ LVA' for the away side"
      - name: is_home
        description: "True when the matchup reads 'vs.', false when it reads '@'; both sides read 'vs.' at a neutral site"
      - name: win_loss
        description: "W or L for the team"
      - name: minutes
        description: "Team minutes, the five-player total (200 for a regulation WNBA game, 240 in the NBA, more with overtime)"
      - name: field_goals_made
        description: "Field goals made by the team in the game"
      - name: field_goals_attempted
        description: "Field goals attempted by the team in the game"
      - name: three_pointers_made
        description: "Three-pointers made by the team in the game"
      - name: three_pointers_attempted
        description: "Three-pointers attempted by the team in the game"
      - name: free_throws_made
        description: "Free throws made by the team in the game"
      - name: free_throws_attempted
        description: "Free throws attempted by the team in the game"
      - name: rebounds_offensive
        description: "Offensive rebounds by the team in the game"
      - name: rebounds_defensive
        description: "Defensive rebounds by the team in the game"
      - name: rebounds_total
        description: "Total rebounds by the team in the game"
      - name: assists
        description: "Assists by the team in the game"
      - name: steals
        description: "Steals by the team in the game"
      - name: blocks
        description: "Blocked shots by the team in the game"
      - name: turnovers
        description: "Turnovers by the team in the game"
      - name: fouls_personal
        description: "Personal fouls by the team in the game"
      - name: points
        description: "Points scored by the team in the game"
      - name: plus_minus
        description: "The team's point margin in the game"
      - name: _ingest_date
        description: "Ingest date of the landing the row was taken from; the latest landing wins per team and game"
      - name: _source_file
        description: "Path of the landed payload the row was parsed from"

  - name: games
    description: "One row per game with home and away sides and the final score. At a neutral site both teams are listed as home by the source; the lower team id takes the home side and neutral_site is true."
    columns:
      - name: league
        description: "wnba or nba"
        data_tests: [not_null]
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
        data_tests: [not_null]
      - name: game_id
        description: "League stats API game id"
        data_tests: [not_null]
      - name: game_key
        description: "Natural key: league and game id; one row per played game"
        data_tests: [unique, not_null]
      - name: game_date
        description: "Date of the game, from the team game log"
        data_tests: [not_null]
      - name: home_team_id
        description: "League team id of the home side (the lower team id at a neutral site)"
      - name: home_team_abbreviation
        description: "League tricode of the home side"
      - name: away_team_id
        description: "League team id of the away side; null when the game log has only one side"
      - name: away_team_abbreviation
        description: "League tricode of the away side"
      - name: home_points
        description: "Points the home side scored"
      - name: away_points
        description: "Points the away side scored"
      - name: winner_team_id
        description: "Team id of the side that scored more; null when a side is missing"
      - name: neutral_site
        description: "True when the source lists both teams as the home side (showcase games abroad, cup finals)."
        data_tests: [not_null]
      - name: _ingest_date
        description: "The later ingest date of the two sides' game log rows"

  - name: schedule
    description: "One row per scheduled game with status, venue and tip-off time. game_type (from the game id) separates preseason, regular season, All-Star, playoff, play-in and tournament-final games."
    columns:
      - name: league
        description: "wnba or nba"
        data_tests: [not_null]
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
        data_tests: [not_null]
      - name: game_id
        description: "League stats API game id"
        data_tests: [not_null]
      - name: game_key
        description: "Natural key: league and game id; one row per scheduled game"
        data_tests: [unique, not_null]
      - name: season_year
        description: "Season label as the schedule writes it"
      - name: game_code
        description: "The league's game code: the date and the two tricodes, away then home (20260425/SEAGSV)"
      - name: game_type
        description: "preseason, regular, all_star, playoffs, play_in, tournament_final or other, from the third character of the game id."
        data_tests:
          - not_null
          - accepted_values:
              values: [preseason, regular, all_star, playoffs, play_in, tournament_final, other]
      - name: game_status
        description: "1 scheduled, 2 in progress, 3 final"
      - name: game_status_text
        description: "Status as the schedule writes it: the tip-off time, the live state or Final"
      - name: game_date_est
        description: "Game date in US Eastern time"
      - name: game_datetime_utc
        description: "Tip-off as the schedule gives it, ISO 8601 text in UTC"
      - name: week_number
        description: "The league's schedule week; 0 outside the weeks it numbers"
      - name: week_name
        description: "The league's name for the schedule week; blank when it has none"
      - name: if_necessary
        description: "True for a playoff game played only if the series needs it"
      - name: game_label
        description: "The league's label for the game, such as Preseason or a playoff round"
      - name: game_sub_label
        description: "The league's second label for the game, such as the game of a series; blank when none"
      - name: series_text
        description: "The playoff series state as the league writes it; blank outside the playoffs"
      - name: arena_name
        description: "Name of the arena the game is scheduled at"
      - name: arena_city
        description: "Arena city; fct_team_game_context places the venue by it"
      - name: arena_state
        description: "Arena state or province"
      - name: is_neutral
        description: "True when the schedule marks the game as played at a neutral site"
      - name: home_team_id
        description: "League team id of the home team; 0 for a knockout game whose teams are not decided"
      - name: home_team_tricode
        description: "League tricode of the home team"
      - name: home_score
        description: "Home team's score as the schedule gives it"
      - name: away_team_id
        description: "League team id of the away team; 0 for a knockout game whose teams are not decided"
      - name: away_team_tricode
        description: "League tricode of the away team"
      - name: away_score
        description: "Away team's score as the schedule gives it"
      - name: _ingest_date
        description: "Ingest date of the landing the row was taken from; the latest landing wins per game"
      - name: _source_file
        description: "Path of the landed payload the row was parsed from"

  - name: player_game_box
    description: "One row per player per game, traditional box score, typed."
    columns:
      - name: league
        description: "wnba or nba"
        data_tests: [not_null]
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
        data_tests: [not_null]
      - name: game_id
        description: "League stats API game id"
        data_tests: [not_null]
      - name: player_id
        description: "League stats API player id"
        data_tests: [not_null]
      - name: player_game_key
        description: "Natural key: league, game id and player id; one row per player per game"
        data_tests: [unique, not_null]
      - name: team_id
        description: "League team id of the player's team"
        data_tests: [not_null]
      - name: team_tricode
        description: "League tricode of the player's team"
      - name: side
        description: "home or away"
      - name: first_name
        description: "Given name as the box score writes it"
      - name: family_name
        description: "Family name as the box score writes it"
      - name: name_short
        description: "Initial and family name as the box score writes it (A. Wilson)"
      - name: position
        description: "Starting position (G, F or C); null for the bench, as the box score gives only starters one"
      - name: starter
        description: "True when the box score gives the player a position, which it does only for the five starters"
      - name: comment
        description: "The box score's note for a player who did not play (such as DNP - Coach's Decision); blank otherwise"
      - name: jersey_num
        description: "Jersey number"
      - name: minutes_text
        description: "Minutes as the box score writes them, mm:ss"
      - name: minutes
        description: "Minutes played as a decimal (28:30 is 28.5); null when the box score leaves them blank"
      - name: field_goals_made
        description: "Field goals made (league box score)"
      - name: field_goals_attempted
        description: "Field goals attempted (league box score)"
      - name: three_pointers_made
        description: "Three-pointers made (league box score)"
      - name: three_pointers_attempted
        description: "Three-pointers attempted (league box score)"
      - name: free_throws_made
        description: "Free throws made (league box score)"
      - name: free_throws_attempted
        description: "Free throws attempted (league box score)"
      - name: rebounds_offensive
        description: "Offensive rebounds (league box score)"
      - name: rebounds_defensive
        description: "Defensive rebounds (league box score)"
      - name: rebounds_total
        description: "Total rebounds (league box score)"
      - name: assists
        description: "Assists (league box score)"
      - name: steals
        description: "Steals (league box score)"
      - name: blocks
        description: "Blocked shots (league box score)"
      - name: turnovers
        description: "Turnovers (league box score)"
      - name: fouls_personal
        description: "Personal fouls (league box score)"
      - name: points
        description: "Points scored (league box score)"
      - name: plus_minus
        description: "Point margin while the player was on the floor"
      - name: _ingest_date
        description: "Ingest date of the landing the row was taken from; the latest landing wins per player and game"
      - name: _source_file
        description: "Path of the landed payload the row was parsed from"

  - name: player_game_advanced
    description: "One row per player per game, advanced box score, typed."
    columns:
      - name: league
        description: "wnba or nba"
        data_tests: [not_null]
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
        data_tests: [not_null]
      - name: game_id
        description: "League stats API game id"
        data_tests: [not_null]
      - name: player_id
        description: "League stats API player id"
        data_tests: [not_null]
      - name: team_id
        description: "League team id of the player's team"
      - name: side
        description: "home or away (from the matchup text for rows from the season game log)"
      - name: minutes
        description: "Minutes played as a decimal"
      - name: estimated_offensive_rating
        description: "Offensive rating from the league's estimated possessions"
      - name: offensive_rating
        description: "Team points per 100 possessions with the player on the floor"
      - name: estimated_defensive_rating
        description: "Defensive rating from the league's estimated possessions"
      - name: defensive_rating
        description: "Opponent points per 100 possessions with the player on the floor"
      - name: estimated_net_rating
        description: "Net rating from the league's estimated possessions"
      - name: net_rating
        description: "Offensive minus defensive rating, per 100 possessions"
      - name: assist_percentage
        description: "Share of teammates' field goals the player assisted while on the floor, decimal 0-1"
      - name: assist_to_turnover
        description: "Assists per turnover"
      - name: assist_ratio
        description: "Assists per 100 possessions the player used"
      - name: offensive_rebound_percentage
        description: "Share of available offensive rebounds the player took while on the floor, decimal 0-1"
      - name: defensive_rebound_percentage
        description: "Share of available defensive rebounds the player took while on the floor, decimal 0-1"
      - name: rebound_percentage
        description: "Share of all available rebounds the player took while on the floor, decimal 0-1"
      - name: turnover_ratio
        description: "Turnovers per 100 possessions the player used; null for rows from the season game log, which lacks it"
      - name: effective_field_goal_percentage
        description: "Effective field goal percentage, (FGM + 0.5 x 3PM) / FGA, decimal 0-1"
      - name: true_shooting_percentage
        description: "True shooting percentage, PTS / (2 x (FGA + 0.44 x FTA)), decimal 0-1"
      - name: usage_percentage
        description: "Share of team possessions the player used while on the floor, decimal 0-1"
      - name: estimated_usage_percentage
        description: "Usage percentage from the league's estimated possessions, decimal 0-1"
      - name: estimated_pace
        description: "Pace from the league's estimated possessions"
      - name: pace
        description: "Possessions per regulation game while the player was on the floor, as the league computes it"
      - name: pace_per40
        description: "Possessions per 40 minutes while the player was on the floor"
      - name: possessions
        description: "Possessions the player was on the floor for"
      - name: pie
        description: "Player Impact Estimate: the league's share of the game's box-score production credited to the player, decimal"
      - name: _ingest_date
        description: "Ingest date of the landing the row was taken from; the latest landing wins across both sources"
      - name: _source_file
        description: "Path of the landed payload the row was parsed from"
      - name: player_game_key
        description: "Natural key: league, game id and player id; one row per player per game"
        data_tests: [unique, not_null]

  - name: events
    description: "One row per play-by-play action, typed."
    columns:
      - name: league
        description: "wnba or nba"
        data_tests: [not_null]
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
        data_tests: [not_null]
      - name: game_id
        description: "League stats API game id"
        data_tests: [not_null]
      - name: action_number
        description: "The feed's action number, unique within a game; not always in clock order"
        data_tests: [not_null]
      - name: event_key
        description: "Natural key: league, game id and action number; one row per play-by-play action"
        data_tests: [unique, not_null]
      - name: action_id
        description: "The feed's running action id"
      - name: period
        description: "Period number; 5 and above are overtimes"
      - name: clock
        description: "Time left in the period as the feed writes it, an ISO 8601 duration (PT09M46.00S)"
      - name: team_id
        description: "League team id the action is credited to; 0 for game actions such as a period start"
      - name: team_tricode
        description: "League tricode of the team the action is credited to"
      - name: player_id
        description: "League player id the action is credited to (the player leaving, on a substitution); 0 when none"
      - name: player_name
        description: "Family name of the player as the feed writes it"
      - name: player_name_short
        description: "Initial and family name of the player (A. Wilson)"
      - name: action_type
        description: "The feed's action type, such as Made Shot, Missed Shot, Rebound, Turnover or Substitution"
      - name: sub_type
        description: "The feed's sub-type, such as Jump Shot or Layup"
      - name: description
        description: "The action as the feed writes it (SUB: Key FOR Fagbenle)"
      - name: location
        description: "h for a home-team action, v for the visitors; blank for game actions"
      - name: is_field_goal
        description: "True for a field goal attempt"
      - name: shot_result
        description: "Made or Missed for a shot; blank otherwise"
      - name: shot_value
        description: "Point value of the shot attempted (2 or 3); 0 for other actions"
      - name: shot_distance
        description: "Shot distance in feet"
      - name: x_legacy
        description: "Shot x coordinate, tenths of a foot from the basket (the shot chart's system)"
      - name: y_legacy
        description: "Shot y coordinate, tenths of a foot from the basket along the court"
      - name: score_home
        description: "Home score after the action; null on actions where the feed does not repeat it"
      - name: score_away
        description: "Away score after the action; null on actions where the feed does not repeat it"
      - name: points_total
        description: "The feed's pointsTotal field: the player's points in the game after a scoring action, else 0"
      - name: _ingest_date
        description: "Ingest date of the landing the row was taken from; the latest landing wins per game and action"
      - name: _source_file
        description: "Path of the landed payload the row was parsed from"

  - name: shots
    description: "One row per field goal attempt with court coordinates."
    columns:
      - name: league
        description: "wnba or nba"
        data_tests: [not_null]
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
        data_tests: [not_null]
      - name: game_id
        description: "League stats API game id"
        data_tests: [not_null]
      - name: game_event_id
        description: "The shot's event id in the game, the play-by-play action number"
        data_tests: [not_null]
      - name: shot_key
        description: "Natural key: league, game id and event id; one row per field goal attempt"
        data_tests: [unique, not_null]
      - name: player_id
        description: "League player id of the shooter"
        data_tests: [not_null]
      - name: player_name
        description: "Shooter's full name"
      - name: team_id
        description: "League team id of the shooter's team"
      - name: team_name
        description: "Full name of the shooter's team"
      - name: period
        description: "Period number; 5 and above are overtimes"
      - name: minutes_remaining
        description: "Whole minutes left in the period"
      - name: seconds_remaining
        description: "Seconds left in the period beyond the whole minutes"
      - name: event_type
        description: "Made Shot or Missed Shot"
      - name: action_type
        description: "Shot description, such as Jump Shot or Driving Layup Shot"
      - name: shot_type
        description: "2PT Field Goal or 3PT Field Goal"
      - name: shot_zone_basic
        description: "The league's court zone, such as Restricted Area, Mid-Range or Above the Break 3"
      - name: shot_zone_area
        description: "Side of the court, such as Center(C) or Left Side Center(LC)"
      - name: shot_zone_range
        description: "Distance band, such as Less Than 8 ft. or 24+ ft."
      - name: shot_distance
        description: "Shot distance in whole feet"
      - name: loc_x
        description: "Court x coordinate, tenths of a foot from the basket (negative to the left)"
      - name: loc_y
        description: "Court y coordinate, tenths of a foot from the basket toward half court"
      - name: shot_attempted
        description: "True for an attempt (always true in the shot chart)"
      - name: shot_made
        description: "True when the shot went in"
      - name: game_date
        description: "Date of the game"
      - name: home_team_tricode
        description: "League tricode of the home team"
      - name: away_team_tricode
        description: "League tricode of the away team"
      - name: _ingest_date
        description: "Ingest date of the landing the row was taken from; the latest landing wins per shot"
      - name: _source_file
        description: "Path of the landed payload the row was parsed from"

  - name: players
    description: "One row per player per league from the player directory."
    columns:
      - name: league
        description: "wnba or nba"
        data_tests: [not_null]
      - name: player_id
        description: "League stats API player id"
        data_tests: [not_null]
      - name: player_key
        description: "Natural key: league and player id; one row per player per league"
        data_tests: [unique, not_null]
      - name: full_name
        description: "Name as First Last, from the player directory"
        data_tests: [not_null]
      - name: last_comma_first
        description: "Name as Last, First"
      - name: on_roster
        description: "True when the directory lists the player on a current roster"
      - name: from_year
        description: "First season year the player appeared in the league"
      - name: to_year
        description: "Latest season year the player appeared in the league"
      - name: player_slug
        description: "The league's URL slug for the player"
      - name: team_id
        description: "League team id the directory lists for the player; 0 for none"
      - name: team_city
        description: "City of that team"
      - name: team_name
        description: "Nickname of that team"
      - name: team_abbreviation
        description: "League tricode of that team"
      - name: has_played
        description: "True when the directory flags that the player has played a game"
      - name: _ingest_date
        description: "Ingest date of the landing the row was taken from; the latest landing wins per player"
      - name: _source_file
        description: "Path of the landed payload the row was parsed from"

  - name: teams
    description: "One row per team per season, enriched from the teams seed."
    columns:
      - name: league
        description: "wnba or nba"
        data_tests: [not_null]
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
        data_tests: [not_null]
      - name: team_id
        description: "League stats API team id"
        data_tests: [not_null]
      - name: team_season_key
        description: "Natural key: league, season and team id; one row per team per season"
        data_tests: [unique, not_null]
      - name: abbreviation
        description: "League tricode of the team in the game log"
        data_tests: [not_null]
      - name: team_name
        description: "Full team name as the game log writes it"
      - name: name
        description: "Nickname from the teams seed; null when the seed lacks the tricode"
      - name: city
        description: "City or market from the teams seed"
      - name: conference
        description: "Eastern or Western, from the teams seed"
      - name: note
        description: "Free-text note from the teams seed, such as expansion team (2026)"
      - name: _ingest_date
        description: "Latest ingest date of the team's game log rows that season"

  - name: rosters
    description: "One row per rostered player per team per season."
    columns:
      - name: league
        description: "wnba or nba"
        data_tests: [not_null]
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
        data_tests: [not_null]
      - name: team_id
        description: "League stats API team id"
        data_tests: [not_null]
      - name: player_id
        description: "League stats API player id"
        data_tests: [not_null]
      - name: roster_key
        description: "Natural key: league, season, team id and player id; one row per player per team roster"
        data_tests: [unique, not_null]
      - name: player_name
        description: "Player name as the roster writes it"
      - name: nickname
        description: "The roster's nickname for the player (usually the given name)"
      - name: player_slug
        description: "The league's URL slug for the player"
      - name: jersey
        description: "Jersey number"
      - name: position
        description: "Listed position (G, F, C, G-F and so on); null when blank"
      - name: height
        description: "Height as feet-inches text (6-1)"
      - name: weight_lbs
        description: "Weight in pounds"
      - name: birth_date
        description: "Birth date as the roster writes it, text such as MAR 16, 2000"
      - name: age
        description: "Age in years as the roster gives it"
      - name: experience
        description: "Seasons of league experience as text; R for a rookie"
      - name: school
        description: "College or last school before the league"
      - name: how_acquired
        description: "How the team acquired the player, as the roster writes it (#11 Pick in 2022 Draft)"
      - name: _ingest_date
        description: "Ingest date of the landing the row was taken from; the latest landing wins per team roster entry"
      - name: _source_file
        description: "Path of the landed payload the row was parsed from"

  - name: espn_events
    description: "One row per ESPN event with competitors unpacked."
    columns:
      - name: league
        description: "wnba or nba"
        data_tests: [not_null]
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
      - name: event_id
        description: "ESPN event id"
        data_tests: [not_null]
      - name: event_key
        description: "Natural key: league and ESPN event id; one row per ESPN event"
        data_tests: [unique, not_null]
      - name: event_date
        description: "The UTC date of tip-off (an evening game in the US can fall on the next day)"
        data_tests: [not_null]
      - name: event_datetime_utc
        description: "Tip-off as ESPN gives it, ISO 8601 text in UTC"
      - name: name
        description: "Long event name (Away Team at Home Team)"
      - name: short_name
        description: "Short event name (AWAY @ HOME)"
      - name: season_year
