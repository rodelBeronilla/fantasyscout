        description: "Matched games the pair appeared in together on the same team; null for an override"
      - name: first_game_date
        description: "First matched game the pair was seen in; null for an override"
      - name: last_game_date
        description: "Latest matched game the pair was seen in; null for an override"
      - name: note
        description: "The override's reason; for fuzzy pairs birthdate confirmed or name only; null for exact"

  - name: player_xwalk_review
    description: "Players in matched games the crosswalk could not pair, from either side, with the closest candidate; the fix is a row in seeds/player_id_overrides.csv."
    columns:
      - name: league
        description: "wnba or nba"
      - name: side
        description: "stats (a league player with no ESPN pair) or espn (an ESPN athlete with no league pair)"
        data_tests:
          - accepted_values:
              values: [stats, espn]
      - name: player_id
        description: "The unpaired player's id on that side: league player id or ESPN athlete id"
      - name: review_key
        description: "Natural key: league, side and player id; one row per unpaired player"
        data_tests: [unique, not_null]
      - name: player_name
        description: "The unpaired player's name on that side"
      - name: games
        description: "Matched games the unpaired player appears in"
      - name: first_game_date
        description: "First matched game the player appears in"
      - name: last_game_date
        description: "Latest matched game the player appears in"
      - name: best_candidate_id
        description: "Id of the closest unpaired player on the other side, same team and game; null when none"
      - name: best_candidate_name
        description: "Name of that candidate"
      - name: best_similarity
        description: "Jaro-Winkler name similarity of that candidate, 0-1"

  - name: player_game_reconciliation
    description: "Every player-game both sources report, side by side, with the agreement verdict (ADR 0005)."
    columns:
      - name: league
        description: "wnba or nba"
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
      - name: game_id
        description: "League stats API game id"
      - name: event_id
        description: "ESPN event id of the matched game (silver.game_xwalk)"
      - name: stats_player_id
        description: "League stats API player id"
      - name: espn_player_id
        description: "ESPN athlete id of the crosswalked player"
      - name: player_game_key
        description: "Natural key: league, game id and stats player id; one row per player-game both sources report"
        data_tests: [unique, not_null]
      - name: stats_minutes
        description: "Minutes in the league box score, decimal"
      - name: espn_minutes
        description: "Minutes in ESPN's box score, whole minutes"
      - name: stats_points
        description: "Points scored in the league box score"
      - name: espn_points
        description: "Points scored in ESPN's box score"
      - name: stats_rebounds_total
        description: "Total rebounds in the league box score"
      - name: espn_rebounds_total
        description: "Total rebounds in ESPN's box score"
      - name: stats_assists
        description: "Assists in the league box score"
      - name: espn_assists
        description: "Assists in ESPN's box score"
      - name: stats_steals
        description: "Steals in the league box score"
      - name: espn_steals
        description: "Steals in ESPN's box score"
      - name: stats_blocks
        description: "Blocked shots in the league box score"
      - name: espn_blocks
        description: "Blocked shots in ESPN's box score"
      - name: stats_turnovers
        description: "Turnovers in the league box score"
      - name: espn_turnovers
        description: "Turnovers in ESPN's box score"
      - name: stats_field_goals_made
        description: "Field goals made in the league box score"
      - name: espn_field_goals_made
        description: "Field goals made in ESPN's box score"
      - name: stats_field_goals_attempted
        description: "Field goals attempted in the league box score"
      - name: espn_field_goals_attempted
        description: "Field goals attempted in ESPN's box score"
      - name: stats_three_pointers_made
        description: "Three-pointers made in the league box score"
      - name: espn_three_pointers_made
        description: "Three-pointers made in ESPN's box score"
      - name: stats_three_pointers_attempted
        description: "Three-pointers attempted in the league box score"
      - name: espn_three_pointers_attempted
        description: "Three-pointers attempted in ESPN's box score"
      - name: stats_free_throws_made
        description: "Free throws made in the league box score"
      - name: espn_free_throws_made
        description: "Free throws made in ESPN's box score"
      - name: stats_free_throws_attempted
        description: "Free throws attempted in the league box score"
      - name: espn_free_throws_attempted
        description: "Free throws attempted in ESPN's box score"
      - name: minutes_gap
        description: "Absolute minutes difference; 0 when neither has minutes, 999 when only one does"
      - name: both_did_not_play
        description: "True when the league has no minutes or zero and ESPN has no minutes, points or attempts"
      - name: counts_agree
        description: "True when all twelve compared counts are equal (nulls equal to nulls)"
      - name: source_agreement
        description: "exact (counts agree, minutes within half a minute, or neither has the player on the floor), minor (counts agree, minutes within one) or conflict"
        data_tests:
          - not_null
          - accepted_values:
              values: [exact, minor, conflict]
      - name: _ingest_date
        description: "Ingest date of the league box score row"

  - name: event_lineups
    description: "The five players on the floor for each side at every play-by-play action (substitution intervals; period starters inferred after the first period)."
    columns:
      - name: league
        description: "wnba or nba"
      - name: season
        description: "Season label (2026 in the WNBA, 2025-26 in the NBA)"
      - name: game_id
        description: "League stats API game id"
      - name: event_key
        description: "Natural key: league, game id and action number (silver.events); one row per action with a lineup"
        data_tests: [unique, not_null]
      - name: lineup_home
        description: "League player ids on the floor for the home side, sorted and comma-separated"
      - name: lineup_away
        description: "League player ids on the floor for the away side, sorted and comma-separated"
      - name: lineup_complete
        description: "True when both sides have exactly five players; false where a player was not seen in a period"
        data_tests: [not_null]
