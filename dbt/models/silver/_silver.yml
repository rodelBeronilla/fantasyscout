  - name: player_xwalk
    description: "League stats API player id to ESPN athlete id, one row per matched player: exact name, fuzzy name with birthdate, or an override (ADR 0005)."
    columns:
      - name: league
        description: "wnba or nba"
      - name: stats_player_id
        description: "League stats API player id"
      - name: espn_player_id
        description: "ESPN athlete id"
        data_tests: [not_null]
      - name: player_xwalk_key
        description: "Natural key: league and stats player id; one row per matched player"
        data_tests: [unique, not_null]
      - name: espn_player_key
        description: "League and ESPN athlete id; each athlete is paired once"
        data_tests: [unique, not_null]
      - name: method
        description: "override (seeds/player_id_overrides.csv), exact (same normalised name) or fuzzy (name similarity)"
        data_tests:
          - not_null
          - accepted_values:
              values: [override, exact, fuzzy]
      - name: similarity
        description: "Jaro-Winkler name similarity, 0-1: 1.0 for exact, the best score for fuzzy, null for an override"
