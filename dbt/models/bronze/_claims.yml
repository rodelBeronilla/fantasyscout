version: 2

models:
  - name: ai_claims
    description: "The local model's claims from the news (ai/claims.py): one row per claim per landed file, a file being one ESPN headline or injury note with the text the model read. Values as text."
    columns:
      - name: _source_file
        description: "Path of the landed file this row was parsed from"
      - name: league
        description: "wnba or nba, from the landing path"
      - name: season
        description: "Season label, from the landing path"
      - name: _ingest_date
        description: "Ingest date of the landed file: the Eastern day the claims were extracted"
      - name: request_key
        description: "The source item the file holds: its source and source id"
      - name: source_text
        description: "The item's text as the model read it: the headline, or the injury note's short and long comments"
      - name: model
        description: "The local model that read the item"
      - name: prompt_version
        description: "Hash of the prompt the model was given (ai/prompts/claims.md)"
      - name: extracted_at
        description: "When the model read the item (UTC)"
      - name: source
        description: "espn_news, espn_injury_note or rss:<feed_id>"
      - name: source_id
        description: "The ESPN article id, the injury listing id and a hash of the note's text, or the feed item's id"
      - name: player_id
        description: "League player id the claim is about"
      - name: kind
        description: "What the claim says: role_up, role_down, minutes_up, minutes_down, injury_out, injury_return, injury_worse, injury_better, trade_rumor or other"
      - name: direction
        description: "1 good for the player's fantasy value, -1 bad, 0 neither"
      - name: model_confidence
        description: "The model's own confidence, 0-1"
      - name: confidence_cap
        description: "The most confidence the extractor's rules allow the claim"
      - name: confidence
        description: "The confidence kept: the lower of the two"
      - name: cap_reasons
        description: "Why the cap is what it is, as a JSON array of text"
      - name: quote
        description: "The span of the source text the claim rests on, as the source writes it"
      - name: quote_start
        description: "Where the quote starts in the source text (0-based character offset)"
      - name: published_at
        description: "When the source said it (UTC, ISO 8601)"
      - name: published_date
        description: "The day the source said it"
