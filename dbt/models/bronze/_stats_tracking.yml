version: 2

models:
  - name: stats_leaguedashptstats_passing
    description: "One row per NBA player per game date, player tracking (passes, potential and secondary assists); the request key names the measure and the date (passing-YYYY-MM-DD)."
    columns:
      - name: _source_file
        description: "Path of the landed payload this row was parsed from"
      - name: league
        description: "wnba or nba, from the landing path"
      - name: season
        description: "Season label from the landing path (2026 or 2025-26)"
      - name: _ingest_date
        description: "Ingest date from the landing path"
      - name: request_key
        description: "Landing key of the payload (game id, team id, date or season)"
      - name: _payload_hash
        description: "SHA-256 of the raw payload, matching the sidecar"
      - name: player_id
        description: "Source column `PLAYER_ID`"
