name: fantasyscout
version: "0.1.0"
config-version: 2
profile: fantasyscout

# No usage tracking from the CLI, and none in the generated docs site.
flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets: ["target", "dbt_packages"]

vars:
  # Where landed JSON lives for the DuckDB target. The sample is built from the recorded
  # fixtures (sample/build_sample.py); point it at a real landing directory for local work.
  # The Databricks target always reads the Unity Catalog volume (see macros/landing.sql).
  landing_root: "{{ env_var('FS_LANDING_ROOT', 'sample') }}"

  # The fantasy league the board values players for (mart_player_projection, mart_board):
  # teams x roster spots is the pool of rostered players; replacement level is the next
  # `teams` players. prior_games is how many games of a replacement-level player every
  # projection starts from, so a short sample moves a projection only part of the way.
  # fantasy_recency weights per-minute production in the current season and the two before
  # it; minutes_recency weights minutes per game (the WNBA's roles move more between
  # seasons, so its current season counts for much more); durability_games regresses the
  # share of team games played toward typical_share. All were chosen by backtest over
  # 2021-2026 (ADR 0003), to put the most of each predicted top tier and rostered pool into
  # the actual ones, before a season and a tenth, a quarter and half way in.
  fantasy:
    nba: {teams: 12, roster_spots: 13, prior_games: 3, minutes_recency: [1.0, 0.25, 0.08], durability_games: 10}
    wnba: {teams: 10, roster_spots: 10, prior_games: 5, minutes_recency: [1.0, 0.06, 0.02], durability_games: 60}
  fantasy_recency: [1.0, 0.25, 0.08]
  # Regular-season games per team where the schedule cannot say: the NBA lists two December games
  # per team as placeholders (team id 0) until the Cup's group stage ends, so its scheduled count
  # is 80 until then. While a league is listed here its games remaining are this length minus the
  # games played; a league not listed (the WNBA) counts its scheduled games (mart_board, #386).
  regular_season_games:
    nba: 82
  # The data-quality thresholds the warn checks and the data-quality notebook share: [good, ok];
  # below ok is a failure. A warn check warns past the good bound: warn_crosswalk_coverage reads
  # played_match_rate, warn_reconciliation_conflicts conflict_rate, warn_injury_links listing_links,
  # warn_lineup_completeness lineup_complete. team_turnovers_max is a count, not a pair: the most
  # team-only turnovers (no player charged) a team-game may have, read by warn_team_turnovers and
  # the notebook's turnovers_ok (ADR 0003). The notebook reads all.
  quality_thresholds:
    played_match_rate: [0.99, 0.95]
    conflict_rate: [0.005, 0.02]
    box_closure: [1.0, 0.995]
    turnovers_ok: [0.99, 0.95]
    shot_chart_coverage: [0.98, 0.90]
    shot_match: [0.99, 0.95]
    listing_links: [0.95, 0.90]
    lineup_complete: [0.9, 0.8]
    team_turnovers_max: 8
    status_known: [0.98, 0.95]
    landing_age_hours: [36, 168]
  # A league's own injury-listing history calibrates the board's availability multiplier once it
  # has this many listings for a status and reason; until then the NBA's history stands in
  # (fct_status_calibration).
  calibration_min_listings: 300
  # Box-score absence spells (fct_absence_spell, #798): a regular is a player who played his team's
  # previous game and averaged at least min_minutes over his last recent_games; one who then misses
  # a game starts a spell. A regular rarely sits out by the coach's choice, which the box score
  # cannot tell from an injury.
  absence_spells: {min_minutes: 20, recent_games: 10}
  # Recovery timelines (fct_recovery_curve, mart_recovery_timeline, #800): a body part, or a body
  # part and kind, gets its own Kaplan-Meier curve once it has this many injury spells.
  recovery_min_spells: 30
  fantasy_durability: {typical_share: 0.8}
  # A past season spent mostly on another team: the share of its minutes weight it keeps.
  fantasy_team_change: 0.25
  # In season, projected minutes blend the season-weighted figure with the player's last five
  # games on their current team at this weight: a role change shows up at once. Backtested on
  # next-ten-game minutes (ADR 0003): NBA error 3.98 to 3.44 minutes, WNBA 3.92 to 3.30, and a
  # quarter less for players whose role just moved.
  fantasy_recent_minutes: 0.5
  # In season, a player with 5+ games who is still out, or just back, after three or more straight
  # team games missed plays fewer minutes at first: projected minutes are cut by per_game_missed
  # for each game of the absence (at most max_cut) while the player is out, fading to none once
  # they have played games_back games. Backtested on next-five and next-ten-game minutes (ADR
  # 0003): for the players cut, error 4.57 to 4.13 and 4.24 to 3.94 minutes out of sample in the
  # NBA, 4.16 to 3.94 and 4.06 to 4.04 in the WNBA; nobody else moves.
  fantasy_return_ramp: {min_games_missed: 3, per_game_missed: 0.01, max_cut: 0.5, games_back: 2}
  # A team with nothing left to play for in its last stretch (fct_team_stakes.rest_risk) rests its
  # regulars: notebook 03 rebuilt the stakes point in time and found NBA regulars (28+ minutes)
  # on such teams sat out 50.7% of those games against 21.7% on teams still racing, +29 points
  # (22 to 36; 58 team-seasons; ADR 0010, #494). The board charges that share of the games left
  # to a regular there. The WNBA's +2.5 points (-2.9 to +7.1) did not clear the bar, so it is 0.
  fantasy_rest_risk:
    nba: {extra_sit_out: 0.29, min_minutes: 28}
    wnba: {extra_sit_out: 0.0, min_minutes: 28}
  # Matchups (mart_schedule_upcoming): value per game per standard deviation of the opponent's
  # defensive rating and of the expected pace, from replaying past seasons (ADR 0003); team
  # ratings blend this season to date with last season, last season counting as prior_games.
  fantasy_matchup:
    nba: {defense: 0.21, pace: 0.08}
    wnba: {defense: 0.14, pace: 0.06}
    prior_games: 10

# A point-in-time build (#752) must be on DuckDB, from scratch, with as_of: checked once per run.
on-run-start:
  - "{{ guard_point_in_time() }}"

models:
  fantasyscout:
    +persist_docs:
      relation: true
      columns: true
    bronze:
      +schema: bronze
      +materialized: incremental
      +incremental_strategy: append
      +on_schema_change: append_new_columns
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
    ops:
      +schema: ops
      +materialized: table

tests:
  fantasyscout:
    +store_failures: false

seeds:
  fantasyscout:
    +schema: ops
    player_id_overrides:
      +column_types:
        league: string
        stats_player_id: string
        espn_player_id: string
        reason: string
