version: 2

seeds:
  - name: team_reference
    description: >
      Team reference data for both leagues as of the 2026 WNBA and 2026-27 NBA seasons, including
      the WNBA expansion teams. Stats API ids are filled from landed data; blank until a team's
      first game is landed. Abbreviations are the league stats API tricodes.
    config:
      column_types:
        stats_team_id: string
    columns:
      - name: league
        description: wnba or nba
        data_tests: [not_null]
      - name: abbreviation
        description: The league stats API tricode for the team
        data_tests: [not_null]
      - name: stats_team_id
        description: Team id in the league stats API
      - name: name
        description: Franchise name without the city
      - name: city
        description: Market name
      - name: conference
        description: Eastern or Western
      - name: note
        description: Free text, for example "expansion team (2026)"

  - name: category_config
    description: The fantasy categories per league and how each one is computed from silver columns.
    config:
      column_types:
        is_percentage: boolean
        sort_order: integer
    columns:
      - name: league
        description: wnba or nba
      - name: category
        description: Short label shown on the board (PTS, REB, ...)
        data_tests: [not_null]
      - name: column_name
        description: Column in the player-game fact that holds the category value
      - name: direction
        description: positive when more is better, negative for turnovers
      - name: is_percentage
        description: true for volume-weighted percentages computed as numerator over denominator
      - name: numerator_column
        description: Makes column for percentage categories
      - name: denominator_column
        description: Attempts column for percentage categories
      - name: sort_order
        description: Display order on the board

  - name: player_id_overrides
    description: Manual links between stats API and ESPN player ids when name matching fails (phase 4 reconciliation).
    config:
      column_types:
        league: string
        stats_player_id: string
        espn_player_id: string
        reason: string
    columns:
      - name: league
        description: wnba or nba
      - name: stats_player_id
        description: Player id in the league stats API
      - name: espn_player_id
        description: Player id in ESPN's API
      - name: reason
        description: Why the automatic match failed

  - name: venues
    description: >
      Where games are played, by the arena city the league schedule gives: latitude and longitude
      (the arena, or the city for occasional venues), elevation in feet, and the standard UTC
      offset (daylight saving ignored). Covers every home city of both leagues plus the neutral
      and occasional sites in the 2025 to 2027 schedules; warn_venue_cities lists any city missing.
    config:
      column_types:
        latitude: double
        longitude: double
        elevation_ft: integer
        utc_offset: integer
    columns:
      - name: city
        description: Arena city as the league schedule writes it
        data_tests: [unique, not_null]
      - name: latitude
        description: Degrees north
      - name: longitude
        description: Degrees east (negative west)
      - name: elevation_ft
        description: Elevation of the venue in feet
      - name: utc_offset
        description: Standard-time offset from UTC in hours

