[project]
name = "fantasyscout"
version = "0.0.1"
description = "WNBA-first basketball data platform with a fantasy front end."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
]

[project.scripts]
fs-ingest = "ingest.cli:main"

[dependency-groups]
dbt = [
    "dbt-core>=1.10",
    "dbt-databricks>=1.10",
    "dbt-duckdb>=1.9",
]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "export", "ops"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "worker", "dbt", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ingest", "export", "ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
