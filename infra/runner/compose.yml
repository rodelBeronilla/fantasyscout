# Self-hosted GitHub Actions runner for the jobs that need a residential address (ADR 0002).
#
# First start (registers the runner; the token is short-lived and never stored in a file):
#   RUNNER_TOKEN=$(gh api -X POST repos/rodelBeronilla/fantasyscout/actions/runners/registration-token --jq .token) \
#     docker compose -f infra/runner/compose.yml up -d
# Later starts need no token: the registration lives in the runner-state volume.
#   docker compose -f infra/runner/compose.yml up -d
# Remove (also deregisters):
#   docker compose -f infra/runner/compose.yml run --rm runner ./config.sh remove --token "$(gh api -X POST repos/rodelBeronilla/fantasyscout/actions/runners/remove-token --jq .token)"
#   docker compose -f infra/runner/compose.yml down -v

services:
  runner:
    image: ghcr.io/actions/actions-runner:latest
    container_name: fantasyscout-runner
    restart: unless-stopped
    environment:
      RUNNER_URL: https://github.com/rodelBeronilla/fantasyscout
      RUNNER_NAME: home-server
      RUNNER_LABELS: home
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    volumes:
      - runner-state:/home/runner
    command:
      - bash
      - -c
      - |
        set -e
        cd /home/runner
        if [ ! -f .runner ]; then
          [ -n "$$RUNNER_TOKEN" ] || { echo "RUNNER_TOKEN is required for the first start"; exit 1; }
          ./config.sh --unattended --replace \
            --url "$$RUNNER_URL" --token "$$RUNNER_TOKEN" \
            --name "$$RUNNER_NAME" --labels "$$RUNNER_LABELS" \
            --work _work
        fi
        exec ./run.sh
    # The ingest jobs are light: one HTTP request at a time plus small file uploads.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

volumes:
  runner-state:
