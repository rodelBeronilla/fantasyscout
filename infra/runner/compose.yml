# Self-hosted GitHub Actions runners for the jobs that need a residential address (ADR 0002).
#
# Two runners so the two leagues (two different stats hosts) can land at the same time; each
# job still makes one request at a time to its host, and concurrency groups in the workflows
# keep two jobs from ever sharing a host.
#
# First start (registers both; the token is short-lived and never stored in a file):
#   RUNNER_TOKEN=$(gh api -X POST repos/rodelBeronilla/fantasyscout/actions/runners/registration-token --jq .token) \
#     docker compose -f infra/runner/compose.yml up -d
# Later starts need no token: the registrations live in the runner-state volumes.
#   docker compose -f infra/runner/compose.yml up -d
# Remove (also deregisters):
#   for s in runner-1 runner-2; do docker compose -f infra/runner/compose.yml run --rm $s ./config.sh remove --token "$(gh api -X POST repos/rodelBeronilla/fantasyscout/actions/runners/remove-token --jq .token)"; done
#   docker compose -f infra/runner/compose.yml down -v

x-runner: &runner
  # Pinned by digest: the runner image is the one unpinned update channel on the machine with
  # residential egress. Bump by hand (infra/runner/README.md, "Update the runner image").
  image: ghcr.io/actions/actions-runner:2.338.2@sha256:759a1d94a15b05941aba5196974ff43fe15b4cbba29b694b35cbc32a1166b232
  restart: unless-stopped
  command:
    - bash
    - -c
    - |
      set -e
      cd /home/runner
      if [ ! -f .runner ]; then
        [ -n "$$RUNNER_TOKEN" ] || { echo "RUNNER_TOKEN is required for the first start"; exit 1; }
        ./config.sh --unattended --replace --disableupdate \
          --url "$$RUNNER_URL" --token "$$RUNNER_TOKEN" \
          --name "$$RUNNER_NAME" --labels "$$RUNNER_LABELS" \
          --work _work
      fi
      exec ./run.sh
  # Healthy while the runner process is listening for jobs; the host's check.sh reads this and
  # GitHub's view of the runner, and opens an incident when either says otherwise.
  healthcheck:
    test: ["CMD-SHELL", "pgrep -f Runner.Listener >/dev/null || exit 1"]
    interval: 60s
    timeout: 10s
    retries: 3
    start_period: 60s
  # The ingest jobs are light: one HTTP request at a time plus small file uploads.
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 1g
  # No privilege escalation inside the container (#427). --disableupdate above keeps the runner
  # from updating itself.
  security_opt:
    - no-new-privileges:true

services:
  runner-1:
    <<: *runner
    container_name: fantasyscout-runner
    environment:
      RUNNER_URL: https://github.com/rodelBeronilla/fantasyscout
      RUNNER_NAME: home-server
      RUNNER_LABELS: home
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      # The only way out: the egress proxy (squid.conf). The runner and the job steps read these.
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      # the local language model (the ai service) is reached directly, not through the proxy
      NO_PROXY: localhost,127.0.0.1,ai
      no_proxy: localhost,127.0.0.1,ai
      FS_AI_URL: http://ai:11434
    volumes:
      - runner-state:/home/runner
    networks:
      - runner-1-net
    depends_on:
      - egress-proxy

  runner-2:
    <<: *runner
    container_name: fantasyscout-runner-2
    environment:
      RUNNER_URL: https://github.com/rodelBeronilla/fantasyscout
      RUNNER_NAME: home-server-2
      RUNNER_LABELS: home
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      # The only way out: the egress proxy (squid.conf). The runner and the job steps read these.
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      # the local language model (the ai service) is reached directly, not through the proxy
      NO_PROXY: localhost,127.0.0.1,ai
      no_proxy: localhost,127.0.0.1,ai
      FS_AI_URL: http://ai:11434
    volumes:
      - runner-state-2:/home/runner
    networks:
      - runner-2-net
    depends_on:
      - egress-proxy

  # The runners' only route out: each runner is alone with the proxy on an internal network (no
  # gateway, so not the host, the LAN or the other runner), and the proxy forwards to the
  # allow-listed hosts in squid.conf alone, never to a private address.
  egress-proxy:
    # Pinned by digest like the runner image; Dependabot's docker-compose entry proposes updates.
    image: ubuntu/squid:latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    container_name: fantasyscout-egress-proxy
    restart: unless-stopped
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "squid -k check || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      - egress
      - runner-1-net
      - runner-2-net

  # The local language model (phase 7, ADR 0017): Ollama on the GPU, on the runners' internal
  # networks alone, so a job reaches it at http://ai:11434 and it reaches nothing outside: no
  # gateway, no proxy. The model is pulled once into its volume (README, "The language model").
  ai:
    # Pinned by digest like the runner image; Dependabot's docker-compose entry proposes updates.
    image: ollama/ollama@sha256:5d3a2f25f9825628daba94dc0b1d421c7d57d6c03ae5faa9ba050e058bab8241
    container_name: fantasyscout-ai
    restart: unless-stopped
    environment:
      # one request and one model at a time, unloaded after five idle minutes: the GPU is shared
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ai-models:/root/.ollama
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 12g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - runner-1-net
      - runner-2-net
      # the live tunnel's side (ai-tunnel below); internal like the runners' networks
      - ai-live

  # Live AI (ADR 0017): the Cloudflare Tunnel the site's Worker reaches the model through, behind
  # an Access policy that admits only the Worker's service token. It reaches the model on ai-live
  # and Cloudflare's edge on the proxy's way out; it is started only with the `live` profile and
  # the tunnel's token (README, "Live answers").
  ai-tunnel:
    image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    container_name: fantasyscout-ai-tunnel
    profiles: [live]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${AI_TUNNEL_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    depends_on:
      - ai
    networks:
      - ai-live
      - egress

volumes:
  runner-state:
  runner-state-2:
  # filled once by hand (README); external so `down -v` never deletes a 5 GB download
  ai-models:
    external: true
    name: fantasyscout-ai-models

networks:
  # internal: no gateway; a container here reaches only the others on the same network (the proxy)
  runner-1-net:
    driver: bridge
    internal: true
  runner-2-net:
    driver: bridge
    internal: true
  # the proxy's way out
  egress:
    driver: bridge
  # the model and the live tunnel only
  ai-live:
    driver: bridge
    internal: true
