# The fantasyscout Worker: static Astro build plus exported gold data from R2.
# It serves the pages and the published JSON to everyone and the Parquet files only to the owner,
# signed in with Yahoo, or to CI's derived key (ADR 0008). Its secrets (YAHOO_CLIENT_ID,
# YAHOO_CLIENT_SECRET, OWNER_YAHOO_GUID) are set by the deploy workflow. See ADR 0007 and 0008.
#
# Two environments share this file. Deploy with `wrangler deploy --env production|preview`.
# Bindings are repeated per environment because wrangler does not inherit them.
name = "fantasyscout"
main = "src/index.ts"
compatibility_date = "2026-10-01"
upload_source_maps = true

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "404-page"
# The Worker runs only for what it serves itself: the data files, the player pages, sign-in and the
# Yahoo import, and the players sitemap. The asset layer serves every other page and the bundles
# on its own, with the security headers and the bundles' year-long cache from web/dist/_headers,
# which scripts/csp-hashes.mjs writes from src/policy.ts (#442). A page view then costs a few
# Worker requests instead of one per file.
run_worker_first = ["/data/*", "/p/*", "/api/*", "/auth/*", "/sitemap-players.xml"]

[[r2_buckets]]
binding = "DATA"
bucket_name = "fantasyscout-data"

# Live AI (ai.ts): a few explanations a minute per signed-in account.
[[ratelimits]]
name = "AI_LIMIT"
namespace_id = "1702"
simple = { limit = 4, period = 60 }

[observability]
enabled = true

# Production: the custom domain. Cloudflare creates the DNS record and certificate on first deploy.
[env.production]
name = "fantasyscout"
workers_dev = false
routes = [{ pattern = "fantasyscout.beronilla.rodeo", custom_domain = true }]

[[env.production.r2_buckets]]
binding = "DATA"
bucket_name = "fantasyscout-data"

[[env.production.ratelimits]]
name = "AI_LIMIT"
namespace_id = "1702"
simple = { limit = 4, period = 60 }

[env.production.observability]
enabled = true

# Preview: deployed from the preprod branch, reachable on workers.dev only.
[env.preview]
name = "fantasyscout-preview"
workers_dev = true

[[env.preview.r2_buckets]]
binding = "DATA"
bucket_name = "fantasyscout-data"

[[env.preview.ratelimits]]
name = "AI_LIMIT"
namespace_id = "1703"
simple = { limit = 4, period = 60 }

[env.preview.observability]
enabled = true
