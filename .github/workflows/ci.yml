name: CI

on:
  pull_request:
  push:
    branches: [main, preprod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Secrets and workflow hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No secrets committed
        run: |
          pattern='(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|dapi[0-9a-f]{32})'
          if git grep -nIE "$pattern" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::possible secret committed"
            exit 1
          fi
      - name: Validate workflow YAML
        run: |
          for f in .github/workflows/*.yml; do
            python3 -c "import sys, yaml; yaml.safe_load(open('$f'))" || exit 1
          done

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen --group dbt
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Build the dbt sample on DuckDB (the export tests read it)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt build --target duckdb --exclude tag:quality >/dev/null
      - run: uv run pytest

  dbt:
    name: dbt build on DuckDB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen --group dbt
      - name: Sample landing is current
        run: |
          uv run python dbt/sample/build_sample.py >/dev/null
          git diff --exit-code -- dbt/sample || { echo "::error::dbt/sample is stale; run dbt/sample/build_sample.py and commit"; exit 1; }
      # The fixture sample is a shape fixture (a few rows per payload), not a coherent season,
      # so the data-quality checks (tag:quality) run only against real data in the nightly build.
      - name: dbt build (fixtures, from scratch)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt build --target duckdb --exclude tag:quality
      - name: dbt build (second run exercises the incremental path)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt build --target duckdb --exclude tag:quality
      - name: Record results and decide the publish gate (DuckDB)
        run: uv run python -m ops.results --engine duckdb --duckdb dbt/fantasyscout.duckdb
      - name: Reconciliation summary (DuckDB)
        run: uv run python -m ops.summary --engine duckdb --duckdb dbt/fantasyscout.duckdb
      - name: The chaos switch blocks the gate
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: |
          uv run dbt test --target duckdb --select tag:chaos --vars '{chaos: true}' || true
          if uv run python -m ops.results --engine duckdb --duckdb fantasyscout.duckdb --dry-run --target-dir target; then
            echo "::error::the chaos failure did not block the gate"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: dbt-duckdb-run-results
          path: dbt/target/run_results.json
          retention-days: 7

  web:
    name: Web (check, lint, build, Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - name: Build
        run: PUBLIC_BUILD_ID="${GITHUB_SHA::7}" npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright smoke and accessibility tests
        run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  worker:
    name: Worker (typecheck, tests, dry-run deploy)
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Dry-run deploy
        run: npm run check
