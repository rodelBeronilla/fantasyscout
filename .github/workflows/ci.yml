name: CI

on:
  pull_request:
  push:
    branches: [main, preprod]

permissions:
  contents: read

# A newer push cancels a pull request's run in progress, but not main's: the site deploys only
# after a CI run on main succeeds, so cancelling there held every deploy back for as long as
# merges kept coming (#552). GitHub keeps one pending run per group and replaces an older pending
# one, so on main the newest commit is always the next to run and deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hygiene:
    name: Secrets and workflow hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: No secrets committed
        run: |
          # PKCS#8 keys (a Google service account's JSON carries one) as well as the older PEM kinds (#435)
          pattern='(AKIA[0-9A-Z]{16}|-----BEGIN ((RSA|EC|OPENSSH|PGP|ENCRYPTED) )?PRIVATE KEY-----|"private_key" *: *"-----BEGIN|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|dapi[0-9a-f]{32})'
          if git grep -nIE "$pattern" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::possible secret committed"
            exit 1
          fi
      - name: Validate workflow YAML
        run: |
          for f in .github/workflows/*.yml; do
            python3 -c "import sys, yaml; yaml.safe_load(open('$f'))" || exit 1
          done

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-uv
        with:
          groups: "dbt   notebooks"
      # The one command CONTRIBUTING quotes (ops/dev.py): ruff, mypy, the dbt sample on DuckDB
      # (the export tests read it) and pytest, in that order; tests/test_dev.py holds them together.
      - run: uv run fs-dev check
      - name: Execute the analysis notebooks against the sample
        working-directory: notebooks
        env:
          FS_NOTEBOOK_SOURCE: local
        # Four at a time with a retry for a kernel that fails to start, as the publish runs them (#446, #591).
        run: bash run.sh 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: notebooks-html
          path: notebooks/_build
          retention-days: 7
      - name: The Tableau extract builds from the sample
        env:
          FS_NOTEBOOK_SOURCE: local
        run: uv run python tableau/extract.py --out tableau/extract

  dbt:
    name: dbt build on DuckDB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-uv
        with:
          groups: "dbt"
      - name: Sample landing is current
        run: |
          uv run python dbt/sample/build_sample.py >/dev/null
          git diff --exit-code -- dbt/sample || { echo "::error::dbt/sample is stale; run dbt/sample/build_sample.py and commit"; exit 1; }
      # The fixture sample is a shape fixture (a few rows per payload), not a coherent season,
      # so the data-quality checks (tag:quality) run only against real data in the nightly build.
      - name: dbt build (fixtures, from scratch)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt build --target duckdb --exclude tag:quality
      - name: dbt build (second run exercises the incremental path)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt build --target duckdb --exclude tag:quality
      # A backtest rebuilds the lakehouse at a past date and must see nothing after it (#752): the
      # sample is rebuilt from scratch as of its first game day, and every dated table is checked.
      - name: Point-in-time build leaks nothing from after its date
        run: uv run python -m ops.point_in_time_check
      # The quality checks do not run on the sample, but a SQL mistake in one must not first show
      # up as a blocked nightly gate (#395): each compiled check is planned (EXPLAIN) against the
      # built sample, which parses it and binds its tables and columns without running it.
      - name: Plan the data-quality checks against the sample
        env:
          DBT_PROFILES_DIR: .
        run: |
          (cd dbt && uv run dbt compile --target duckdb --select tag:quality >/dev/null)
          uv run python -m ops.plan_checks --duckdb dbt/fantasyscout.duckdb
      - name: Record results and decide the publish gate (DuckDB)
        run: uv run python -m ops.results --engine duckdb --duckdb dbt/fantasyscout.duckdb
      - name: Record the build log row (DuckDB) and print the step summary
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: success
        run: uv run python -m ops.build_log --engine duckdb --duckdb dbt/fantasyscout.duckdb --summary
      # The deploy serves these at /docs/ (lineage graph, model and column definitions), generated
      # from the sample on DuckDB, whose schema and lineage are identical to the lakehouse's.
      - name: Keep the dbt docs for the deploy
        run: |
          (cd dbt && uv run dbt docs generate --target duckdb >/dev/null)
          mkdir -p dbt-docs && cp dbt/target/index.html dbt/target/manifest.json dbt/target/catalog.json dbt-docs/
          # the docs every deploy ships say they come from this sample (#350, #625)
          uv run python -m ops.docs_banner dbt-docs/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dbt-docs
          path: dbt-docs
          retention-days: 1
      # The Schema and Pipeline pages render web/src/generated/schema.json; it must match the project.
      - name: The app's schema file is current
        env:
          DBT_PROFILES_DIR: .
        run: |
          (cd dbt && uv run dbt docs generate --target duckdb >/dev/null)
          uv run python -m ops.schema --check --require-docs
      - name: Reconciliation summary (DuckDB)
        run: uv run python -m ops.summary --engine duckdb --duckdb dbt/fantasyscout.duckdb
      - name: The chaos switch blocks the gate
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: |
          uv run dbt test --target duckdb --select tag:chaos --vars '{chaos: true}' || true
          if uv run python -m ops.results --engine duckdb --duckdb fantasyscout.duckdb --dry-run --target-dir target; then
            echo "::error::the chaos failure did not block the gate"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: dbt-duckdb-run-results
          path: dbt/target/run_results.json
          retention-days: 7

  web:
    name: Web (check, lint, build, Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test:unit
      - name: Build
        env:
          # The Tableau Public viz URL, once the workbook is published (tableau/README.md). The
          # deploy ships this very build, so it has to carry the same settings.
          PUBLIC_TABLEAU_VIZ_URL: ${{ vars.TABLEAU_VIZ_URL }}
        run: PUBLIC_BUILD_ID="${GITHUB_SHA::7}" npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright smoke and accessibility tests
        run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  worker:
    name: Worker (typecheck, tests, dry-run deploy)
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: web/dist
      - run: npm ci
      - run: npm run typecheck
      - name: Unused exports (knip)
        run: npm run lint
      - run: npm test
      - name: Dry-run deploy
        run: npm run check
