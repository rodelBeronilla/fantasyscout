name: Backfill
# The build reads this title to leave the seasons still landing out of the completeness check
# (ops.backfilling, #420): keep the league, the seasons JSON and the source in it.
run-name: Backfill ${{ inputs.league }} ${{ inputs.seasons }} (${{ inputs.source }})

# Lands whole seasons. The stats API jobs run on the home runners (ADR 0002), one season per
# job so each stays well under the job time limit; ESPN runs on GitHub-hosted runners. The
# concurrency groups are shared with the daily Ingest workflow, so two jobs never hit the
# same stats host at once.

on:
  workflow_dispatch:
    inputs:
      league:
        description: League
        type: choice
        options: [wnba, nba]
        required: true
      seasons:
        description: JSON list of season labels, e.g. ["2018","2019"] or ["2023-24","2024-25"]
        type: string
        required: true
      source:
        description: Which source (both = stats and espn; reports = the official injury reports, one a day; market = each season's ESPN draft positions, once)
        type: choice
        options: [both, stats, espn, reports, market]
        default: both

permissions:
  contents: read
  issues: write

jobs:
  stats:
    name: Stats API ${{ inputs.league }} ${{ matrix.season }} ${{ matrix.season_type }}
    if: inputs.source == 'both' || inputs.source == 'stats'
    runs-on: ${{ fromJSON(format('["self-hosted","{0}"]', vars.STATS_RUNNER_LABEL)) }}
    environment: lakehouse
    timeout-minutes: 330
    concurrency:
      group: stats-${{ inputs.league }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        season: ${{ fromJSON(inputs.seasons) }}
        season_type: ["Regular Season", "Playoffs"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-uv
      - name: Season window
        id: window
        env:
          LEAGUE: ${{ inputs.league }}
          SEASON: ${{ matrix.season }}
          SEASON_TYPE: ${{ matrix.season_type }}
        run: |
          # Generous windows; the game log decides which games exist.
          if [ "$LEAGUE" = "wnba" ]; then
            y=$SEASON
            # WNBA playoffs have started as early as mid-August (2018, 2022).
            if [ "$SEASON_TYPE" = "Playoffs" ]; then echo "since=$y-08-01" >> "$GITHUB_OUTPUT"; echo "until=$y-10-31" >> "$GITHUB_OUTPUT";
            else echo "since=$y-05-01" >> "$GITHUB_OUTPUT"; echo "until=$y-09-30" >> "$GITHUB_OUTPUT"; fi
          else
            y1=${SEASON%-*}; y2=$((y1 + 1))
            if [ "$SEASON_TYPE" = "Playoffs" ]; then echo "since=$y2-04-10" >> "$GITHUB_OUTPUT"; echo "until=$y2-06-30" >> "$GITHUB_OUTPUT";
            else echo "since=$y1-10-01" >> "$GITHUB_OUTPUT"; echo "until=$y2-04-30" >> "$GITHUB_OUTPUT"; fi
          fi
      - name: Land
        id: land
        env:
          LEAGUE: ${{ inputs.league }}
          SEASON: ${{ matrix.season }}
          SEASON_TYPE: ${{ matrix.season_type }}
          SINCE: ${{ steps.window.outputs.since }}
          UNTIL: ${{ steps.window.outputs.until }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          # The ingest's service principal (runbook, "The ingest's own credential"); the token
          # is the fallback while the two are unset.
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_INGEST_TOKEN || secrets.DATABRICKS_TOKEN }}
        run: |
          set -o pipefail
          uv run fs-ingest land stats --league "$LEAGUE" --season "$SEASON" \
            --season-type "$SEASON_TYPE" --shots team-season --pace adaptive \
            --since "$SINCE" --until "$UNTIL" \
            --backend volume 2>&1 | tee land.log
      - name: Report
        if: always()
        uses: ./.github/actions/incident
        with:
          token: ${{ github.token }}
          title: "Backfill failure: stats ${{ inputs.league }} ${{ matrix.season }} ${{ matrix.season_type }}"
          outcome: ${{ steps.land.outcome }}

  espn:
    name: ESPN ${{ inputs.league }} ${{ matrix.season }}
    if: inputs.source == 'both' || inputs.source == 'espn'
    runs-on: ubuntu-latest
    environment: lakehouse
    timeout-minutes: 330
    concurrency:
      group: espn-${{ inputs.league }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        season: ${{ fromJSON(inputs.seasons) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-uv
      - name: Season window
        id: window
        env:
          LEAGUE: ${{ inputs.league }}
          SEASON: ${{ matrix.season }}
        run: |
          if [ "$LEAGUE" = "wnba" ]; then
            echo "since=$SEASON-05-01" >> "$GITHUB_OUTPUT"; echo "until=$SEASON-10-31" >> "$GITHUB_OUTPUT"
          else
            y1=${SEASON%-*}; y2=$((y1 + 1))
            echo "since=$y1-10-01" >> "$GITHUB_OUTPUT"; echo "until=$y2-06-30" >> "$GITHUB_OUTPUT"
          fi
      - name: Land
        id: land
        env:
          LEAGUE: ${{ inputs.league }}
          SEASON: ${{ matrix.season }}
          SINCE: ${{ steps.window.outputs.since }}
          UNTIL: ${{ steps.window.outputs.until }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          # The ingest's service principal (runbook, "The ingest's own credential"); the token
          # is the fallback while the two are unset.
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_INGEST_TOKEN || secrets.DATABRICKS_TOKEN }}
        run: |
          set -o pipefail
          uv run fs-ingest land espn --league "$LEAGUE" --season "$SEASON" \
            --since "$SINCE" --until "$UNTIL" \
            --pace adaptive --backend volume 2>&1 | tee land.log
      - name: Report
        if: always()
        uses: ./.github/actions/incident
        with:
          token: ${{ github.token }}
          title: "Backfill failure: espn ${{ inputs.league }} ${{ matrix.season }}"
          outcome: ${{ steps.land.outcome }}

  # The leagues keep their official injury reports on the host (the NBA's back to 2018-12-17, the
  # WNBA's from 2026): one report a day, the 5 pm Eastern one, for the availability calibration and
  # the injury spells (#784). An NBA season's window runs to 30 September, so 2019-20's games in
  # the bubble (July to October 2020) are in it.
  reports:
    name: Injury reports ${{ inputs.league }} ${{ matrix.season }}
    if: inputs.source == 'reports'
    runs-on: ubuntu-latest
    environment: lakehouse
    timeout-minutes: 120
    concurrency:
      group: reports-${{ inputs.league }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        season: ${{ fromJSON(inputs.seasons) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-uv
      - name: Season window, up to yesterday
        id: window
        env:
          LEAGUE: ${{ inputs.league }}
          SEASON: ${{ matrix.season }}
        run: |
          if [ "$LEAGUE" = "wnba" ]; then since="$SEASON-05-01"; until="$SEASON-10-31"
          else y1=${SEASON%-*}; since="$y1-10-01"; until="$((y1 + 1))-09-30"; fi
          yesterday=$(date -u -d yesterday +%F)
          [[ "$until" > "$yesterday" ]] && until="$yesterday"
          echo "since=$since" >> "$GITHUB_OUTPUT"; echo "until=$until" >> "$GITHUB_OUTPUT"
      - name: Land
        id: land
        env:
          LEAGUE: ${{ inputs.league }}
          SEASON: ${{ matrix.season }}
          SINCE: ${{ steps.window.outputs.since }}
          UNTIL: ${{ steps.window.outputs.until }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          # The ingest's service principal (runbook, "The ingest's own credential"); the token
          # is the fallback while the two are unset.
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_INGEST_TOKEN || secrets.DATABRICKS_TOKEN }}
        run: |
          set -o pipefail
          uv run fs-ingest land reports --history --league "$LEAGUE" --season "$SEASON"             --since "$SINCE" --until "$UNTIL"             --backend volume 2>&1 | tee land.log
      - name: Report
        if: always()
        uses: ./.github/actions/incident
        with:
          token: ${{ github.token }}
          title: "Backfill failure: reports ${{ inputs.league }} ${{ matrix.season }}"
          outcome: ${{ steps.land.outcome }}

  # Each past season's ESPN fantasy market, once (#786): the preseason market baseline of the
  # walk-forward harness, landed under espn/fantasy_adp, one request a season (ADR 0008).
  market:
    name: ESPN market ${{ inputs.league }} ${{ matrix.season }}
    if: inputs.source == 'market'
    runs-on: ubuntu-latest
    environment: lakehouse
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        season: ${{ fromJSON(inputs.seasons) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-uv
      - name: Land
        id: land
        env:
          LEAGUE: ${{ inputs.league }}
          SEASON: ${{ matrix.season }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_INGEST_TOKEN || secrets.DATABRICKS_TOKEN }}
        run: |
          set -o pipefail
          uv run fs-ingest land espn --history --league "$LEAGUE" --season "$SEASON" --backend volume 2>&1 | tee land.log
      - name: Report
        if: always()
        uses: ./.github/actions/incident
        with:
          token: ${{ github.token }}
          title: "Backfill failure: market ${{ inputs.league }} ${{ matrix.season }}"
          outcome: ${{ steps.land.outcome }}
