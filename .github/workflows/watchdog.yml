name: Publish watchdog

# Is the live site serving a recent build? Every other alert is a pipeline step that failed, so a
# pipeline that never starts (a home runner offline, a schedule GitHub stopped firing, a build
# cancelled before its report step) raises nothing. This job runs outside the pipeline on a
# GitHub-hosted runner, reads the published pointer and judges its age against the publish SLA
# (docs/runbook.md, "Publish SLA and the watchdog"). A stale build opens a data-incident issue;
# the next fresh check closes it.

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # to dispatch Build lakehouse when the live build is stale and the warehouse answers (#782)
  actions: write

concurrency:
  group: publish-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    name: Live build age
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # the warehouse probe reads the lakehouse secrets, which live in this environment
    environment: lakehouse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-uv
      - name: Check the live build
        id: check
        # a stale build must not skip the warehouse probe and the rebuild below
        continue-on-error: true
        env:
          SITE: https://fantasyscout.beronilla.rodeo
        run: |
          set -o pipefail
          uv run python -m ops.watchdog --site "$SITE" 2>&1 | tee land.log | tee -a "$GITHUB_STEP_SUMMARY"
      # One statement against the warehouse, every six hours, outside the pipeline: a warehouse
      # that refuses statements (as on 2026-11-01, #366) opens its own incident within the cadence
      # instead of waiting for the next build or a hand export to fail (#414). The summary query's
      # strict mode exits 1 only when the statement could not run; a blocked gate is not a failure
      # here.
      - name: Resolve the workspace host and SQL warehouse
        id: context
        continue-on-error: true
        uses: ./.github/actions/databricks-context
        with:
          host: ${{ secrets.DATABRICKS_HOST }}
          token: ${{ secrets.DATABRICKS_TOKEN }}
          warehouse-id: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
      # A stopped warehouse is started first, as the build does, so the probe tests whether it
      # can come up, not whether it happened to be running (#782).
      - name: Start the SQL warehouse and wait for it
        id: start
        if: steps.context.outcome == 'success'
        continue-on-error: true
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -o pipefail
          uv run python -m ops.warehouse start --wait 600 2>&1 | tee warehouse.log
      - name: Probe the warehouse
        id: warehouse
        if: steps.start.outcome == 'success'
        continue-on-error: true
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -o pipefail
          uv run python -m ops.summary --engine databricks --strict --table ops.publish_gate \
            --columns "run_id, run_at, passed" --order-by "run_at desc" --limit 1 2>&1 | tee -a warehouse.log
      # A stale site rebuilds itself once the warehouse answers again, instead of waiting for the
      # next ingest (up to about seven hours): Build lakehouse is dispatched unless one is already
      # queued or running (#782).
      - name: Rebuild a stale site
        if: steps.check.outcome == 'failure' && steps.warehouse.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh run list --workflow build.yml --limit 20 --json status \
            -q '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting")] | length')
          if [ "$active" != "0" ]; then
            echo "Build lakehouse already has $active run(s) queued or running; not dispatching another"
          else
            gh workflow run build.yml --ref main
            echo "::notice::the live build is stale and the warehouse answers: dispatched Build lakehouse"
          fi
      - name: Report the warehouse
        if: always() && steps.context.outcome != 'skipped'
        uses: ./.github/actions/incident
        with:
          token: ${{ github.token }}
          title: "Warehouse refuses statements: the lakehouse did not answer the watchdog"
          log: warehouse.log
          outcome: ${{ (steps.context.outcome == 'failure' || steps.start.outcome == 'failure' || steps.warehouse.outcome == 'failure') && 'failure' || 'success' }}
          detail: "The watchdog ran one statement against the SQL warehouse (ops.publish_gate, latest row) and it did not run. Builds, hand exports and queries will fail the same way until the warehouse answers: open the workspace's SQL Warehouses page, start or recreate the warehouse, and set the repository variable DATABRICKS_WAREHOUSE_ID. The next passing probe closes this."
      - name: Report
        if: always()
        uses: ./.github/actions/incident
        with:
          token: ${{ github.token }}
          title: "Publish stale: the live build is older than the SLA allows"
          outcome: ${{ steps.check.outcome }}
          detail: "The watchdog reads the site's /data/latest.json on its own schedule. A stale build means no Build lakehouse run promoted a build in time: check the Ingest and Build runs, the home runners (infra/runner) and whether the schedules fired."
      - name: Fail on a stale site
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::the live build is older than the publish SLA allows"
          exit 1
