name: Export data

# Publish, roll back or list the data builds in R2 by hand. The nightly build publishes on its
# own after a passing gate (build.yml); this is for a re-export or a rollback. A rollback pins
# the site to that build: nightly builds are still recorded but do not go live until unpin. A build here
# checks the latest publish gate first and refuses when it did not pass, unless ignore_gate is
# set on purpose (the run log says so).

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [build, rollback, unpin, list, orphans, delete-orphans, notebooks, sheets]
        default: build
      to_build:
        description: Rollback target (blank = the previous build), unpin target (blank = the newest), or the build notebooks and sheets run against (blank = the live one)
        type: string
        default: ""
      skip:
        description: Tables to leave out of a build, comma-separated (for example fct_event)
        type: string
        default: ""
      ignore_gate:
        description: Export even though the latest publish gate did not pass (an emergency only)
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

# One group with Build lakehouse: both promote (a read-modify-write of builds.json) and prune
# (deletes by a build's key list), so they never run at the same time.
concurrency:
  group: r2-publish
  cancel-in-progress: false

jobs:
  export:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: ${{ (inputs.ignore_gate || inputs.action == 'rollback') && 'lakehouse-override' || 'lakehouse' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-uv
        with:
          # the notebooks and the extract read the published build with pandas
          groups: ${{ (inputs.action == 'notebooks' || inputs.action == 'sheets') && 'dbt notebooks' || '' }}
      - name: Resolve the workspace host and SQL warehouse
        if: inputs.action == 'build'
        uses: ./.github/actions/databricks-context
        with:
          host: ${{ secrets.DATABRICKS_HOST }}
          token: ${{ secrets.DATABRICKS_TOKEN }}
          warehouse-id: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
      - name: Check the latest publish gate
        id: gate
        if: inputs.action == 'build'
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          IGNORE_GATE: ${{ inputs.ignore_gate }}
        run: |
          if [ "$IGNORE_GATE" = "true" ]; then
            uv run python -m ops.gate --engine databricks || echo "::warning::exporting with the gate ignored on purpose"
          else
            uv run python -m ops.gate --engine databricks
          fi
      # A hand-made build goes the same way as the nightly one: staged, completed with the
      # notebooks and the Tableau extract, then promoted, so it never goes live without them
      # (.github/actions/publish-build, shared with the nightly build).
      - name: Publish the build (stage, notebooks, extract, promote)
        id: publish
        if: inputs.action == 'build'
        uses: ./.github/actions/publish-build
        with:
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          reader-key: ${{ secrets.CI_READER_KEY }}
          skip: ${{ inputs.skip }}
      - name: What the build carried
        if: inputs.action == 'build'
        env:
          NOTEBOOKS: ${{ steps.publish.outputs.notebooks }}
          EXTRACT: ${{ steps.publish.outputs.extract }}
          BUILD_ID: ${{ steps.publish.outputs.build_id }}
        run: echo "build $BUILD_ID promoted; notebooks $NOTEBOOKS, Tableau extract $EXTRACT"
      # A build whose notebooks or sheet push failed after it went live (the incident names the
      # step) gets them again without a rebuild: the same commands as the publish, against the
      # live build or the one named (#419; docs/runbook.md, "Rerun the notebooks or the sheet push").
      - name: Re-run the notebooks against the build and attach them
        id: notebooks
        if: inputs.action == 'notebooks'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FS_NOTEBOOK_SOURCE: published
          FS_READER_KEY: ${{ secrets.CI_READER_KEY }}
          TO_BUILD: ${{ inputs.to_build }}
        run: |
          set -euo pipefail
          build="${TO_BUILD:-$(curl -sf https://fantasyscout.beronilla.rodeo/data/latest.json | python3 -c 'import json, sys; print(json.load(sys.stdin)["build_id"])')}"
          export FS_BUILD_ID="$build"
          echo "notebooks read build $build"
          bash notebooks/run.sh 1200
          uv run fs-export publish-files --store r2 --subdir notebooks --build-id "$build" notebooks/_build/*.html notebooks/_build/*.findings.json
          uv run fs-export findings-history --store r2 --build-id "$build"
      - name: Refresh the Tableau extract from the build and push it to the sheet
        id: sheets
        if: inputs.action == 'sheets'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FS_NOTEBOOK_SOURCE: published
          FS_READER_KEY: ${{ secrets.CI_READER_KEY }}
          TABLEAU_SHEET_ID: ${{ vars.TABLEAU_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TO_BUILD: ${{ inputs.to_build }}
        run: |
          set -euo pipefail
          build="${TO_BUILD:-$(curl -sf https://fantasyscout.beronilla.rodeo/data/latest.json | python3 -c 'import json, sys; print(json.load(sys.stdin)["build_id"])')}"
          export FS_BUILD_ID="$build"
          echo "the extract reads build $build"
          uv run python tableau/extract.py --out tableau/extract
          uv run fs-export publish-files --store r2 --subdir tableau --build-id "$build" tableau/extract/*.csv
          uv run python tableau/sheets.py --extract tableau/extract
      - name: Roll back, unpin or list
        id: manage
        if: inputs.action != 'build' && inputs.action != 'notebooks' && inputs.action != 'sheets'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACTION: ${{ inputs.action }}
          TO_BUILD: ${{ inputs.to_build }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            rollback)
              # fs-export refuses a build whose manifest or key list is gone; the pointer is read
              # back afterwards so the log shows what the site now serves.
              if [ -n "$TO_BUILD" ]; then uv run fs-export rollback --store r2 --to "$TO_BUILD";
              else uv run fs-export rollback --store r2; fi
              uv run fs-export list --store r2 ;;
            unpin)
              if [ -n "$TO_BUILD" ]; then uv run fs-export unpin --store r2 --to "$TO_BUILD";
              else uv run fs-export unpin --store r2; fi ;;
            list) uv run fs-export list --store r2 ;;
            orphans) uv run fs-export orphans --store r2 ;;
            delete-orphans) uv run fs-export orphans --store r2 --delete ;;
          esac
      - name: What the site now serves
        if: always()
        run: |
          curl -sf https://fantasyscout.beronilla.rodeo/data/latest.json || echo "latest.json not served yet"
      # A hand export that fails used to leave only a red run (#366 was found by hand); the same
      # incident path as the nightly build names the step and leads with the first errors.
      - name: Report
        if: always()
        uses: ./.github/actions/incident
        with:
          token: ${{ github.token }}
          title: "Export failure: ${{ inputs.action }} by hand"
          outcome: ${{ (steps.gate.outcome == 'failure' || steps.publish.outcome == 'failure' || steps.manage.outcome == 'failure' || steps.notebooks.outcome == 'failure' || steps.sheets.outcome == 'failure') && 'failure' || 'success' }}
          detail: "Steps: gate ${{ steps.gate.outcome }}, publish ${{ steps.publish.outcome }}, manage ${{ steps.manage.outcome }}, notebooks ${{ steps.notebooks.outcome }}, sheets ${{ steps.sheets.outcome }}. A gate step that failed with 'could not be processed by the warehouse' is the warehouse refusing statements, not a blocked gate: see the runbook section of that name."
