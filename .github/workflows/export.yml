name: Export data

# Publish, roll back or list the data builds in R2 by hand. The nightly build publishes on its
# own after a passing gate (build.yml); this is for a re-export or a rollback. A rollback pins
# the site to that build: nightly builds are still recorded but do not go live until unpin. A build here
# checks the latest publish gate first and refuses when it did not pass, unless ignore_gate is
# set on purpose (the run log says so).

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [build, rollback, unpin, list]
        default: build
      to_build:
        description: Rollback target (blank = the previous build), or unpin target (blank = the newest)
        type: string
        default: ""
      skip:
        description: Tables to leave out of a build, comma-separated (for example fct_event)
        type: string
        default: ""
      ignore_gate:
        description: Export even though the latest publish gate did not pass (an emergency only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: export
  cancel-in-progress: false

jobs:
  export:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Resolve the workspace host and SQL warehouse
        if: inputs.action == 'build'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -euo pipefail
          origin=$(uv run python -c "import os; from ingest.store import workspace_origin; print(workspace_origin(os.environ['DATABRICKS_HOST']))")
          host="${origin#https://}"
          echo "::add-mask::$host"
          warehouse=$(curl -sf -H "Authorization: Bearer $DATABRICKS_TOKEN" "$origin/api/2.0/sql/warehouses" \
            | uv run python -c "import json,sys; w=json.load(sys.stdin)['warehouses']; print(sorted(w, key=lambda x: x.get('creation_time', 0))[0]['id'])")
          echo "::add-mask::$warehouse"
          {
            echo "DATABRICKS_ORIGIN=$origin"
            echo "DATABRICKS_WAREHOUSE_ID=$warehouse"
          } >> "$GITHUB_ENV"
      - name: Check the latest publish gate
        if: inputs.action == 'build'
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          IGNORE_GATE: ${{ inputs.ignore_gate }}
        run: |
          if [ "$IGNORE_GATE" = "true" ]; then
            uv run python -m ops.gate --engine databricks || echo "::warning::exporting with the gate ignored on purpose"
          else
            uv run python -m ops.gate --engine databricks
          fi
      # A hand-made build goes the same way as the nightly one: staged, completed with the
      # notebooks and the Tableau extract, then promoted, so it never goes live without them.
      - name: Export gold to R2 (staged)
        id: export
        if: inputs.action == 'build'
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SKIP: ${{ inputs.skip }}
        run: |
          set -o pipefail
          uv run fs-export build --engine databricks --store r2 --skip "$SKIP" --stage 2>&1 | tee export.log
          echo "build_id=$(sed -n 's/^staged //p' export.log | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Execute the analysis notebooks against the staged build and add them to it
        id: notebooks
        if: steps.export.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FS_NOTEBOOK_SOURCE: published
          FS_OWNER_KEY: ${{ secrets.OWNER_KEY }}
          FS_BUILD_ID: ${{ steps.export.outputs.build_id }}
        run: |
          set -euo pipefail
          uv sync --frozen --group dbt --group notebooks
          (cd notebooks && uv run jupyter nbconvert --to html --execute --output-dir _build --ExecutePreprocessor.timeout=1200 *.ipynb)
          uv run fs-export publish-files --store r2 --subdir notebooks --build-id "$FS_BUILD_ID" notebooks/_build/*.html notebooks/_build/*.findings.json
      - name: Refresh the Tableau extract and add it to the staged build
        id: extract
        if: steps.export.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FS_NOTEBOOK_SOURCE: published
          FS_OWNER_KEY: ${{ secrets.OWNER_KEY }}
          FS_BUILD_ID: ${{ steps.export.outputs.build_id }}
        run: |
          set -euo pipefail
          uv run python tableau/extract.py --out tableau/extract
          uv run fs-export publish-files --store r2 --subdir tableau --build-id "$FS_BUILD_ID" tableau/extract/*.csv
      - name: Promote the build
        if: steps.export.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILD_ID: ${{ steps.export.outputs.build_id }}
          NOTEBOOKS: ${{ steps.notebooks.outcome }}
          EXTRACT: ${{ steps.extract.outcome }}
        run: |
          [ "$NOTEBOOKS" = "success" ] || echo "::warning::the notebooks failed; the build goes live without them"
          [ "$EXTRACT" = "success" ] || echo "::warning::the Tableau extract failed; the build goes live without it"
          uv run fs-export promote --store r2 --build-id "$BUILD_ID"
      - name: Roll back, unpin or list
        if: inputs.action != 'build'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACTION: ${{ inputs.action }}
          TO_BUILD: ${{ inputs.to_build }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            rollback)
              if [ -n "$TO_BUILD" ]; then uv run fs-export rollback --store r2 --to "$TO_BUILD";
              else uv run fs-export rollback --store r2; fi ;;
            unpin)
              if [ -n "$TO_BUILD" ]; then uv run fs-export unpin --store r2 --to "$TO_BUILD";
              else uv run fs-export unpin --store r2; fi ;;
            list) uv run fs-export list --store r2 ;;
          esac
      - name: What the site now serves
        if: always()
        run: |
          curl -sf https://fantasyscout.beronilla.rodeo/data/latest.json || echo "latest.json not served yet"
