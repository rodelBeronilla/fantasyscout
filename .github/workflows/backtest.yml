name: Backtest

# The walk-forward harness (#769, epic #751), first stage: mirror some league-seasons of the
# landing volume onto the runner and build them on DuckDB, where point-in-time builds run
# (ADR 0018). It reads the volume through the Files API and builds on the runner, so it spends no
# SQL warehouse time. The checks tagged quality run too: assert_one_value_scale (ADR 0019) on real
# seasons, not only the sample.

on:
  workflow_dispatch:
    inputs:
      league:
        description: League
        type: choice
        options: [nba, wnba]
        default: nba
      seasons:
        description: Seasons to mirror and build, space separated (a checkpoint needs its season and the two before)
        type: string
        default: "2022-23 2023-24 2024-25"
      judge:
        description: Season to walk forward through (ops.walk_forward; empty to only build). It needs the two seasons before it mirrored too
        type: string
        default: ""
      market_prior:
        description: Judge the board with the market prior off and on (#832)
        type: boolean
        default: false
      prior_weight:
        description: The market prior's weight (empty for the registry's)
        type: string
        default: ""
      prior_fade:
        description: The market prior's fade_games (empty for the registry's)
        type: string
        default: ""
      standings:
        description: Judge the standings model on simulated leagues too (#755)
        type: boolean
        default: false
      trades:
        description: Judge the Trade page's verdict, suggestions and finder on simulated leagues too (#756)
        type: boolean
        default: false
      roster:
        description: Judge My Team's roster review on simulated leagues too (#757)
        type: boolean
        default: false
      playoffs:
        description: Judge the playoff odds on the same leagues too (#872; needs standings)
        type: boolean
        default: false
      closeness:
        description: Judge the matchup card's too-close band, a build every week (#869)
        type: boolean
        default: false
      buy_sell:
        description: Judge the Trade page's buy low, sell high on simulated leagues too (#758)
        type: boolean
        default: false
      points:
        description: Judge a points league's playoff odds on the same leagues too (#891; needs standings)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backtest-${{ inputs.league }}-${{ inputs.judge }}-${{ inputs.seasons }}-${{ inputs.market_prior }}-${{ inputs.standings }}-${{ inputs.playoffs }}-${{ inputs.trades }}-${{ inputs.roster }}-${{ inputs.closeness }}-${{ inputs.buy_sell }}
  cancel-in-progress: false

jobs:
  mirror-and-build:
    name: Mirror and build ${{ inputs.league }} ${{ inputs.seasons }}
    runs-on: ubuntu-latest
    environment: lakehouse
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-uv
        with:
          groups: "dbt"
      - name: Mirror the landing volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_INGEST_TOKEN || secrets.DATABRICKS_TOKEN }}
          LEAGUE: ${{ inputs.league }}
          SEASONS: ${{ inputs.seasons }}
        run: |
          args=()
          for s in $SEASONS; do args+=(--season "$s"); done
          uv run python -m ops.landing_sync --league "$LEAGUE" "${args[@]}" --out "$RUNNER_TEMP/landing" --workers 8
          du -sh "$RUNNER_TEMP/landing"
          df -h "$RUNNER_TEMP"
      - name: Build on DuckDB
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
          FS_LANDING_ROOT: ${{ runner.temp }}/landing
        run: |
          set -o pipefail
          uv run dbt build --target duckdb --exclude tag:quality 2>&1 | tail -40
      - name: The quality checks on real seasons
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
          FS_LANDING_ROOT: ${{ runner.temp }}/landing
        run: |
          set +e
          uv run dbt test --target duckdb --select assert_one_value_scale assert_board_values_sane assert_board_rostered
          status=$?
          # a failing check prints the rows it found, so the cause is in this run's log
          for t in assert_one_value_scale assert_board_values_sane assert_board_rostered; do
            uv run python -c "import duckdb, pathlib; sql = pathlib.Path('target/compiled/fantasyscout/tests/$t.sql').read_text(); df = duckdb.connect('fantasyscout.duckdb', read_only=True).execute(sql).fetchdf(); print('== $t:', len(df), 'rows'); print(df.head(20).to_string(index=False)) if len(df) else None"
          done
          exit $status
      - name: What was built
        env:
          LEAGUE: ${{ inputs.league }}
        run: |
          uv run python - <<'EOF'
          import os
          import duckdb
          con = duckdb.connect("dbt/fantasyscout.duckdb", read_only=True)
          league = os.environ["LEAGUE"]
          for sql in (
              "select season, count(*) as player_games from gold.fct_player_game where league = ? group by 1 order by 1",
              "select season, source, pool, teams, players, round(repl_z_points, 3) as repl_points from gold.int_value_scale where league = ? order by 1",
              "select count(*) as board_rows, sum(in_pool::int) as in_pool from gold.mart_board where league = ?",
              "select returned, censored, count(*) as spells from gold.fct_injury_spell where league = ? group by all order by all",
              "select season, count(*) as players, sum(walk_year::int) as walk_years, sum((walk_year and re_signed)::int) as re_signed from gold.fct_walk_year where league = ? group by 1 order by 1",
              # the advanced lines' coverage of the games played, for the projection's features (#771)
              "select season, count(*) as played, round(avg((usage_percentage is not null)::int), 3) as usage, round(avg((player_pace is not null)::int), 3) as pace, round(avg((team_share_points is not null)::int), 3) as team_share from gold.fct_player_game where league = ? and played group by 1 order by 1",
          ):
              print(con.execute(sql, [league]).fetchdf().to_string(index=False), end="\n\n")
          EOF
      - name: Walk forward through the season
        if: inputs.judge != ''
        env:
          LEAGUE: ${{ inputs.league }}
          JUDGE: ${{ inputs.judge }}
          MARKET_PRIOR: ${{ inputs.market_prior }}
          PRIOR_WEIGHT: ${{ inputs.prior_weight }}
          PRIOR_FADE: ${{ inputs.prior_fade }}
          STANDINGS: ${{ inputs.standings }}
          TRADES: ${{ inputs.trades }}
          ROSTER: ${{ inputs.roster }}
          BUY_SELL: ${{ inputs.buy_sell }}
          FS_LANDING_ROOT: ${{ runner.temp }}/landing
        run: |
          set -o pipefail
          args=()
          if [ "$MARKET_PRIOR" = "true" ]; then args+=(--market-prior); fi
          if [ -n "$PRIOR_WEIGHT" ]; then args+=(--prior-weight "$PRIOR_WEIGHT"); fi
          if [ -n "$PRIOR_FADE" ]; then args+=(--prior-fade "$PRIOR_FADE"); fi
          if [ "$STANDINGS" = "true" ] || [ "$TRADES" = "true" ] || [ "$ROSTER" = "true" ] || [ "$BUY_SELL" = "true" ]; then args+=(--standings-out standings); fi
          if [ "$BUY_SELL" = "true" ]; then args+=(--buy-sell); fi
          uv run python -m ops.walk_forward --league "$LEAGUE" --season "$JUDGE" \
            --full-db dbt/fantasyscout.duckdb --out walk_forward.json \
            --players-out walk_forward_players.csv "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Judge the standings model
        if: inputs.judge != '' && inputs.standings
        run: |
          set -o pipefail
          uv run python -m ops.standings_backtest judge standings --out standings.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Judge the Trade page
        if: inputs.judge != '' && inputs.trades
        run: |
          set -o pipefail
          uv run python -m ops.trade_backtest judge standings --out trades.json --cache trades-cache.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Judge the roster review
        if: inputs.judge != '' && inputs.roster
        run: |
          set -o pipefail
          uv run python -m ops.roster_backtest judge standings --out roster.json --cache roster-cache.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Judge buy low, sell high
        if: inputs.judge != '' && inputs.buy_sell
        run: |
          set -o pipefail
          uv run python -m ops.buy_sell_backtest judge standings walk_forward_players.csv --out buy_sell.json --cache buy-sell-cache.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        # kept when the standings judgement fails, so its inputs can be read
        if: always() && inputs.judge != ''
        with:
          name: walk-forward-${{ inputs.league }}-${{ inputs.judge }}${{ inputs.market_prior && '-prior' || '' }}${{ inputs.standings && '-standings' || '' }}${{ inputs.trades && '-trades' || '' }}${{ inputs.roster && '-roster' || '' }}${{ inputs.buy_sell && '-buy-sell' || '' }}
          path: |
            walk_forward.json
            walk_forward_players.csv
            standings.json
            trades.json
            trades-cache.json
            roster.json
            roster-cache.json
            buy_sell.json
            buy-sell-cache.json
            standings/
          retention-days: 90
      # The playoff odds (#872): the standings model's leagues with a schedule, a record so far and
      # a cut, from the inputs the standings judgement reads.
      - name: Judge the playoff odds
        if: inputs.judge != '' && inputs.standings && inputs.playoffs
        run: |
          set -o pipefail
          uv run python -m ops.playoff_backtest judge standings --out playoffs.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && inputs.judge != '' && inputs.standings && inputs.playoffs
        with:
          name: playoffs-${{ inputs.league }}-${{ inputs.judge }}
          path: playoffs.json
          retention-days: 90
      # The matchup card's too-close band (#869): a point-in-time build on every week's first day
      # of the judged season, the card's chances and the stream replay on simulated leagues.
      - name: Judge the matchup card's closeness
        if: inputs.judge != '' && inputs.closeness
        env:
          LEAGUE: ${{ inputs.league }}
          JUDGE: ${{ inputs.judge }}
          FS_LANDING_ROOT: ${{ runner.temp }}/landing
        run: |
          set -o pipefail
          uv run python -m ops.closeness_backtest export --league "$LEAGUE" --season "$JUDGE" \
            --full-db dbt/fantasyscout.duckdb --out closeness
          uv run python -m ops.closeness_backtest judge closeness --out closeness.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && inputs.judge != '' && inputs.closeness
        with:
          name: closeness-${{ inputs.league }}-${{ inputs.judge }}
          path: |
            closeness.json
            closeness/
          retention-days: 90
      # A points league's playoff odds (#891): the standings model's leagues played on ESPN's default
      # points scoring, from the inputs the standings judgement reads.
      - name: Judge a points league's playoff odds
        if: inputs.judge != '' && inputs.standings && inputs.points
        run: |
          set -o pipefail
          uv run python -m ops.points_backtest judge standings --out points.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && inputs.judge != '' && inputs.standings && inputs.points
        with:
          name: points-${{ inputs.league }}-${{ inputs.judge }}
          path: points.json
          retention-days: 90
