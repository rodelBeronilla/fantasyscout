name: Quarterly secret review

# Opens one issue at the start of each quarter that walks the secret inventory (docs/runbook.md,
# "Secrets: inventory and rotation"): which secrets expire before the next review, which have not
# been rotated in a year, and whether each still has only the scope its consumers need (#417).
# An open review issue is left alone rather than duplicated.

on:
  schedule:
    - cron: "0 14 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    name: Open the quarterly review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open the issue unless one is open
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Quarterly secret review"
          open=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$open" != "0" ]; then echo "an open review exists; nothing to do"; exit 0; fi
          gh secret list --repo "$REPO" > secrets.txt 2>/dev/null || echo "(the job's token cannot list secrets: read them in Settings)" > secrets.txt
          {
            echo "Walk the inventory in docs/runbook.md, \"Secrets: inventory and rotation\":"
            echo
            echo "- [ ] Any secret that expires before the next review: rotate it now (each row's steps)."
            echo "- [ ] Any secret older than a year: rotate it."
            echo "- [ ] Each secret still has only the scope its consumers need."
            echo "- [ ] Run the Probe sources workflow by hand afterwards; every source answers."
            echo
            echo "Repository secrets and when each was last set:"
            echo
            echo '```'
            cat secrets.txt
            echo '```'
          } > body.md
          gh issue create --repo "$REPO" --title "$title" --body-file body.md --label P2-medium --label area:ops
