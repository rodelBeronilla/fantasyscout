name: Build lakehouse

# dbt build on Databricks: bronze and silver (and, from phase 3, gold and ops) over the landed
# volume. Runs after every Ingest or Backfill that finishes, even one with a failed job, so one
# failed request does not cost the day's build: the failed job has its own incident, and the
# completeness check only counts a game missing once it has been final for more than a day
# (the next daily window fetches it again). A cancelled run does not trigger a build. Runs by
# hand too. A failed build opens or updates a data-incident issue; the next passing build
# closes it. An ingest that landed only the injury reports and the other evening feeds (the
# 23:00 UTC schedule) gets a light build: those feeds' models and everything downstream of them
# (the board and streamers included), with every quality check, and no notebooks or Tableau
# extract, which the morning's full build refreshes.

on:
  workflow_run:
    workflows: [Ingest, Backfill]
    types: [completed]
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Rebuild incremental models from scratch
        type: boolean
        default: false
      select:
        description: dbt selector (default everything)
        type: string
        default: ""
      chaos:
        description: Chaos drill, fail one error-severity check on purpose to prove the gate and the incident path
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: build-lakehouse
  cancel-in-progress: false

jobs:
  dbt:
    name: dbt build on Databricks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    environment: lakehouse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen --group dbt

      - name: Read what the ingest landed
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: ingest-plan
          path: ingest-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Choose a full or a light build
        if: github.event_name == 'workflow_run'
        run: |
          source=$(uv run python -c "import json,sys; print(json.load(open('ingest-plan/ingest-plan.json'))['source'])" 2>/dev/null || echo "unknown")
          echo "the ingest landed: $source"
          if [ "$source" = "reports" ]; then
            echo "PLAN_SELECT=tag:feed_reports+ path:models/ops" >> "$GITHUB_ENV"
            echo "PLAN_LIGHT=true" >> "$GITHUB_ENV"
            echo "::notice::light build: the evening ingest landed the reports only, so the build covers those feeds' models and their consumers; notebooks and the Tableau extract wait for the morning's full build"
          fi

      - name: Note an ingest that ended with a failed job
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
        run: |
          echo "::warning::$RUN_NAME ended with a failed job ($RUN_URL); building with what landed. That job's incident tracks it."
          echo "$RUN_NAME ended with a failed job: $RUN_URL. Building with what landed." >> land.log

      - name: Resolve the workspace host and SQL warehouse
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -euo pipefail
          origin=$(uv run python -c "import os; from ingest.store import workspace_origin; print(workspace_origin(os.environ['DATABRICKS_HOST']))")
          host="${origin#https://}"
          echo "::add-mask::$host"
          warehouse=$(curl -sf -H "Authorization: Bearer $DATABRICKS_TOKEN" "$origin/api/2.0/sql/warehouses" \
            | uv run python -c "import json,sys; w=json.load(sys.stdin)['warehouses']; print(sorted(w, key=lambda x: x.get('creation_time', 0))[0]['id'])")
          echo "::add-mask::$warehouse"
          {
            echo "DBT_DATABRICKS_HOST=$host"
            echo "DBT_DATABRICKS_HTTP_PATH=/sql/1.0/warehouses/$warehouse"
            echo "DBT_DATABRICKS_WAREHOUSE_ID=$warehouse"
          } >> "$GITHUB_ENV"

      - name: Ensure every endpoint directory exists in the landing volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: uv run fs-ingest ensure-dirs --backend volume

      - name: dbt build
        id: build
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
          DBT_TARGET: databricks
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
          SELECT: ${{ inputs.select || env.PLAN_SELECT }}
          CHAOS: ${{ inputs.chaos }}
        run: |
          set -o pipefail
          args=(build --target databricks)
          [ "$FULL_REFRESH" = "true" ] && args+=(--full-refresh)
          [ -n "$SELECT" ] && args+=(--select "$SELECT")
          [ "$CHAOS" = "true" ] && args+=(--vars '{chaos: true}') && echo "::warning::chaos drill: one error-severity check will fail on purpose"
          # dbt exits non-zero on test failures; the gate step decides what that means.
          uv run dbt "${args[@]}" 2>&1 | tee land.log || true
          # A selected build ran only its own nodes' tests. The gate must still judge the whole
          # lakehouse before anything is published, so every quality check runs too, into its own
          # target directory; the gate step reads both.
          if [ -n "$SELECT" ]; then
            uv run dbt test --target databricks --select tag:quality --target-path target/quality 2>&1 | tee -a land.log || true
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dbt-run-results
          path: |
            dbt/target/run_results.json
            dbt/target/manifest.json
            dbt/target/quality/run_results.json
            dbt/target/quality/manifest.json
          retention-days: 14

      - name: Record results and decide the publish gate
        id: gate
        if: always() && steps.build.outcome != 'skipped'
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_ORIGIN: https://${{ env.DBT_DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ env.DBT_DATABRICKS_WAREHOUSE_ID }}
          SELECT: ${{ inputs.select || env.PLAN_SELECT }}
        run: |
          set -o pipefail
          uv run python -m ops.results --engine databricks --target-dir dbt/target --target-dir dbt/target/quality --selected "$SELECT" 2>&1 | tee -a land.log

      - name: Reconciliation summary (match and conflict rates per league and season)
        if: always() && steps.build.outcome != 'skipped'
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_ORIGIN: https://${{ env.DBT_DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ env.DBT_DATABRICKS_WAREHOUSE_ID }}
        run: uv run python -m ops.summary --engine databricks --table ops.reconciliation_summary

      # Only a passing gate publishes; a blocked gate leaves the previous build serving. The build
      # is staged first: the notebooks and the Tableau extract read it by id and are added to it,
      # and only then does latest.json point at it, so the live build is always complete.
      - name: Export gold to R2 (staged)
        id: export
        if: steps.gate.outcome == 'success'
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_ORIGIN: https://${{ env.DBT_DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ env.DBT_DATABRICKS_WAREHOUSE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # pipefail: without it tee's exit status hides a failed export and the job goes green.
        run: |
          set -o pipefail
          uv run fs-export build --engine databricks --store r2 --stage 2>&1 | tee export.log | tee -a land.log
          echo "build_id=$(sed -n 's/^staged //p' export.log | tail -1)" >> "$GITHUB_OUTPUT"

      # A failed notebook or extract does not hold back the day's data: the build is promoted
      # without it, and the Report step opens an incident naming the step.
      - name: Execute the analysis notebooks against the staged build and add them to it
        id: notebooks
        if: steps.export.outcome == 'success' && env.PLAN_LIGHT != 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FS_NOTEBOOK_SOURCE: published
          FS_READER_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          FS_BUILD_ID: ${{ steps.export.outputs.build_id }}
        run: |
          set -euo pipefail
          uv sync --frozen --group dbt --group notebooks
          echo "notebooks read build $FS_BUILD_ID"
          (cd notebooks && uv run jupyter nbconvert --to html --execute --output-dir _build --ExecutePreprocessor.timeout=1200 *.ipynb)
          uv run fs-export publish-files --store r2 --subdir notebooks --build-id "$FS_BUILD_ID" notebooks/_build/*.html notebooks/_build/*.findings.json

      - name: Refresh the Tableau extract and add it to the staged build
        id: extract
        if: steps.export.outcome == 'success' && env.PLAN_LIGHT != 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FS_NOTEBOOK_SOURCE: published
          FS_READER_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          FS_BUILD_ID: ${{ steps.export.outputs.build_id }}
        run: |
          set -euo pipefail
          uv run python tableau/extract.py --out tableau/extract
          uv run fs-export publish-files --store r2 --subdir tableau --build-id "$FS_BUILD_ID" tableau/extract/*.csv

      - name: Promote the build (latest.json points at it)
        id: promote
        if: steps.export.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILD_ID: ${{ steps.export.outputs.build_id }}
        run: |
          set -o pipefail
          uv run fs-export promote --store r2 --build-id "$BUILD_ID" 2>&1 | tee -a land.log

      # Tableau Public refreshes a Google Sheets source daily on its own, so the extract also goes
      # into the owner's sheet. Skips itself until the sheet id and the service account are set.
      - name: Push the extract to the League Pulse Google Sheet
        id: sheets
        if: steps.promote.outcome == 'success' && steps.extract.outcome == 'success'
        continue-on-error: true
        env:
          TABLEAU_SHEET_ID: ${{ vars.TABLEAU_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: uv run python tableau/sheets.py --extract tableau/extract

      # The incident covers every step, not just the build and the gate: a failed export,
      # promotion, notebook run, extract or sheet push opens (or keeps open) the incident and is
      # named in it. Only a run where every step that ran succeeded closes it.
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Build failure: dbt on Databricks"
          S_BUILD: ${{ steps.build.outcome }}
          S_GATE: ${{ steps.gate.outcome }}
          S_EXPORT: ${{ steps.export.outcome }}
          S_NOTEBOOKS: ${{ steps.notebooks.outcome }}
          S_EXTRACT: ${{ steps.extract.outcome }}
          S_PROMOTE: ${{ steps.promote.outcome }}
          S_SHEETS: ${{ steps.sheets.outcome }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_ORIGIN: https://${{ env.DBT_DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ env.DBT_DATABRICKS_WAREHOUSE_ID }}
          BUILD_ID: ${{ steps.export.outputs.build_id }}
          SELECTED: ${{ inputs.select || env.PLAN_SELECT }}
          LIGHT: ${{ env.PLAN_LIGHT }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SITE: https://fantasyscout.beronilla.rodeo
        run: |
          set -euo pipefail
          failed=""
          # these must succeed for the day's data to be live
          for step in "dbt build:$S_BUILD" "publish gate:$S_GATE" "export:$S_EXPORT" "promote:$S_PROMOTE"; do
            [ "${step##*:}" = "success" ] || failed="$failed, ${step%%:*} (${step##*:})"
          done
          # these may be skipped when an earlier step did not run, but must not fail
          for step in "notebooks:$S_NOTEBOOKS" "Tableau extract:$S_EXTRACT" "sheet push:$S_SHEETS"; do
            [ "${step##*:}" = "failure" ] && failed="$failed, ${step%%:*} (failure)"
          done
          if [ -n "$failed" ]; then OUTCOME=failure; else OUTCOME=success; fi
          DETAIL="Steps: dbt build $S_BUILD, gate $S_GATE, export $S_EXPORT, notebooks $S_NOTEBOOKS, extract $S_EXTRACT, promote $S_PROMOTE, sheet push $S_SHEETS."
          [ "${PLAN_LIGHT:-}" = "true" ] && DETAIL="Light build (the ingest landed the reports only; selector: $PLAN_SELECT). $DETAIL"
          [ -n "$failed" ] && DETAIL="Failed: ${failed#, }. $DETAIL"
          echo "$DETAIL"
          # One row per build in ops.build_log (run, trigger, gate, build id, step timings, rows)
          # and the same as this run's step summary. Never hides the incident.
          OUTCOME="$OUTCOME" uv run python -m ops.build_log --engine databricks --summary \
            || echo "::warning::the build log row was not recorded"
          OUTCOME="$OUTCOME" DETAIL="$DETAIL" uv run python .github/scripts/incident.py

  # An ingest that was cancelled or timed out (a self-hosted job queued until GitHub gave up on
  # it, a stats job killed at its limit) used to trigger nothing: no build, no issue. It opens an
  # incident instead; the next completed ingest closes it through the normal build's report.
  cancelled-ingest:
    name: Note a cancelled or timed-out ingest
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Ingest ${{ github.event.workflow_run.conclusion }}: no build ran"
          OUTCOME: failure
          AREA: area:ops
          DETAIL: "${{ github.event.workflow_run.name }} ended ${{ github.event.workflow_run.conclusion }} (${{ github.event.workflow_run.html_url }}), so no build ran. A self-hosted job that found no runner is cancelled after a day in the queue: check the home runners (infra/runner). Run Ingest again by hand; the next build's report closes this."
        run: uv run python .github/scripts/incident.py

  bundle:
    name: Deploy the Asset Bundle
    needs: dbt
    runs-on: ubuntu-latest
    environment: lakehouse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: databricks/setup-cli@9625fdde9ba2607df0087e0d3ec7449198bf2180 # v1.23.0
      - name: Validate and deploy
        working-directory: bundles
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          RAW_HOST: ${{ secrets.DATABRICKS_HOST }}
        run: |
          set -euo pipefail
          export DATABRICKS_HOST=$(uv run python -c "import os; from ingest.store import workspace_origin; print(workspace_origin(os.environ['RAW_HOST']))")
          warehouse=$(curl -sf -H "Authorization: Bearer $DATABRICKS_TOKEN" "$DATABRICKS_HOST/api/2.0/sql/warehouses" \
            | uv run python -c "import json,sys; w=json.load(sys.stdin)['warehouses']; print(sorted(w, key=lambda x: x.get('creation_time', 0))[0]['id'])")
          echo "::add-mask::$warehouse"
          databricks bundle validate -t prod --var "warehouse_id=$warehouse"
          databricks bundle deploy   -t prod --var "warehouse_id=$warehouse"
          databricks bundle summary  -t prod --var "warehouse_id=$warehouse" | sed -E 's#https://[^/]+#https://<workspace>#g'
