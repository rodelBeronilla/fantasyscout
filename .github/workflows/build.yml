name: Build lakehouse

# dbt build on Databricks: bronze and silver (and, from phase 3, gold and ops) over the landed
# volume. Runs after every Ingest or Backfill that finishes, even one with a failed job, so one
# failed request does not cost the day's build: the failed job has its own incident, and the
# completeness check only counts a game missing once it has been final for more than a day
# (the next daily window fetches it again). A cancelled run does not trigger a build. Runs by
# hand too. A failed build opens or updates a data-incident issue; the next passing build
# closes it. An ingest that landed only the injury reports and the other evening feeds (the
# 23:00 UTC schedule) gets a light build: those feeds' models and everything downstream of them
# (the board and streamers included), with every quality check; the notebooks and the Tableau
# extract are carried from the last full build, which the morning's full build refreshes.

on:
  workflow_run:
    workflows: [Ingest, Backfill]
    types: [completed]
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Rebuild incremental models from scratch
        type: boolean
        default: false
      select:
        description: dbt selector (default everything)
        type: string
        default: ""
      deploy_bundle:
        description: Also deploy the paused Asset Bundle job (ADR 0013; the fallback for an Actions outage)
        type: boolean
        default: false
      chaos:
        description: Chaos drill, fail one error-severity check on purpose to prove the gate and the incident path
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

# The build holds the lakehouse group, so a hung warehouse statement would block the next
# day's build for six hours without the job timeout; at the limit the job is cancelled, the
# Report step still runs (if: always()) and opens the incident with the step that hung.
# One group with Export data: both promote (a read-modify-write of builds.json) and prune (deletes
# by a build's key list), so they never run at the same time.
concurrency:
  group: r2-publish
  cancel-in-progress: false

jobs:
  # Any finished ingest or backfill builds what landed. A cancelled one too (#403): Ingest and
  # Backfill share the stats concurrency groups, and GitHub cancels a pending job when a third
  # queues, so a cancelled daily ingest may still have landed the ESPN feeds and the reports.
  dbt:
    name: dbt build on Databricks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: lakehouse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-uv
        with:
          groups: "dbt"

      - name: Read what the ingest landed
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: ingest-plan
          path: ingest-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Choose a full or a light build
        if: github.event_name == 'workflow_run'
        run: |
          source=$(uv run python -c "import json,sys; print(json.load(open('ingest-plan/ingest-plan.json'))['source'])" 2>/dev/null || echo "unknown")
          echo "the ingest landed: $source"
          if [ "$source" = "reports" ]; then
            echo "PLAN_SELECT=tag:feed_reports+ path:models/ops" >> "$GITHUB_ENV"
            echo "PLAN_LIGHT=true" >> "$GITHUB_ENV"
            echo "::notice::light build: the evening ingest landed the reports only, so the build covers those feeds' models and their consumers; the notebooks and the Tableau extract are carried from the last full build until the morning's"
          fi

      - name: Note an ingest that ended with a failed job
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
        run: |
          echo "::warning::$RUN_NAME ended with a failed job ($RUN_URL); building with what landed. That job's incident tracks it."
          echo "$RUN_NAME ended with a failed job: $RUN_URL. Building with what landed." >> land.log

      - name: Resolve the workspace host and SQL warehouse
        uses: ./.github/actions/databricks-context
        with:
          host: ${{ secrets.DATABRICKS_HOST }}
          token: ${{ secrets.DATABRICKS_TOKEN }}
          warehouse-id: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
      # The serverless warehouse takes about 23 s to wake, which the first bronze models used to
      # wait for. Starting it here (the call returns at once) overlaps the wake with the next step
      # and dbt's parse (#447); a warehouse already running ignores it.
      # Start the warehouse and wait until it can take statements; a refused start is retried for
      # up to twenty minutes with its reason logged, so a warehouse that is slow to come up no
      # longer fails the build at its first dbt session (#782).
      - name: Start the SQL warehouse and wait for it
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: uv run python -m ops.warehouse start --wait 1200
      - name: Ensure every endpoint directory exists in the landing volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: uv run fs-ingest ensure-dirs --backend volume

      - name: dbt build
        id: build
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
          DBT_TARGET: databricks
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
          SELECT: ${{ inputs.select || env.PLAN_SELECT }}
          CHAOS: ${{ inputs.chaos }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          args=(build --target databricks)
          [ "$FULL_REFRESH" = "true" ] && args+=(--full-refresh)
          [ -n "$SELECT" ] && args+=(--select "$SELECT")
          # A season a Backfill run is still landing is left out of assert_completeness until it
          # finishes (#420); the step names each one in a notice.
          runs=$(gh run list -R "$GITHUB_REPOSITORY" -w backfill.yml -L 20 --json status,displayTitle) || runs='[]'
          vars=$(echo "$runs" | (cd .. && uv run python -m ops.backfilling)) || vars='{"backfilling": []}'
          if [ "$CHAOS" = "true" ]; then
            vars=$(echo "$vars" | jq -c '. + {chaos: true}')
            echo "::warning::chaos drill: one error-severity check will fail on purpose"
          fi
          args+=(--vars "$vars")
          # dbt exits non-zero on test failures; the gate step decides what that means.
          uv run dbt "${args[@]}" 2>&1 | tee land.log || true
          # A selected build ran only its own nodes' tests. The gate must still judge the whole
          # lakehouse before anything is published, so every quality check runs too, into its own
          # target directory; the gate step reads both.
          if [ -n "$SELECT" ]; then
            uv run dbt test --target databricks --select tag:quality --vars "$vars" --target-path target/quality 2>&1 | tee -a land.log || true
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dbt-run-results
          path: |
            dbt/target/run_results.json
            dbt/target/manifest.json
            dbt/target/quality/run_results.json
            dbt/target/quality/manifest.json
          retention-days: 14

      - name: Record results and decide the publish gate
        id: gate
        if: always() && steps.build.outcome != 'skipped'
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_ORIGIN: https://${{ env.DBT_DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ env.DBT_DATABRICKS_WAREHOUSE_ID }}
          SELECT: ${{ inputs.select || env.PLAN_SELECT }}
        run: |
          set -o pipefail
          uv run python -m ops.results --engine databricks --target-dir dbt/target --target-dir dbt/target/quality --selected "$SELECT" 2>&1 | tee -a land.log

      # A warn check that warned in each of the last five builds opens "Build warnings that
      # persist" at P2; a build without one closes it (#421).
      - name: Warnings that persist across builds
        id: chronic
        if: always() && steps.gate.outcome == 'success'
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_ORIGIN: https://${{ env.DBT_DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ env.DBT_DATABRICKS_WAREHOUSE_ID }}
        run: uv run python -m ops.chronic --engine databricks
      - name: Report warnings that persist
        if: always() && steps.chronic.outcome == 'success'
        uses: ./.github/actions/incident
        with:
          title: "Build warnings that persist"
          outcome: ${{ steps.chronic.outputs.checks == '' && 'success' || 'failure' }}
          detail: ${{ steps.chronic.outputs.detail }}
          area: area:quality
          priority: P2-medium
          log: chronic.log
          token: ${{ github.token }}

      - name: Reconciliation summary (match and conflict rates per league and season)
        if: always() && steps.build.outcome != 'skipped'
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_ORIGIN: https://${{ env.DBT_DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ env.DBT_DATABRICKS_WAREHOUSE_ID }}
        run: uv run python -m ops.summary --engine databricks --table ops.reconciliation_summary

      # Only a passing gate publishes; a blocked gate leaves the previous build serving. The build
      # is staged first: the notebooks and the Tableau extract read it by id and are added to it,
      # and only then does latest.json point at it, so the live build is always complete. A failed
      # notebook or extract does not hold back the day's data: the build is promoted without it,
      # and the report opens an incident naming the step (.github/actions/publish-build).
      - name: Publish the build (stage, notebooks, extract, promote)
        id: publish
        if: steps.gate.outcome == 'success'
        uses: ./.github/actions/publish-build
        with:
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          reader-key: ${{ secrets.CI_READER_KEY }}
          light: ${{ env.PLAN_LIGHT || 'false' }}

      # Tableau Public refreshes a Google Sheets source daily on its own, so the extract also goes
      # into the owner's sheet. Skips itself until the sheet id and the service account are set.
      - name: Push the extract to the League Pulse Google Sheet
        id: sheets
        if: steps.publish.outputs.promote == 'success' && steps.publish.outputs.extract == 'success'
        continue-on-error: true
        env:
          TABLEAU_SHEET_ID: ${{ vars.TABLEAU_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: uv run python tableau/sheets.py --extract tableau/extract

      # The incident covers every step, not just the build and the gate: a failed export,
      # promotion, notebook run, extract or sheet push opens (or keeps open) the incident and is
      # named in it. Only a run where every step that ran succeeded closes it.
      - name: Decide the outcome and record the build
        if: always()
        env:
          S_BUILD: ${{ steps.build.outcome }}
          S_GATE: ${{ steps.gate.outcome }}
          S_EXPORT: ${{ steps.publish.outputs.export || steps.publish.outcome }}
          S_NOTEBOOKS: ${{ steps.publish.outputs.notebooks || 'skipped' }}
          S_EXTRACT: ${{ steps.publish.outputs.extract || 'skipped' }}
          S_PROMOTE: ${{ steps.publish.outputs.promote || steps.publish.outcome }}
          S_SHEETS: ${{ steps.sheets.outcome }}
          # ops.build_log reads the run's step timings from the Actions API (#407)
          GH_TOKEN: ${{ github.token }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_ORIGIN: https://${{ env.DBT_DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ env.DBT_DATABRICKS_WAREHOUSE_ID }}
          BUILD_ID: ${{ steps.publish.outputs.build_id }}
          SELECTED: ${{ inputs.select || env.PLAN_SELECT }}
          LIGHT: ${{ env.PLAN_LIGHT }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SITE: https://fantasyscout.beronilla.rodeo
        run: |
          set -euo pipefail
          failed=""
          # these must succeed for the day's data to be live
          for step in "dbt build:$S_BUILD" "publish gate:$S_GATE" "export:$S_EXPORT" "promote:$S_PROMOTE"; do
            [ "${step##*:}" = "success" ] || failed="$failed, ${step%%:*} (${step##*:})"
          done
          # these may be skipped when an earlier step did not run, but must not fail
          for step in "notebooks:$S_NOTEBOOKS" "Tableau extract:$S_EXTRACT" "sheet push:$S_SHEETS"; do
            [ "${step##*:}" = "failure" ] && failed="$failed, ${step%%:*} (failure)"
          done
          if [ -n "$failed" ]; then OUTCOME=failure; else OUTCOME=success; fi
          # The incident names the first step that failed; its area and priority follow from the
          # name (.github/scripts/incident.py): a failure after the promotion is P2, the data is live (#422).
          first="${failed#, }"; first="${first%%,*}"; first="${first% (*}"
          TITLE="Build failure: ${first:-dbt build}"
          DETAIL="Steps: dbt build $S_BUILD, gate $S_GATE, export $S_EXPORT, notebooks $S_NOTEBOOKS, extract $S_EXTRACT, promote $S_PROMOTE, sheet push $S_SHEETS."
          [ "${PLAN_LIGHT:-}" = "true" ] && DETAIL="Light build (the ingest landed the reports only; selector: $PLAN_SELECT). $DETAIL"
          [ -n "$failed" ] && DETAIL="Failed: ${failed#, }. $DETAIL"
          echo "$DETAIL"
          # One row per build in ops.build_log (run, trigger, gate, build id, step timings, rows)
          # and the same as this run's step summary. Never hides the incident.
          OUTCOME="$OUTCOME" uv run python -m ops.build_log --engine databricks --summary \
            || echo "::warning::the build log row was not recorded"
          {
            echo "BUILD_OUTCOME=$OUTCOME"
            echo "BUILD_DETAIL=$DETAIL"
            echo "BUILD_TITLE=$TITLE"
          } >> "$GITHUB_ENV"
      - name: Report
        if: always()
        uses: ./.github/actions/incident
        with:
          title: "${{ env.BUILD_TITLE || 'Build failure: dbt build' }}"
          close-prefix: "Build failure"
          outcome: ${{ env.BUILD_OUTCOME || 'failure' }}
          detail: ${{ env.BUILD_DETAIL }}
          token: ${{ github.token }}
      # A passing build also closes the "no build ran" incidents a cancelled or timed-out ingest
      # opened (the cancelled-ingest job below): the incident action closes only the issue that
      # carries the same title, so each title is named here (#413).
      - name: Close a cancelled-ingest incident
        if: always() && env.BUILD_OUTCOME == 'success'
        uses: ./.github/actions/incident
        with:
          title: "Ingest cancelled: no build ran"
          outcome: success
          token: ${{ github.token }}
      - name: Close a timed-out-ingest incident
        if: always() && env.BUILD_OUTCOME == 'success'
        uses: ./.github/actions/incident
        with:
          title: "Ingest timed_out: no build ran"
          outcome: success
          token: ${{ github.token }}

  # An ingest that was cancelled or timed out (a self-hosted job queued until GitHub gave up on
  # it, a stats job killed at its limit) still builds what landed (the dbt job above). When that
  # build did not complete either, nothing ran: this opens an incident, and the next passing build
  # closes it (the two close steps above). A build that ran and failed opens its own incident.
  cancelled-ingest:
    name: Note a cancelled or timed-out ingest
    needs: dbt
    if: >-
      always() &&
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out') &&
      needs.dbt.result != 'success' && needs.dbt.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-uv
      - name: Report
        uses: ./.github/actions/incident
        with:
          token: ${{ github.token }}
          title: "Ingest ${{ github.event.workflow_run.conclusion }}: no build ran"
          outcome: failure
          area: area:ops
          detail: "${{ github.event.workflow_run.name }} ended ${{ github.event.workflow_run.conclusion }} (${{ github.event.workflow_run.html_url }}), so no build ran. A self-hosted job that found no runner is cancelled after a day in the queue: check the home runners (infra/runner). Run Ingest by hand with source espn (then reports) so a build runs without the runner, and source stats with since set to the first missed day once the runner is back (runbook, Home runner offline); the next passing build closes this."

  # The bundle is the paused fallback (ADR 0013): deployed on a dispatch that asks for it, never
  # after a nightly build, so a slow deploy can no longer hold a run open after the data went live.
  bundle:
    name: Deploy the Asset Bundle
    needs: dbt
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: lakehouse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-uv
      - name: Resolve the workspace host and SQL warehouse
        uses: ./.github/actions/databricks-context
        with:
          host: ${{ secrets.DATABRICKS_HOST }}
          token: ${{ secrets.DATABRICKS_TOKEN }}
          warehouse-id: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
      - uses: databricks/setup-cli@9625fdde9ba2607df0087e0d3ec7449198bf2180 # v1.23.0
      - name: Validate and deploy
        working-directory: bundles
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: ${{ env.DATABRICKS_ORIGIN }}
        run: |
          set -euo pipefail
          databricks bundle validate -t prod --var "warehouse_id=$DATABRICKS_WAREHOUSE_ID"
          databricks bundle deploy   -t prod --var "warehouse_id=$DATABRICKS_WAREHOUSE_ID"
          databricks bundle summary  -t prod --var "warehouse_id=$DATABRICKS_WAREHOUSE_ID" | sed -E 's#https://[^/]+#https://<workspace>#g'
