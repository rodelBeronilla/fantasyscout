name: Query the lakehouse

# Read-only: prints the rows of one table (or a filtered slice of it) into the job log, for
# looking at silver and ops tables without a SQL console. Runs on a GitHub-hosted runner.

on:
  workflow_dispatch:
    inputs:
      table:
        description: Table, schema-qualified (for example silver.team_xwalk)
        type: string
        required: true
      columns:
        description: Columns to print
        type: string
        default: "*"
      where:
        description: Filter (SQL, without the keyword), optional
        type: string
        default: ""
      order_by:
        description: Sort (SQL, without the keywords)
        type: string
        default: "1"
      limit:
        description: Maximum rows printed
        type: string
        default: "200"

permissions:
  contents: read

jobs:
  query:
    name: ${{ inputs.table }}
    runs-on: ubuntu-latest
    environment: lakehouse
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-uv
      - name: Resolve the workspace host and SQL warehouse
        uses: ./.github/actions/databricks-context
        with:
          host: ${{ secrets.DATABRICKS_HOST }}
          token: ${{ secrets.DATABRICKS_TOKEN }}
          warehouse-id: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
      - name: Query
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          TABLE: ${{ inputs.table }}
          COLUMNS: ${{ inputs.columns }}
          WHERE: ${{ inputs.where }}
          ORDER_BY: ${{ inputs.order_by }}
          LIMIT: ${{ inputs.limit }}
        run: |
          uv run python -m ops.summary --engine databricks --strict --table "$TABLE" --columns "$COLUMNS" \
            --where "$WHERE" --order-by "$ORDER_BY" --limit "$LIMIT"
