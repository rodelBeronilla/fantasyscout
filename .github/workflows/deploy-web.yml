name: Deploy web

# preprod -> wrangler environment "preview"    (Worker fantasyscout-preview on workers.dev)
# main    -> wrangler environment "production" (Worker fantasyscout on fantasyscout.beronilla.rodeo)
# Runs when CI has passed on this repository's own push to main or preprod (never on a fork's
# branch of the same name), and ships the very build CI tested (the
# web-dist and dbt-docs artifacts of that run), so nothing goes live that CI did not check and
# nothing is built twice. A push that touched neither the app, the Worker, the data the pages
# are built from (web/, worker/, the schema file) nor the dbt project is not deployed; a dbt-only
# change deploys so the dbt docs at /docs/, which ship with the site, follow it (#475). The deploy copies the Yahoo
# credentials and the owner's id into each Worker as secrets (ADR 0007, 0008); everything else
# needs only the Cloudflare token and account id.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, preprod]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Deploy ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'preview' }}
    # Only this repository's own pushes deploy: workflow_run filters on the head branch's NAME, so
    # without the repository and event checks a fork's branch called main whose CI passed would
    # ship the fork's code with production secrets (#423).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'preview' }}
    env:
      WRANGLER_ENV: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Did this push touch the site?
        id: touched
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only HEAD^ HEAD -- web worker dbt .github/workflows/deploy-web.yml | head -20)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::nothing under web/, worker/, dbt/ or the deploy workflow changed; no deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.touched.outputs.deploy == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            worker/package-lock.json

      # The build CI tested, on a workflow_run; a dispatch builds it here.
      - name: Take the web build from the CI run
        if: steps.touched.outputs.deploy == 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: web/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Take the dbt docs from the CI run
        if: steps.touched.outputs.deploy == 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dbt-docs
          path: web/dist/docs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Build web (dispatch only)
        if: steps.touched.outputs.deploy == 'true' && github.event_name == 'workflow_dispatch'
        working-directory: web
        env:
          PUBLIC_TABLEAU_VIZ_URL: ${{ vars.TABLEAU_VIZ_URL }}
        run: |
          npm ci
          PUBLIC_BUILD_ID="${GITHUB_SHA::7}" npm run build
      - uses: ./.github/actions/setup-uv
        if: steps.touched.outputs.deploy == 'true' && github.event_name == 'workflow_dispatch'
        with:
          groups: "dbt"
      - name: Generate dbt docs (dispatch only)
        if: steps.touched.outputs.deploy == 'true' && github.event_name == 'workflow_dispatch'
        env:
          DBT_PROFILES_DIR: .
        run: |
          set -euo pipefail
          uv run python dbt/sample/build_sample.py >/dev/null
          (cd dbt && uv run dbt build --target duckdb --exclude tag:quality >/dev/null && uv run dbt docs generate --target duckdb >/dev/null)
          mkdir -p web/dist/docs
          cp dbt/target/index.html dbt/target/manifest.json dbt/target/catalog.json web/dist/docs/
          # The docs are generated from the CI fixture sample, not the lakehouse: say so at the top,
          # as CI does for the docs a normal deploy ships (#625).
          uv run python -m ops.docs_banner web/dist/docs/index.html
          grep -q "fixture sample" web/dist/docs/index.html
      - name: The build is in place
        if: steps.touched.outputs.deploy == 'true'
        run: ls -la web/dist/docs && test -f web/dist/index.html

      - name: Install web dependencies (the Worker's CSP step reads the build)
        if: steps.touched.outputs.deploy == 'true'
        working-directory: web
        run: npm ci

      - name: Install worker dependencies and collect the CSP hashes of the build
        if: steps.touched.outputs.deploy == 'true'
        working-directory: worker
        run: |
          npm ci
          npm run csp

      - name: Ensure the R2 bucket exists
        if: steps.touched.outputs.deploy == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 bucket info fantasyscout-data >/dev/null 2>&1 \
            || npx wrangler r2 bucket create fantasyscout-data

      # DuckDB-WASM (two wasm files of 36 and 41 MB plus their workers) exceeds the static asset
      # limit, so the SQL console loads it from the data bucket, same origin. Uploaded once per version.
      # (wrangler's r2 object commands default to local storage; --remote targets the real bucket.)
      - name: Vendor DuckDB-WASM into the data bucket
        if: steps.touched.outputs.deploy == 'true'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ver=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@duckdb/duckdb-wasm/package.json', 'utf8')).version")
          dir="node_modules/@duckdb/duckdb-wasm/dist"
          for f in duckdb-mvp.wasm duckdb-eh.wasm duckdb-browser-mvp.worker.js duckdb-browser-eh.worker.js; do
            key="vendor/duckdb-wasm/$ver/$f"
            if npx wrangler r2 object get "fantasyscout-data/$key" --remote --file /dev/null >/dev/null 2>&1; then
              echo "$key already in the bucket"
            else
              case "$f" in *.wasm) ct=application/wasm ;; *) ct=text/javascript ;; esac
              npx wrangler r2 object put "fantasyscout-data/$key" --remote --file "$dir/$f" --content-type "$ct"
            fi
          done

      - name: Deploy Worker
        id: deploy
        if: steps.touched.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # YAHOO_IMPORT (repository variable) opens the Yahoo league import once Yahoo approves the app;
          # OWNER_YAHOO_GUID, the owner's Yahoo account (ADR 0008), is an Actions secret and reaches the
          # Worker with the other secrets below; it is never passed with --var, which would print it (#435).
          command: deploy --env ${{ env.WRANGLER_ENV }}${{ vars.YAHOO_IMPORT && format(' --var YAHOO_IMPORT:{0}', vars.YAHOO_IMPORT) || '' }}

      # The Yahoo app's credentials sign the owner in, which guards the private Parquet tables
      # (ADR 0008), and serve the optional league import (ADR 0007). They come from Actions
      # secrets; without them the tables are closed to everyone, the notebooks included.
      - name: Give the Worker the Yahoo app's credentials, when they are set
        if: steps.touched.outputs.deploy == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          # The owner's Yahoo account, kept as a secret (a repository variable of the same name works too).
          OWNER_YAHOO_GUID: ${{ secrets.OWNER_YAHOO_GUID }}
          # CI's own reader key (#429): once set, the only bearer key the Parquet tables accept.
          CI_READER_KEY: ${{ secrets.CI_READER_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$YAHOO_CLIENT_ID" ] || [ -z "$YAHOO_CLIENT_SECRET" ]; then
            echo "::warning::YAHOO_CLIENT_ID and YAHOO_CLIENT_SECRET are not set: nobody can sign in as the owner, and the Parquet tables are closed to everyone"
            exit 0
          fi
          umask 077
          jq -n --arg id "$YAHOO_CLIENT_ID" --arg secret "$YAHOO_CLIENT_SECRET" --arg owner "$OWNER_YAHOO_GUID" --arg reader "$CI_READER_KEY" \
            '{YAHOO_CLIENT_ID: $id, YAHOO_CLIENT_SECRET: $secret, OWNER_YAHOO_GUID: $owner, CI_READER_KEY: $reader} | with_entries(select(.value != ""))' \
            > "$RUNNER_TEMP/yahoo.json"
          npx wrangler secret bulk "$RUNNER_TEMP/yahoo.json" --env "$WRANGLER_ENV"
          rm -f "$RUNNER_TEMP/yahoo.json"

      - name: Smoke test
        if: steps.touched.outputs.deploy == 'true'
        env:
          URL: ${{ env.BRANCH == 'main' && 'https://fantasyscout.beronilla.rodeo' || steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          echo "deployed to $URL"
          # A new Worker, DNS record or certificate can take a little while to appear.
          for attempt in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/" || echo 000)
            [ "$code" = "200" ] && break
            echo "attempt $attempt: / returned $code, retrying in 5 s"
            sleep 5
          done
          [ "$code" = "200" ] || { echo "::error::/ returned $code"; exit 1; }
          # Save the page first: piping into grep -q under pipefail fails once the page is larger
          # than what curl has written when grep finds its match and exits.
          curl -s "$URL/" -o home.html
          grep -q "FantasyScout" home.html || { echo "::error::placeholder text missing"; exit 1; }
          # The asset layer serves the pages and bundles without the Worker, with the headers the
          # deploy wrote into _headers (#442): the page keeps its policy, a bundle is kept a year.
          curl -sI "$URL/" | tr -d '\r' > home.headers
          grep -qi "^content-security-policy: default-src 'self'" home.headers || { echo "::error::/ has no Content-Security-Policy"; exit 1; }
          bundle=$(grep -oE '/_astro/[^"]+\.js' home.html | head -1)
          [ -n "$bundle" ] || { echo "::error::no /_astro/ bundle on /"; exit 1; }
          curl -sI "$URL$bundle" | tr -d '\r' | grep -qi '^cache-control: public, max-age=31536000, immutable' \
            || { echo "::error::$bundle is not served with a year's immutable cache"; exit 1; }
          for path in /docs/ /docs/manifest.json /docs/catalog.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL$path")
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          latest=$(curl -s -o latest.json -w '%{http_code}' "$URL/data/latest.json")
          # Production has served a build since 2026-10-27, so on main anything but 200 with a
          # build id is a Worker or bucket fault (#401). A preview may point at a bucket that has
          # no build yet, where 404 is the right answer.
          if [ "$BRANCH" = "main" ]; then
            [ "$latest" = "200" ] || { echo "::error::latest.json returned $latest"; exit 1; }
            python3 -c 'import json, sys; assert json.load(open("latest.json"))["build_id"]' \
              || { echo "::error::latest.json has no build_id"; exit 1; }
          else
            [ "$latest" = "200" ] || [ "$latest" = "404" ] || { echo "::error::latest.json returned $latest"; exit 1; }
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/yahoo/status")
          [ "$code" = "200" ] || { echo "::error::/api/yahoo/status returned $code"; exit 1; }
          echo "::notice::$URL/ is serving (latest.json: $latest)"

      # The spec's budget: pages load from R2 data in under 2 s on 4G. Lighthouse's default mobile
      # profile simulates a slow 4G link with a 4x CPU slowdown, stricter than a plain 4G test.
      # A shared runner's CPU and network vary from run to run, so the page is measured three
      # times and the budget applies to the median.
      - name: Lighthouse (mobile, simulated 4G, median of three; home and Schema under the budget, Streamers reported)
        if: steps.touched.outputs.deploy == 'true'
        env:
          URL: ${{ env.BRANCH == 'main' && 'https://fantasyscout.beronilla.rodeo' || steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          # The budget holds the home page and the Schema page (one row per model since #449, the
          # diagrams loaded as they come into view). Streamers' largest paint is its data (the season
          # note or the week's games), which follows the React runtime and a second wave of modules
          # (#562, #563); it is measured and reported until it is under the budget, then enforced.
          # A run whose trace Chrome fails to record (NO_NAVSTART) is tried again, up to three
          # times, rather than failing the deploy (#623).
          # The edge injects Cloudflare's analytics beacon into production pages (a module script
          # from a third origin, and its /cdn-cgi/rum call); the preview has none. Lighthouse's
          # simulation charges the new origin's connection to the paint, which put production about
          # 0.4 s behind the same build's preview and made Schema flap around the budget, while a
          # real-throttled run paints production no later (#630). The budget is for this site's own
          # page, so these runs block the beacon.
          lh() {
            for attempt in 1 2 3; do
              npx --yes lighthouse@12.8.2 "$@" && return 0
              echo "::warning::Lighthouse run failed (attempt $attempt of 3)"
            done
            return 1
          }
          for page in home streamers schema; do
            case "$page" in home) path="/";; streamers) path="/streamers/";; schema) path="/schema/";; esac
            for i in 1 2 3; do
              lh "$URL$path" --quiet --chrome-flags="--headless=new --no-sandbox" \
                --blocked-url-patterns="*cloudflareinsights*" --blocked-url-patterns="*/cdn-cgi/rum*" \
                --only-categories=performance --output=json --output-path="./lh-$page-$i.json"
            done
          done
          node -e '
            const pick = (r) => ({
              perf: Math.round(r.categories.performance.score * 100),
              lcp: r.audits["largest-contentful-paint"].numericValue,
              tti: r.audits["interactive"].numericValue,
              si: r.audits["speed-index"].numericValue,
            });
            let failed = false;
            for (const [page, enforced] of [["home", true], ["streamers", false], ["schema", true]]) {
              const all = [1, 2, 3].map((i) => pick(require(`./lh-${page}-${i}.json`)));
              for (const m of all) console.log(`${page}: performance ${m.perf} | LCP ${Math.round(m.lcp)} ms | TTI ${Math.round(m.tti)} ms | speed index ${Math.round(m.si)} ms`);
              const lcp = all.map((m) => m.lcp).sort((a, b) => a - b)[1];
              console.log(`${page}: median LCP ${Math.round(lcp)} ms`);
              if (lcp > 2000) {
                if (enforced) { console.error(`::error::${page}: median LCP over the 2 s budget`); failed = true; }
                else console.log(`::warning::${page}: median LCP over the 2 s budget (reported, not enforced yet)`);
              }
            }
            if (failed) process.exit(1);
          '

      # The LCP above can be the "Loading" line rather than the board (#436). This run applies the
      # throttling (slow 4G, 4x CPU) for real and reads the page's own mark for its first rows,
      # fs:first-row; reported against a 1.8 s budget until it is under it on production.
      - name: First rows on a throttled phone (home and Streamers, median of three, reported)
        if: steps.touched.outputs.deploy == 'true'
        env:
          URL: ${{ env.BRANCH == 'main' && 'https://fantasyscout.beronilla.rodeo' || steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          # as above: a run that fails to record its trace is tried again (#623)
          lh() {
            for attempt in 1 2 3; do
              npx --yes lighthouse@12.8.2 "$@" && return 0
              echo "::warning::Lighthouse run failed (attempt $attempt of 3)"
            done
            return 1
          }
          for page in home streamers; do
            case "$page" in home) path="/?league=nba";; streamers) path="/streamers/?league=nba";; esac
            for i in 1 2 3; do
              lh "$URL$path" --quiet --chrome-flags="--headless=new --no-sandbox" \
                --only-categories=performance --throttling-method=devtools --output=json --output-path="./fr-$page-$i.json"
            done
          done
          node -e '
            for (const page of ["home", "streamers"]) {
              const marks = [1, 2, 3].map((i) => {
                const r = require(`./fr-${page}-${i}.json`);
                const items = (r.audits["user-timings"] && r.audits["user-timings"].details && r.audits["user-timings"].details.items) || [];
                const m = items.find((x) => x.name === "fs:first-row");
                return m ? m.startTime : null;
              });
              const got = marks.filter((x) => x !== null).sort((a, b) => a - b);
              console.log(`${page}: first rows at ${marks.map((x) => (x === null ? "none" : Math.round(x) + " ms")).join(", ")}`);
              if (!got.length) { console.log(`::warning::${page}: no fs:first-row mark (page failed to load its rows?)`); continue; }
              const median = got[Math.floor(got.length / 2)];
              console.log(`${page}: median first rows ${Math.round(median)} ms`);
              if (median > 1800) console.log(`::warning::${page}: first rows at ${Math.round(median)} ms, over the 1.8 s budget (reported, not enforced yet)`);
            }
          '
