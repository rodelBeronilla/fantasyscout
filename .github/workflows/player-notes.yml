name: Player notes

# A call and a one-line note for each flagged player (#823; ADR 0017), in one job on the home
# runner, the only place the local model is. The flagged players, their numbers and the recent
# news about them (the claims and feed items) are read from the published build; the model writes
# a call and one line each; and the check re-reads every line against its inputs and merges the
# lines that pass into the published file. The inputs and the drafts hold source text (headlines,
# feed items, what the news claims), which never leaves the lakehouse and the owner-only storage:
# they pass between the steps on the runner's disk and are never uploaded, and nothing else is
# uploaded either (a published line may quote a headline; it is on the site, not in an artifact).
# A line with a number or a quotation that is not in its inputs is dropped and logged by its
# reasons, never published. When the model is away the run drafts nothing, the published lines
# stand, and the file says the model was away (Data Health shows it).
#
# Two kinds of run (#879). The daily run drafts every flagged player. After each build (the
# morning's, and the evening report runs' light builds at 22:41, 23:47 and 02:17 UTC, when the
# late scratches land) a changed run drafts only the players whose listing or flagged headline is
# not the one their line was written on, or who have none: the late changes get a line before
# tip-off. The pages mark a line whose inputs changed and withdraw one the news contradicts.
#
# The runner reaches the published build (the site, and DuckDB's extension host for httpfs) and
# R2 (the Cloudflare API) through its egress proxy (infra/runner/squid.conf).

on:
  schedule:
    # daily, after the morning ingest, its build and its export, and the news claims
    - cron: "20 17 * * *"
  # after each published build: the changed run
  workflow_run:
    workflows: [Build lakehouse]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: daily (every flagged player) or changed (those whose line no longer holds)
        type: choice
        options: [daily, changed]
        default: daily
      publish:
        description: Publish the lines (off, a dry run that prints the counts and reasons only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: player-notes
  cancel-in-progress: false

jobs:
  notes:
    name: Pick, write and check the lines
    # a build that failed published nothing new: no changed run after it
    if: >-
      vars.STATS_RUNNER_LABEL != '' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    # the home runner: the model runs beside it (infra/runner/compose.yml, the ai service)
    runs-on: ${{ fromJSON(format('["self-hosted","{0}"]', vars.STATS_RUNNER_LABEL)) }}
    timeout-minutes: 120
    # it holds the CI reader key for the build's tables (#429) and the R2 credentials
    environment: lakehouse
    env:
      MODE: ${{ github.event_name == 'workflow_run' && 'changed' || inputs.mode || 'daily' }}
    # the inputs and drafts sit in $RUNNER_TEMP/player-notes, on the runner's disk only, and are
    # removed when the job ends
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-uv
      - name: Pick the players and their news
        env:
          FS_NOTEBOOK_SOURCE: published
          FS_READER_KEY: ${{ secrets.CI_READER_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/player-notes"
          uv run python -m ai.player_notes inputs --source published --mode "$MODE" --out "$RUNNER_TEMP/player-notes/inputs.json"
      - name: Draft a call and a line per player
        run: uv run python -m ai.player_notes draft --inputs "$RUNNER_TEMP/player-notes/inputs.json" --out "$RUNNER_TEMP/player-notes/draft.json"
      - name: Check every line and publish the ones that pass
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STORE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.publish) && 'r2' || 'local' }}
        run: |
          uv run python -m ai.player_notes publish --inputs "$RUNNER_TEMP/player-notes/inputs.json" \
            --draft "$RUNNER_TEMP/player-notes/draft.json" --store "$STORE" --out "$RUNNER_TEMP/player-notes/published"
      - name: Leave no source text on the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/player-notes"
