name: Ingest

# Lands raw payloads in the Unity Catalog volume. ESPN runs on GitHub-hosted runners.
# The league stats API does not answer GitHub's address ranges (ADR 0002), so that job
# runs only when a self-hosted runner label is configured in the repository variable
# STATS_RUNNER_LABEL. The leagues' official injury reports run on GitHub-hosted runners too.
# A failed run opens or updates a data-incident issue; the next passing run closes it.

on:
  schedule:
    # GitHub starts scheduled runs late on busy minutes and hours (observed 2026-10-27 to 11-02:
    # 09:15 fired at 15:21-16:09 UTC, 23:00 at 01:54-02:08 UTC). The minutes below avoid :00 and
    # :15; ops.build_log records each run's delay against its cron (schedule_delay_seconds), and
    # the runbook ("Publish SLA and the watchdog") says how to dispatch the evening run from the
    # home runner host when the lag keeps the reports past tip-off.
    - cron: "27 9 * * *" # daily, after the previous night's games are final
    - cron: "41 22 * * *" # evening: the injury reports only, after teams file (5 pm ET) and before tip-off
    # late evening, the reports and lineups again: about half an hour before the 7 pm and 10 pm ET
    # tip-offs, when confirmed lineups and late scratches come out (#816)
    - cron: "47 23 * * *"
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Which source to run (market: the season's ESPN draft order now, which the morning run otherwise lands once from the eve of the first game; with full_refresh, land it again)"
        type: choice
        options: [both, espn, stats, reports, market]
        default: both
      league:
        description: Which league
        type: choice
        options: [both, wnba, nba]
        default: both
      since:
        description: First game date (YYYY-MM-DD); default is a 7-day window ending today
        type: string
      until:
        description: Last game date (YYYY-MM-DD); default is today
        type: string
      full_refresh:
        description: Re-fetch and re-land everything in the window
        type: boolean
        default: false
      only:
        description: "Stats and ESPN: land only these, space-separated endpoint or endpoint:key (a replay)"
        type: string
        default: ""
      resettle_days:
        description: "Stats and ESPN: fetch the game payloads of the last N days again, settled or not (the leagues' late corrections)"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

env:
  LEAGUES: ${{ (inputs.league == 'wnba' && '["wnba"]') || (inputs.league == 'nba' && '["nba"]') || '["wnba","nba"]' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      leagues: ${{ steps.plan.outputs.leagues }}
      run_espn: ${{ steps.plan.outputs.run_espn }}
      run_stats: ${{ steps.plan.outputs.run_stats }}
      run_reports: ${{ steps.plan.outputs.run_reports }}
      espn_history: ${{ steps.plan.outputs.espn_history }}
    steps:
      - id: plan
        env:
          # The evening schedule runs the injury reports only.
          SOURCE: ${{ ((github.event.schedule == '41 22 * * *' || github.event.schedule == '47 23 * * *' || github.event.schedule == '17 2 * * *') && 'reports') || inputs.source || 'both' }}
          STATS_RUNNER_LABEL: ${{ vars.STATS_RUNNER_LABEL }}
        run: |
          echo "leagues=$LEAGUES" >> "$GITHUB_OUTPUT"
          # The season's draft order on demand (#847): the ESPN job's history run, nothing else.
          if [ "$SOURCE" = "market" ]; then
            {
              echo "run_reports=false"
              echo "run_espn=true"
              echo "run_stats=false"
              echo "espn_history=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "espn_history=false" >> "$GITHUB_OUTPUT"
          if [ "$SOURCE" = "both" ] || [ "$SOURCE" = "reports" ]; then
            echo "run_reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_reports=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$SOURCE" = "reports" ]; then
            echo "run_espn=false" >> "$GITHUB_OUTPUT"
            echo "run_stats=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SOURCE" != "stats" ]; then
            echo "run_espn=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_espn=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$SOURCE" != "espn" ] && [ -n "$STATS_RUNNER_LABEL" ]; then
            echo "run_stats=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_stats=false" >> "$GITHUB_OUTPUT"
            if [ "$SOURCE" != "espn" ]; then
              echo "::notice::stats job skipped: STATS_RUNNER_LABEL is not set (ADR 0002)"
            fi
          fi
      # Build lakehouse reads this from the run that triggered it: an ingest that landed only the
      # reports gets a light build of the feeds' models and their consumers, not the whole graph.
      - name: Say what this run lands
        env:
          SOURCE: ${{ ((github.event.schedule == '41 22 * * *' || github.event.schedule == '47 23 * * *' || github.event.schedule == '17 2 * * *') && 'reports') || inputs.source || 'both' }}
        run: |
          mkdir -p ingest-plan
          printf '{"source": "%s", "leagues": %s}\n' "$SOURCE" "$LEAGUES" > ingest-plan/ingest-plan.json
          cat ingest-plan/ingest-plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ingest-plan
          path: ingest-plan/ingest-plan.json
          retention-days: 3

  # One process at a time against site.api.espn.com (SPEC.md: one request at a time per host):
  # the two leagues run one after the other, and the reports job, which also reads ESPN, waits
  # for this one.
  espn:
    name: ESPN ${{ matrix.league }}
    needs: plan
    if: needs.plan.outputs.run_espn == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: lakehouse
    concurrency:
      group: espn-${{ matrix.league }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        league: ${{ fromJSON(needs.plan.outputs.leagues) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-uv
      - name: Land
        id: land
        env:
          LEAGUE: ${{ matrix.league }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          # The ingest's service principal (runbook, "The ingest's own credential"); the token
          # is the fallback while the two are unset.
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_INGEST_TOKEN || secrets.DATABRICKS_TOKEN }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
          ONLY: ${{ inputs.only }}
          RESETTLE: ${{ inputs.resettle_days }}
          HISTORY: ${{ needs.plan.outputs.espn_history }}
        run: |
          set -o pipefail
          if [ "$HISTORY" = "true" ]; then
            # the season's draft order now, under fantasy_adp (#847); landed once unless refreshed
            args=(land espn --history --league "$LEAGUE" --backend volume)
            [ "$FULL_REFRESH" = "true" ] && args+=(--full-refresh)
            uv run fs-ingest "${args[@]}" 2>&1 | tee land.log
            exit 0
          fi
          args=(land espn --league "$LEAGUE" --backend volume)
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          [ -n "$UNTIL" ] && args+=(--until "$UNTIL")
          [ "$FULL_REFRESH" = "true" ] && args+=(--full-refresh)
          for spec in $ONLY; do args+=(--only "$spec"); done
          [ -n "$RESETTLE" ] && args+=(--resettle-days "$RESETTLE")
          uv run fs-ingest "${args[@]}" 2>&1 | tee land.log
      - name: Report
        if: always()
        uses: ./.github/actions/incident
        with:
          token: ${{ github.token }}
          title: "Ingest failure: espn ${{ matrix.league }}"
          outcome: ${{ steps.land.outcome }}

  reports:
    name: Injury report ${{ matrix.league }}
    # After the ESPN job (which may be skipped, on the evening schedule, or have failed): the
    # reports feeds call ESPN too, so the two never run against the host at once.
    needs: [plan, espn]
    if: always() && needs.plan.outputs.run_reports == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: lakehouse
    concurrency:
      group: reports-${{ matrix.league }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        league: ${{ fromJSON(needs.plan.outputs.leagues) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-uv
      - name: Land
        id: land
        env:
          LEAGUE: ${{ matrix.league }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          # The ingest's service principal (runbook, "The ingest's own credential"); the token
          # is the fallback while the two are unset.
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_INGEST_TOKEN || secrets.DATABRICKS_TOKEN }}
          # Player prop lines from The Odds API (private, ADR 0008); skipped while unset.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -o pipefail
          uv run fs-ingest land reports --league "$LEAGUE" --backend volume 2>&1 | tee land.log
      - name: Report
        if: always()
        uses: ./.github/actions/incident
        with:
          token: ${{ github.token }}
          title: "Ingest failure: injury report ${{ matrix.league }}"
          outcome: ${{ steps.land.outcome }}

  stats:
    name: Stats API ${{ matrix.league }}
    needs: plan
    if: needs.plan.outputs.run_stats == 'true'
    runs-on: ${{ fromJSON(format('["self-hosted","{0}"]', vars.STATS_RUNNER_LABEL)) }}
    timeout-minutes: 120
    environment: lakehouse
    # One job per stats host at a time, across this workflow and Backfill. The two leagues are
    # two hosts, so they may run at once (there are two home runners).
    concurrency:
      group: stats-${{ matrix.league }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        league: ${{ fromJSON(needs.plan.outputs.leagues) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-uv
      - name: Land
        id: land
        env:
          LEAGUE: ${{ matrix.league }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          # The ingest's service principal (runbook, "The ingest's own credential"); the token
          # is the fallback while the two are unset.
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_INGEST_TOKEN || secrets.DATABRICKS_TOKEN }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
          ONLY: ${{ inputs.only }}
          RESETTLE: ${{ inputs.resettle_days }}
        # Regular season, then playoffs: outside the playoffs the second pass finds no games and
        # costs a few requests (what the first pass landed today is not requested again).
        run: |
          set -o pipefail
          status=0
          for season_type in "Regular Season" "Playoffs"; do
            args=(land stats --league "$LEAGUE" --backend volume --season-type "$season_type")
            [ -n "$SINCE" ] && args+=(--since "$SINCE")
            [ -n "$UNTIL" ] && args+=(--until "$UNTIL")
            [ "$FULL_REFRESH" = "true" ] && args+=(--full-refresh)
            for spec in $ONLY; do args+=(--only "$spec"); done
            [ -n "$RESETTLE" ] && args+=(--resettle-days "$RESETTLE")
            uv run fs-ingest "${args[@]}" 2>&1 | tee -a land.log || status=1
          done
          exit $status
      - name: Report
        if: always()
        uses: ./.github/actions/incident
        with:
          token: ${{ github.token }}
          title: "Ingest failure: stats ${{ matrix.league }}"
          outcome: ${{ steps.land.outcome }}
